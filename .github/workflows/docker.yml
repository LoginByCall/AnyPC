# Образ ghcr.io/loginbycall/anypc-server (amd64 + arm64) — на каждый тег выпуска.
# Ручной запуск (workflow_dispatch) — только проверка сборки, без публикации.
name: docker
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/loginbycall/anypc-server:${{ github.ref_name }}
            ghcr.io/loginbycall/anypc-server:latest
