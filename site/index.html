тема спросит, какой экран показывать и можно ли управлять. Разрешение запоминается, повторно спрашивать не будет.", "l4": "Чтобы завершить программу, нажмите «Выйти из AnyPC» во вкладке или Ctrl+C в терминале.", "lchk": "Проверить файл — сумма должна совпасть с указанной выше:", "howT": "Начать за 3 шага", "s1": "Скачайте AnyPC на оба компьютера и запустите.", "s2": "На компьютере, которым нужно управлять, задайте пароль (от 8 символов) и запишите его ID из 9 цифр.", "s3": "На другом компьютере введите этот ID и пароль и нажмите «Подключиться». Если на управляемом ПК включено подтверждение, там нужно нажать «Разрешить».", "secT": "Безопасность", "sec1": "Любое подключение требует пароль, заданный на управляемом ПК; сам пароль по сети не передаётся.", "secAsk": "Можно включить подтверждение: на каждое подключение управляемый ПК спрашивает «Разрешить / Отклонить», без ответа за 30 секунд — отказ.", "sec2": "Во время сессии на управляемом ПК всегда видно уведомление с кнопкой разрыва.", "sec3": "После 5 неверных паролей доступ временно блокируется.", "sec4": "Используйте AnyPC только на своих компьютерах или с согласия владельца.", "sec5": "Никогда не сообщайте ID и пароль тому, кто неожиданно вам позвонил, — это частая схема мошенников.", "limT": "Ограничения бета-версии", "lim1": "Ctrl+Alt+Del, окна UAC и экран блокировки пока недоступны.", "lim2": "Буфер обмена — только текст; файлы передаются кнопками на панели.", "lim3": "Несколько мониторов переключаются на панели; в Wayland монитор выбирается в системном окне при подключении.", "lim4": "Версия для Linux — бета, проверена меньше, чем версия для Windows.", "foot": "AnyPC, бета. Включает FFmpeg (GPLv3), исходный код — на ffmpeg.org. Предоставляется «как есть», без гарантий."},

const MB = { en: 'MB', ru: 'МБ', zh: 'MB', es: 'MB', de: 'MB', fr: 'Mo', it: 'MB' };
const FILES = { win: 'AnyPC.exe', lin: 'AnyPC-linux-amd64' };
const sizes = {};
let lang;

function pick() {
  const q = new URLSearchParams(location.search).get('lang');
  let saved; try { saved = localStorage.getItem('lang'); } catch {}
  for (const c of [q, saved, ...(navigator.languages || [navigator.language])]) {
    const k = (c || '').slice(0, 2).toLowerCase();
    if (T[k]) return k;
  }
  return 'en';
}
function apply(l) {
  lang = l;
  const t = k => T[l][k] ?? T.en[k] ?? ''; // ponytail: непереведённый ключ — по-английски
  document.documentElement.lang = l === 'zh' ? 'zh-CN' : l;
  document.title = 'AnyPC — ' + t('title');
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = t(e.dataset.t));
  document.querySelectorAll('#langs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === l));
  document.querySelectorAll('.size').forEach(e => e.textContent = sizes[e.dataset.f] ? ` · ${sizes[e.dataset.f]} ${MB[l]}` : '');
}

// Плашки платформ; по умолчанию — ОС посетителя.
const os = /Linux/.test(navigator.userAgent) && !/Android/.test(navigator.userAgent) ? 'lin' : 'win';
const tabs = [...document.querySelectorAll('[role=tab]')];
function show(p) {
  for (const b of tabs) {
    const on = b.dataset.p === p;
    b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1;
    document.getElementById('p-' + b.dataset.p).hidden = !on;
  }
}
tabs.forEach((b, i) => {
  b.onclick = () => show(b.dataset.p);
  b.onkeydown = e => { // стрелки — как у вкладок (WAI-ARIA)
    const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key]; if (!d) return;
    const n = tabs[(i + d + tabs.length) % tabs.length]; show(n.dataset.p); n.focus();
  };
});
show(os);


const nav = document.getElementById('langs');
for (const k in T) {
  const b = document.createElement('button');
  b.dataset.l = k; b.textContent = T[k]._; b.lang = k;
  b.onclick = () => { try { localStorage.setItem('lang', k); } catch {} apply(k); };
  nav.append(b);
}
apply(pick());

// Размеры и контрольные суммы — из каталога загрузок (обновляются вместе с файлами).
for (const f of Object.values(FILES))
  fetch('/download/' + f, { method: 'HEAD' }).then(r => {
    const n = +r.headers.get('content-length'); if (n) { sizes[f] = Math.round(n / 1048576); apply(lang); }
  }).catch(() => {});
fetch('/download/SHA256SUMS').then(r => r.ok ? r.text() : '').then(s => {
  for (const [, h, f] of s.matchAll(/^([0-9a-f]{64})\s+\*?(\S+)$/gm))
    document.querySelectorAll(`.sum[data-f="${f}"]`).forEach(e => e.textContent = h);
}).catch(() => {});
</script>
