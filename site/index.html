const MB = { en: 'MB', ru: 'МБ', zh: 'MB', es: 'MB', de: 'MB', fr: 'Mo', it: 'MB' };
let lang, sizeMB = '';

function pick() {
  const q = new URLSearchParams(location.search).get('lang');
  let saved; try { saved = localStorage.getItem('lang'); } catch {}
  for (const c of [q, saved, ...(navigator.languages || [navigator.language])]) {
    const k = (c || '').slice(0, 2).toLowerCase();
    if (T[k]) return k;
  }
  return 'en';
}
function apply(l) {
  lang = l;
  const t = T[l];
  document.documentElement.lang = l === 'zh' ? 'zh-CN' : l;
  document.title = 'AnyPC — ' + t.title;
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = t[e.dataset.t]);
  document.querySelectorAll('#langs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === l));
  $size();
}
function $size() { document.getElementById('size').textContent = sizeMB ? ` · ${sizeMB} ${MB[lang]}` : ''; }

const nav = document.getElementById('langs');
for (const k in T) {
  const b = document.createElement('button');
  b.dataset.l = k; b.textContent = T[k]._; b.lang = k;
  b.onclick = () => { try { localStorage.setItem('lang', k); } catch {} apply(k); };
  nav.append(b);
}
apply(pick());

// Размер и контрольная сумма — из каталога загрузок (обновляются вместе с файлом).
fetch('/download/AnyPC.exe', { method: 'HEAD' }).then(r => {
  const n = +r.headers.get('content-length'); if (n) { sizeMB = Math.round(n / 1048576); $size(); }
}).catch(() => {});
fetch('/download/SHA256SUMS').then(r => r.ok ? r.text() : '').then(s => {
  const h = (s.match(/^([0-9a-f]{64})\s+\*?AnyPC\.exe$/m) || [])[1];
  if (h) document.getElementById('sha').textContent = 'SHA-256: ' + h;
}).catch(() => {});
</script>
