n to share and whether to allow control. Your choice is remembered, so you won’t be asked again.", "l4": "To quit the program, click “Quit AnyPC” in the tab or press Ctrl+C in the terminal.", "lchk": "Verify the file — the checksum must match the one above:", "howT": "Get started in 3 steps", "s1": "Download AnyPC to the computer you want to control (or to both) and run it.", "s2": "On the computer you want to control, set a password (at least 8 characters) and note its 9-digit ID.", "s3": "In a browser window or on the other computer, enter that ID and password and click “Connect”. If confirmation is turned on for the controlled PC, someone there has to click “Allow”.", "secT": "Security", "sec1": "Every connection requires the password set on the controlled PC; the password itself is never sent over the network.", "secAsk": "You can turn on confirmation: the controlled PC then asks “Allow / Deny” for every connection, and no answer within 30 seconds means deny.", "sec2": "During a session, the controlled PC always shows a notice with a disconnect button.", "sec3": "After 5 wrong passwords, access is temporarily blocked.", "sec4": "Use AnyPC only on your own computers or with the owner’s consent.", "sec5": "Never give your ID and password to someone who calls you out of the blue — it’s a common scam.", "limT": "Beta limitations", "lim1": "Ctrl+Alt+Del, UAC prompts and the lock screen are not available yet.", "lim2": "Clipboard: text only; files are sent with the toolbar buttons.", "lim3": "You can switch monitors on the toolbar; on Wayland, the monitor is chosen in the system dialog when you connect.", "lim4": "The Linux version is in beta and has been tested less than the Windows version.", "foot": "AnyPC beta. Includes FFmpeg (GPLv3); source code at ffmpeg.org. Provided “as is”, without warranty."},
  ru: {"_": "Русский", "title": "Управляй компьютером с любой точки мира", "badge": "Бета · бесплатно", "lead": "AnyPC показывает экран вашего компьютера и даёт управлять им с другого — даже если оба за роутерами или в мобильной сети. Без проброса портов и регистрации.", "dl": "Скачать", "web": "Открыть веб-клиент", "req": "Windows 10/11 · Linux (X11, Wayland)", "whyT": "Почему AnyPC", "f1t": "Обходит любой NAT", "f1d": "Соединяется напрямую, когда невозможно — через сервер-ретранслятор. Роутер настраивать не нужно.", "f2t": "Сквозное шифрование", "f2d": "Экран и ввод идут по DTLS-SRTP. Ретранслятор пересылает только шифротекст.", "f3t": "Один исполняемый файл", "f3d": "Одна программа показывает ваш ID и пароль и подключается к другим ПК. Установка не нужна.", "f4t": "Плавно и отзывчиво", "f4d": "Видео H.264 до 1080p, 30 кадров/с; качество подстраивается под канал, показывает статистику соединения в реальном времени.", "getT": "Скачать AnyPC", "tab_win": "Windows", "tab_lin": "Linux", "dl_win": "Скачать для Windows", "dl_lin": "Скачать для Linux", "sys_win": "Windows 10 или 11, 64 бит", "sys_lin": "64 бит (x86-64), X11 или Wayland · бета", "sha": "Контрольная сумма SHA-256", "w1": "Запустите скачанный AnyPC.exe — установка не нужна, программа сразу показывает ID этого компьютера.", "w2": "Если появится «Система Windows защитила ваш компьютер», нажмите «Подробнее» → «Выполнить в любом случае»: программа пока не подписана сертификатом.", "w3": "Если брандмауэр Windows спросит о доступе к сети — разрешите, иначе прямое соединение может не получиться и связь пойдёт через ретранслятор.", "w4": "Чтобы к этому компьютеру можно было подключаться, задайте пароль в разделе «Это рабочее место».", "wchk": "Проверить файл (PowerShell) — сумма должна совпасть с указанной выше:", "l1": "Установите зависимости — набор зависит от графической сессии:", "l2": "Сделайте файл исполняемым и запустите — окно AnyPC откроется во вкладке браузера:", "l3": "В Wayland при первом подключении система спросит, какой экран показывать и можно ли управлять. Разрешение запоминается, повторно спрашивать не будет.", "l4": "Чтобы завершить программу, нажмите «Выйти из AnyPC» во вкладке или Ctrl+C в терминале.", "lchk": "Проверить файл — сумма должна совпасть с указанной выше:", "howT": "Начать за 3 шага", "s1": "Скачайте AnyPC на компьютер, которым надо управлять, или на оба и запустите.", "s2": "На компьютере, которым нужно управлять, задайте пароль (от 8 символов) и запишите его ID из 9 цифр.", "s3": "В окне браузера или на другом компьютере введите этот ID и пароль и нажмите «Подключиться». Если на управляемом ПК включено подтверждение, там нужно нажать «Разрешить».", "secT": "Безопасность", "sec1": "Любое подключение требует пароль, заданный на управляемом ПК; сам пароль по сети не передаётся.", "secAsk": "Можно включить подтверждение: на каждое подключение управляемый ПК спрашивает «Разрешить / Отклонить», без ответа за 30 секунд — отказ.", "sec2": "Во время сессии на управляемом ПК всегда видно уведомление с кнопкой разрыва.", "sec3": "После 5 неверных паролей доступ временно блокируется.", "sec4": "Используйте AnyPC только на своих компьютерах или с согласия владельца.", "sec5": "Никогда не сообщайте ID и пароль тому, кто неожиданно вам позвонил, — это частая схема мошенников.", "limT": "Ограничения бета-версии", "lim1": "Ctrl+Alt+Del, окна UAC и экран блокировки пока недоступны.", "lim2": "Буфер обмена — только текст; файлы передаются кнопками на панели.", "lim3": "Несколько мониторов переключаются на панели; в Wayland монитор выбирается в системном окне при подключении.", "lim4": "Версия для Linux — бета, проверена меньше, чем версия для Windows.", "foot": "AnyPC, бета. Включает FFmpeg (GPLv3), исходный код — на ffmpeg.org. Предоставляется «как есть», без гарантий."},
  zh: {"_": "中文", "title": "在世界任何地方控制您的电脑", "badge": "测试版 · 免费", "lead": "AnyPC 可以显示您电脑的屏幕，并让您从另一台电脑进行控制——即使两台电脑都在路由器之后或使用移动网络。无需端口转发，无需注册。", "dl": "下载", "web": "打开网页客户端", "req": "Windows 10/11 · Linux（X11、Wayland）", "whyT": "为什么选择 AnyPC", "f1t": "穿透任何 NAT", "f1d": "优先直接连接；无法直连时，经由中继服务器转发。无需设置路由器。", "f2t": "端到端加密", "f2d": "画面和输入通过 DTLS-SRTP 传输，中继服务器只转发密文。", "f3t": "单个可执行文件", "f3d": "同一个程序既显示您的 ID 和密码，也能连接其他电脑。无需安装。", "f4t": "流畅灵敏", "f4d": "H.264 视频，最高 1080p、每秒 30 帧；画质根据网络状况自动调整，并实时显示连接统计。", "getT": "下载 AnyPC", "tab_win": "Windows", "tab_lin": "Linux", "dl_win": "下载 Windows 版", "dl_lin": "下载 Linux 版", "sys_win": "Windows 10 或 11，64 位", "sys_lin": "64 位（x86-64），X11 或 Wayland · 测试版", "sha": "SHA-256 校验和", "w1": "运行下载的 AnyPC.exe——无需安装，程序会立即显示本机 ID。", "w2": "如果出现“Windows 已保护你的电脑”，请点击“更多信息”→“仍要运行”：本程序尚未进行代码签名。", "w3": "如果 Windows 防火墙询问是否允许网络访问，请选择允许；否则可能无法直连，流量将经由中继服务器。", "w4": "要让其他电脑能连接到本机，请在“本机”部分设置密码。", "wchk": "校验文件（PowerShell）——结果应与上方的校验和一致：", "l1": "安装依赖项——具体取决于您的图形会话：", "l2": "为文件添加执行权限并运行——AnyPC 窗口将在浏览器标签页中打开：", "l3": "在 Wayland 下，首次连接时系统会询问共享哪个屏幕以及是否允许控制。该选择会被记住，之后不会再询问。", "l4": "要退出程序，请在标签页中点击“退出 AnyPC”，或在终端中按 Ctrl+C。", "lchk": "校验文件——结果应与上方的校验和一致：", "howT": "三步开始使用", "s1": "在需要被控制的电脑（或两台电脑）上下载并运行 AnyPC。", "s2": "在需要被控制的电脑上设置密码（至少 8 个字符），并记下它的 9 位数字 ID。", "s3": "在浏览器窗口或另一台电脑上输入该 ID 和密码，然后点击“连接”。如果被控电脑开启了确认功能，需要有人在那台电脑上点击“允许”。", "secT": "安全", "sec1": "每次连接都需要被控电脑上设置的密码；密码本身从不通过网络传输。", "secAsk": "可以开启确认功能：每次有连接时，被控电脑都会询问“允许 / 拒绝”，30 秒内无人响应即拒绝。", "sec2": "会话期间，被控电脑始终显示提示，并带有断开按钮。", "sec3": "连续输错 5 次密码后，访问将被暂时锁定。", "sec4": "请仅在自己的电脑上或经所有者同意后使用 AnyPC。", "sec5": "切勿把 ID 和密码告诉突然打电话给您的人——这是常见的诈骗手法。", "limT": "测试版限制", "lim1": "暂不支持 Ctrl+Alt+Del、UAC 提示窗口和锁屏界面。", "lim2": "剪贴板仅支持文本；文件可通过工具栏按钮传输。", "lim3": "可在工具栏中切换多个显示器；在 Wayland 下，连接时在系统对话框中选择显示器。", "lim4": "Linux 版为测试版，测试程度低于 Windows 版。", "foot": "AnyPC 测试版。包含 FFmpeg（GPLv3），源代码见 ffmpeg.org。按“原样”提供，不作任何保证。"},
  es: {"_": "Español", "title": "Controla tu ordenador desde cualquier lugar del mundo", "badge": "Beta · gratis", "lead": "AnyPC muestra la pantalla de tu ordenador y te permite controlarlo desde otro, aunque ambos estén detrás de un router o en una red móvil. Sin abrir puertos y sin registro.", "dl": "Descargar", "web": "Abrir el cliente web", "req": "Windows 10/11 · Linux (X11, Wayland)", "whyT": "Por qué AnyPC", "f1t": "Atraviesa cualquier NAT", "f1d": "Se conecta directamente y, cuando no es posible, a través de un servidor de retransmisión. No hace falta configurar el router.", "f2t": "Cifrado de extremo a extremo", "f2d": "La pantalla y la entrada viajan por DTLS-SRTP. El servidor de retransmisión solo reenvía datos cifrados.", "f3t": "Un único ejecutable", "f3d": "Un mismo programa muestra tu ID y tu contraseña y se conecta a otros PC. No requiere instalación.", "f4t": "Fluido y ágil", "f4d": "Vídeo H.264 hasta 1080p a 30 fps; la calidad se adapta a la conexión y las estadísticas de conexión se muestran en tiempo real.", "getT": "Descargar AnyPC", "tab_win": "Windows", "tab_lin": "Linux", "dl_win": "Descargar para Windows", "dl_lin": "Descargar para Linux", "sys_win": "Windows 10 u 11, 64 bits", "sys_lin": "64 bits (x86-64), X11 o Wayland · beta", "sha": "Suma de comprobación SHA-256", "w1": "Ejecuta el AnyPC.exe descargado: no requiere instalación y el programa muestra al instante el ID de este equipo.", "w2": "Si aparece «Windows protegió su PC», haz clic en «Más información» → «Ejecutar de todas formas»: el programa aún no está firmado.", "w3": "Si el Firewall de Windows pide acceso a la red, permítelo; de lo contrario, puede que la conexión directa no funcione y el tráfico pase por el servidor de retransmisión.", "w4": "Para que puedan conectarse a este equipo, establece una contraseña en la sección «Este equipo».", "wchk": "Comprueba el archivo (PowerShell): la suma debe coincidir con la indicada arriba:", "l1": "Instala las dependencias, que varían según tu sesión gráfica:", "l2": "Da permiso de ejecución al archivo y ejecútalo: la ventana de AnyPC se abre en una pestaña del navegador:", "l3": "En Wayland, en la primera conexión el sistema pregunta qué pantalla compartir y si se permite el control. La elección se recuerda y no se vuelve a preguntar.", "l4": "Para cerrar el programa, haz clic en «Salir de AnyPC» en la pestaña o pulsa Ctrl+C en el terminal.", "lchk": "Comprueba el archivo: la suma debe coincidir con la indicada arriba:", "howT": "Empieza en 3 pasos", "s1": "Descarga AnyPC en el ordenador que quieres controlar (o en ambos) y ejecútalo.", "s2": "En el ordenador que quieres controlar, establece una contraseña (mínimo 8 caracteres) y anota su ID de 9 dígitos.", "s3": "En una ventana del navegador o en el otro ordenador, introduce ese ID y la contraseña y haz clic en «Conectar». Si el PC controlado tiene activada la confirmación, alguien tendrá que pulsar allí «Permitir».", "secT": "Seguridad", "sec1": "Cada conexión requiere la contraseña establecida en el PC controlado; la contraseña en sí nunca se envía por la red.", "secAsk": "Puedes activar la confirmación: el PC controlado preguntará «Permitir / Rechazar» en cada conexión y, si nadie responde en 30 segundos, se rechaza.", "sec2": "Durante una sesión, el PC controlado siempre muestra un aviso con un botón para desconectar.", "sec3": "Tras 5 contraseñas incorrectas, el acceso se bloquea temporalmente.", "sec4": "Usa AnyPC solo en tus propios ordenadores o con el consentimiento de su propietario.", "sec5": "Nunca des tu ID y tu contraseña a alguien que te llame de forma inesperada: es una estafa habitual.", "limT": "Limitaciones de la beta", "lim1": "Ctrl+Alt+Supr, las ventanas de UAC y la pantalla de bloqueo aún no están disponibles.", "lim2": "Portapapeles: solo texto; los archivos se envían con los botones de la barra.", "lim3": "Puedes cambiar de monitor desde la barra; en Wayland, el monitor se elige en el diálogo del sistema al conectarte.", "lim4": "La versión para Linux está en beta y se ha probado menos que la de Windows.", "foot": "AnyPC beta. Incluye FFmpeg (GPLv3); código fuente en ffmpeg.org. Se ofrece «tal cual», sin garantía."},
  de: {"_": "Deutsch", "title": "Steuern Sie Ihren Computer von überall auf der Welt", "badge": "Beta · kostenlos", "lead": "AnyPC zeigt den Bildschirm Ihres Computers und lässt Sie ihn von einem anderen aus steuern – auch wenn beide hinter Routern oder im Mobilfunknetz sind. Ohne Portweiterleitung, ohne Registrierung.", "dl": "Herunterladen", "web": "Web-Client öffnen", "req": "Windows 10/11 · Linux (X11, Wayland)", "whyT": "Warum AnyPC", "f1t": "Funktioniert hinter jedem NAT", "f1d": "Verbindet direkt; wo das nicht geht, über einen Relay-Server. Am Router müssen Sie nichts einstellen.", "f2t": "Ende-zu-Ende-Verschlüsselung", "f2d": "Bild und Eingaben laufen über DTLS-SRTP. Der Relay-Server leitet nur verschlüsselte Daten weiter.", "f3t": "Eine einzige ausführbare Datei", "f3d": "Ein Programm zeigt Ihre ID und Ihr Passwort an und verbindet sich mit anderen PCs. Keine Installation nötig.", "f4t": "Flüssig und reaktionsschnell", "f4d": "H.264-Video bis 1080p mit 30 fps; die Qualität passt sich der Verbindung an, die Verbindungsstatistik wird live angezeigt.", "getT": "AnyPC herunterladen", "tab_win": "Windows", "tab_lin": "Linux", "dl_win": "Für Windows herunterladen", "dl_lin": "Für Linux herunterladen", "sys_win": "Windows 10 oder 11, 64 Bit", "sys_lin": "64 Bit (x86-64), X11 oder Wayland · Beta", "sha": "SHA-256-Prüfsumme", "w1": "Starten Sie die heruntergeladene AnyPC.exe – eine Installation ist nicht nötig, das Programm zeigt sofort die ID dieses Computers an.", "w2": "Erscheint „Der Computer wurde durch Windows geschützt“, klicken Sie auf „Weitere Informationen“ → „Trotzdem ausführen“: Das Programm ist noch nicht signiert.", "w3": "Fragt die Windows-Firewall nach dem Netzwerkzugriff, erlauben Sie ihn – sonst kommt eine direkte Verbindung womöglich nicht zustande, und die Daten laufen über den Relay-Server.", "w4": "Damit sich andere mit diesem Computer verbinden können, legen Sie im Bereich „Dieser Computer“ ein Passwort fest.", "wchk": "Datei prüfen (PowerShell) – die Prüfsumme muss mit der oben angegebenen übereinstimmen:", "l1": "Installieren Sie die Abhängigkeiten – welche, hängt von Ihrer grafischen Sitzung ab:", "l2": "Machen Sie die Datei ausführbar und starten Sie sie – das AnyPC-Fenster öffnet sich in einem Browser-Tab:", "l3": "Unter Wayland fragt das System bei der ersten Verbindung, welcher Bildschirm geteilt werden soll und ob die Steuerung erlaubt ist. Die Freigabe wird gespeichert, Sie werden nicht erneut gefragt.", "l4": "Zum Beenden klicken Sie im Tab auf „AnyPC beenden“ oder drücken im Terminal Strg+C.", "lchk": "Datei prüfen – die Prüfsumme muss mit der oben angegebenen übereinstimmen:", "howT": "In 3 Schritten loslegen", "s1": "Laden Sie AnyPC auf den Computer herunter, den Sie steuern möchten (oder auf beide), und starten Sie es.", "s2": "Legen Sie auf dem zu steuernden Computer ein Passwort fest (mindestens 8 Zeichen) und notieren Sie seine 9-stellige ID.", "s3": "Geben Sie im Browserfenster oder auf dem anderen Computer diese ID und das Passwort ein und klicken Sie auf „Verbinden“. Ist auf dem gesteuerten PC die Bestätigung aktiviert, muss dort jemand auf „Erlauben“ klicken.", "secT": "Sicherheit", "sec1": "Jede Verbindung erfordert das auf dem gesteuerten PC festgelegte Passwort; das Passwort selbst wird nie über das Netzwerk übertragen.", "secAsk": "Optional lässt sich eine Bestätigung aktivieren: Der gesteuerte PC fragt dann bei jeder Verbindung „Erlauben / Ablehnen“; ohne Antwort binnen 30 Sekunden wird abgelehnt.", "sec2": "Während einer Sitzung zeigt der gesteuerte PC stets einen Hinweis mit einer Schaltfläche zum Trennen.", "sec3": "Nach 5 falschen Passwörtern wird der Zugang vorübergehend gesperrt.", "sec4": "Verwenden Sie AnyPC nur auf eigenen Computern oder mit Zustimmung des Besitzers.", "sec5": "Geben Sie ID und Passwort niemals an jemanden weiter, der Sie unerwartet anruft – das ist eine verbreitete Betrugsmasche.", "limT": "Einschränkungen der Beta", "lim1": "Strg+Alt+Entf, UAC-Abfragen und der Sperrbildschirm sind noch nicht verfügbar.", "lim2": "Zwischenablage: nur Text; Dateien werden über die Schaltflächen der Leiste übertragen.", "lim3": "Zwischen mehreren Monitoren wechseln Sie in der Leiste; unter Wayland wird der Monitor beim Verbinden im Systemdialog gewählt.", "lim4": "Die Linux-Version ist eine Beta und weniger getestet als die Windows-Version.", "foot": "AnyPC Beta. Enthält FFmpeg (GPLv3), Quellcode unter ffmpeg.org. Bereitgestellt „wie besehen“, ohne Gewährleistung."},
  fr: {"_": "Français", "title": "Contrôlez votre ordinateur depuis n’importe où dans le monde", "badge": "Bêta · gratuit", "lead": "AnyPC affiche l’écran de votre ordinateur et vous permet de le contrôler depuis un autre, même si les deux sont derrière un routeur ou sur un réseau mobile. Sans redirection de ports ni inscription.", "dl": "Télécharger", "web": "Ouvrir le client web", "req": "Windows 10/11 · Linux (X11, Wayland)", "whyT": "Pourquoi AnyPC", "f1t": "Traverse tous les NAT", "f1d": "Connexion directe ; quand ce n’est pas possible, via un serveur relais. Rien à configurer sur le routeur.", "f2t": "Chiffrement de bout en bout", "f2d": "L’écran et les saisies transitent par DTLS-SRTP. Le serveur relais ne transmet que des données chiffrées.", "f3t": "Un seul fichier exécutable", "f3d": "Un même programme affiche votre ID et votre mot de passe et se connecte à d’autres PC. Aucune installation.", "f4t": "Fluide et réactif", "f4d": "Vidéo H.264 jusqu’en 1080p à 30 i/s ; la qualité s’adapte à la connexion et les statistiques de connexion s’affichent en temps réel.", "getT": "Télécharger AnyPC", "tab_win": "Windows", "tab_lin": "Linux", "dl_win": "Télécharger pour Windows", "dl_lin": "Télécharger pour Linux", "sys_win": "Windows 10 ou 11, 64 bits", "sys_lin": "64 bits (x86-64), X11 ou Wayland · bêta", "sha": "Somme de contrôle SHA-256", "w1": "Lancez le fichier AnyPC.exe téléchargé : aucune installation n’est nécessaire, le programme affiche aussitôt l’ID de cet ordinateur.", "w2": "Si le message « Windows a protégé votre ordinateur » s’affiche, cliquez sur « Informations complémentaires » → « Exécuter quand même » : le programme n’est pas encore signé.", "w3": "Si le pare-feu Windows demande l’accès au réseau, autorisez-le ; sinon, la connexion directe risque d’échouer et le trafic passera par le serveur relais.", "w4": "Pour que l’on puisse se connecter à cet ordinateur, définissez un mot de passe dans la section « Cet ordinateur ».", "wchk": "Vérifier le fichi const MB = { en: 'MB', ru: 'МБ', zh: 'MB', es: 'MB', de: 'MB', fr: 'Mo', it: 'MB' };
const FILES = { win: 'AnyPC.exe', lin: 'AnyPC-linux-amd64' };
const sizes = {};
let lang;

function pick() {
  const q = new URLSearchParams(location.search).get('lang');
  let saved; try { saved = localStorage.getItem('lang'); } catch {}
  for (const c of [q, saved, ...(navigator.languages || [navigator.language])]) {
    const k = (c || '').slice(0, 2).toLowerCase();
    if (T[k]) return k;
  }
  return 'en';
}
function apply(l) {
  lang = l;
  const t = k => T[l][k] ?? T.en[k] ?? ''; // ponytail: непереведённый ключ — по-английски
  document.documentElement.lang = l === 'zh' ? 'zh-CN' : l;
  document.title = 'AnyPC — ' + t('title');
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = t(e.dataset.t));
  document.querySelectorAll('#langs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === l));
  document.querySelectorAll('.size').forEach(e => e.textContent = sizes[e.dataset.f] ? ` · ${sizes[e.dataset.f]} ${MB[l]}` : '');
}

// Плашки платформ; по умолчанию — ОС посетителя.
const os = /Linux/.test(navigator.userAgent) && !/Android/.test(navigator.userAgent) ? 'lin' : 'win';
const tabs = [...document.querySelectorAll('[role=tab]')];
function show(p) {
  for (const b of tabs) {
    const on = b.dataset.p === p;
    b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1;
    document.getElementById('p-' + b.dataset.p).hidden = !on;
  }
}
tabs.forEach((b, i) => {
  b.onclick = () => show(b.dataset.p);
  b.onkeydown = e => { // стрелки — как у вкладок (WAI-ARIA)
    const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key]; if (!d) return;
    const n = tabs[(i + d + tabs.length) % tabs.length]; show(n.dataset.p); n.focus();
  };
});
show(os);


const nav = document.getElementById('langs');
for (const k in T) {
  const b = document.createElement('button');
  b.dataset.l = k; b.textContent = T[k]._; b.lang = k;
  b.onclick = () => { try { localStorage.setItem('lang', k); } catch {} apply(k); };
  nav.append(b);
}
apply(pick());

// Размеры и контрольные суммы — из каталога загрузок (обновляются вместе с файлами).
for (const f of Object.values(FILES))
  fetch('/download/' + f, { method: 'HEAD' }).then(r => {
    const n = +r.headers.get('content-length'); if (n) { sizes[f] = Math.round(n / 1048576); apply(lang); }
  }).catch(() => {});
fetch('/download/SHA256SUMS').then(r => r.ok ? r.text() : '').then(s => {
  for (const [, h, f] of s.matchAll(/^([0-9a-f]{64})\s+\*?(\S+)$/gm))
    document.querySelectorAll(`.sum[data-f="${f}"]`).forEach(e => e.textContent = h);
}).catch(() => {});
</script>
