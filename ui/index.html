<style>
  :root { --bg: #f6f6f4; --card: #fff; --fg: #1a1a1a; --mut: #6b6b6b; --line: #ddd; --acc: #c0392b; --ok: #2e7d32; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161616; --card: #202020; --fg: #eee; --mut: #9a9a9a; --line: #333; --acc: #e57368; --ok: #81c784; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  button, input { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); }
  button { cursor: pointer; } button.main { background: var(--acc); color: #fff; border-color: var(--acc); }
  .hidden { display: none !important; }
  .eye { padding: 4px 8px; } .eye.on { background: var(--acc); color: #fff; }
  body.nostat #sum, body.nostat #csv, body.nostat #reset, body.nostat:not(.view) #st { display: none; } /* кнопка «Статистика»; «только просмотр» в #st видно всегда */
  body.view [data-keys], body.view #fsend, body.view #fget, body.view #clipbtn { display: none !important; } /* только просмотр: хост это всё равно отбросит */
  .mut { color: var(--mut); } .mono { font-family: ui-monospace, monospace; }
  #home { display: flex; gap: 16px; padding: 16px; flex-wrap: wrap; align-items: flex-start; overflow: auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; flex: 1 1 320px; display: flex; flex-direction: column; gap: 10px; }
  .card h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .big { font-size: 28px; letter-spacing: 2px; font-family: ui-monospace, monospace; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .banner { border: 1px solid var(--acc); border-radius: 8px; padding: 10px; }
  #recent button { font-family: ui-monospace, monospace; }
  #msg { color: var(--acc); min-height: 1.2em; }
  #sess { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #bar { display: flex; gap: 6px; padding: 6px 8px; flex-wrap: wrap; align-items: center; background: var(--card); border-bottom: 1px solid var(--line); }
  #bar button { padding: 4px 8px; }
  #dl { position: relative; } #dlbtn { display: inline-flex; align-items: center; gap: 4px; }
  #dlpop { position: absolute; top: calc(100% + 4px); right: 0; z-index: 5; width: min(380px, 90vw); max-height: 50vh; overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 24px #0003; padding: 4px; }
  .xf { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; align-items: center; padding: 6px; border-radius: 6px; }
  .xf + .xf { border-top: 1px solid var(--line); } .xf .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .xf progress { grid-column: 2 / 4; width: 100%; height: 6px; accent-color: var(--acc); } .xf .st { grid-column: 2 / 4; font-size: 12px; }
  video { flex: 1; min-height: 0; width: 100%; background: #000; object-fit: contain; outline: none; }
  #cur { position: fixed; pointer-events: none; z-index: 5; }
  #hstate { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; max-width: calc(100vw - 32px); padding: 12px 18px; border-radius: 8px; background: rgba(0, 0, 0, .75); color: #fff; text-align: center; pointer-events: none; }
  .seg { display: inline-flex; } .seg button { border-radius: 0; } .seg button:first-child { border-radius: 6px 0 0 6px; } .seg button:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
  .seg button[aria-pressed="true"] { background: var(--acc); color: #fff; border-color: var(--acc); }
  body.fs #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 2; transform: translateY(calc(-100% + 4px)); transition: transform .15s; opacity: .95; }
  body.fs #bar:hover { transform: none; }
  .qbtn, #bar .qbtn { width: 28px; height: 28px; padding: 0; border-radius: 50%; font-weight: 700; flex: none; }
  #mic.on, #hmic.on { background: var(--acc); color: #fff; border-color: var(--acc); } #aplay { position: fixed; right: 16px; bottom: 16px; z-index: 5; }
  #helpbtn { position: fixed; top: 6px; right: 6px; z-index: 3; } #bar .qbtn { width: 26px; height: 26px; }
  #help { position: fixed; inset: 0; z-index: 30; background: #0007; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #help .dlg { background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 40px #0005; width: min(600px, 100%); max-height: 100%; overflow: auto; padding: 14px 20px 18px; }
  #help .dlg h2 { margin: 0; font-size: 17px; flex: 1; } #helpx { font-size: 18px; line-height: 1; padding: 4px 10px; }
  #helpbody h3 { font-size: 14px; margin: 16px 0 4px; } #helpbody p { margin: 4px 0; line-height: 1.45; } #helpbody a, #tip a { color: var(--acc); }

  #tour { position: fixed; inset: 0; z-index: 20; pointer-events: none; } /* выше #dlpop; клики по странице не перехватывает — только сама выноска */
  #tring { position: fixed; border: 2px solid var(--acc); border-radius: 8px; box-shadow: 0 0 0 9999px #0003; transition: left .2s, top .2s, width .2s, height .2s; }
  #tip { position: fixed; pointer-events: auto; background: var(--card); color: var(--fg); border: 1px solid var(--acc); border-radius: 10px; box-shadow: 0 8px 28px #0004; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; line-height: 1.4; }
  #tip::before { content: ''; position: absolute; left: calc(var(--ax, 50%) - 7px); width: 12px; height: 12px; background: var(--card); border: 1px solid var(--acc); transform: rotate(45deg); }
  #tip[data-side="b"]::before { top: -7px; border-right: none; border-bottom: none; } #tip[data-side="t"]::before { bottom: -7px; border-left: none; border-top: none; }
  #tip .row { justify-content: flex-end; } #tipn { margin-right: auto; font-size: 12px; } #tip button { padding: 4px 10px; }

const HUBS = (window.ANYPC?.ws || (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws').split(',').map(u => u.trim()).filter(Boolean);
const httpOf = u => u.replace(/^ws/, 'http').replace(/\/ws$/, '');
const APP = typeof window.hostInfo === 'function'; // открыто в AnyPC.exe
if (!APP) fetch(httpOf(HUBS[0]) + '/hubs').then(r => r.json()).then(l => { for (const u of l) if (!HUBS.includes(u)) HUBS.push(u); }).catch(() => {});

ice shows 🎤. Sound needs the AnyPC window open on the remote PC; if you hear nothing, click “🔈 Click to hear the remote PC”. Headphones prevent echo. View only does not turn sound off.", help_files_h: "Files", help_files: "“Send file” copies a file from this PC to the remote one; you can also drop a file onto the remote screen. “Get file” opens a file picker on the remote PC to fetch a file from it.", help_files2: "Files are saved to the Downloads folder of the receiving PC. The transfers button on the session bar shows progress and the list of files. If a transfer breaks off, send the file again and it resumes where it stopped.", help_clip_h: "Clipboard", help_clip: "Text copied on the remote PC lands in the clipboard of this PC. Text copied here goes there automatically in the AnyPC program; in a browser press Ctrl+V in the session window or use “Send clipboard”.", help_keys_h: "Special keys", help_keys: "Some key combinations are caught by this PC and never reach the remote one. Use the buttons on the session bar instead: “Win” opens the Start menu, “Alt+Tab” switches windows, “Ctrl+Shift+Esc” opens Task Manager.", help_sec_h: "Security", help_sec: "During a session the remote PC always shows a notice that it is being controlled. Its “Disconnect” button ends the session at once, so the person there can stop you at any moment.", help_sec2: "Every PC has its own key; its fingerprint is shown under the ID. AnyPC remembers the key of each PC you connect to. If the key changes, you get a warning: unless AnyPC was reinstalled on that PC, do not connect, someone may be posing as it.", help_site: "Downloads, news and answers: [www.anypc.org](https://www.anypc.org)", tour_next: "Next", tour_skip: "Skip", tour_done: "Done", tour_of: "{n} of {m}", tour_id: "This is the ID of this PC. Give it, together with the password, to whoever will connect to you.", tour_pw: "Set a password for this PC here. Without it nobody can connect.", tour_go: "To connect to another PC, enter its   ru: { help_b: "Справка", help_h: "Как пользоваться AnyPC", help_x: "Закрыть", help_tour: "Показать подсказки снова", help_about_h: "Что такое AnyPC", help_about: "AnyPC показывает экран другого компьютера и даёт работать на нём своей мышью и клавиатурой — будто вы сидите перед ним. Соединение шифруется. Картинка идёт напрямую между двумя ПК, а если напрямую не выходит — через сервер-ретранслятор.", help_conn_h: "Как подключиться к другому ПК", help_conn: "Узнайте у человека за удалённым ПК его ID (9 цифр) и пароль. Введите их в блоке «Удалённое рабочее место» и нажмите «Подключиться».", help_conn2: "Если удалённый ПК спрашивает подтверждение, подождите, пока там ответят. ID, к которым вы уже подключались, видны в «Недавних» — щелчок подставит ID.", help_host_h: "Как разрешить подключаться к этому ПК", help_host: "Без пароля к этому ПК не подключится никто. Задайте пароль от 8 символов в блоке «Это рабочее место» и сообщайте его вместе с ID только тем, кому доверяете.", help_host2: "Если включено «Спрашивать перед каждым входящим подключением», на каждую попытку появится окно с тремя ответами. «Разрешить» — даёт управление, «Только просмотр» — показывает экран без управления, «Отклонить» — отказ. Нет ответа 30 секунд — тоже отказ.", help_turbo_h: "Турбо (VP9)", help_turbo: "Турбо передаёт видео в VP9 вместо H.264: текст чётче, трафика меньше. Если удалённый ПК не умеет VP9, AnyPC просто возьмёт H.264.", help_view_h: "Только просмотр", help_view: "Вы видите удалённый экран, но мышь, клавиатура, буфер обмена и файлы не передаются. Удобно, когда нужно только посмотреть. Человек за удалённым ПК тоже может выбрать этот режим в окне «Разрешить».", help_audio_h: "Звук (микрофоны)", help_audio: "Каждый сам включает и выключает свой микрофон кнопкой 🎤: управляющий — на панели сессии, человек за удалённым ПК — в окне AnyPC на нём. По умолчанию оба выключены; в первый раз браузер спросит доступ к микрофону. Пока микрофон удалённого ПК включён, на его плашке видно 🎤. Для звука на удалённом ПК должно быть открыто окно AnyPC; если ничего не слышно, нажмите «🔈 Нажмите, чтобы слышать удалённый ПК». Наушники убирают эхо. «Только просмотр» звук не отключает.", help_files_h: "Файлы", help_files: "«Отправить файл» копирует файл с этого ПК на удалённый; можно и просто перетащить файл на удалённый экран. «Получить файл» открывает выбор файла на удалённом ПК, чтобы забрать файл оттуда.", help_files2: "Файлы сохраняются в папку «Загрузки» на принимающем ПК. Кнопка передач на панели сессии показывает ход и список файлов. Если передача оборвалась, отправьте файл ещё раз — она продолжится с места обрыва.", help_clip_h: "Буфер обмена", help_clip: "Текст, скопированный на удалённом ПК, попадает в буфер обмена этого ПК. Скопированное здесь в программе AnyPC уходит туда само, а в браузере нажмите Ctrl+V в окне сессии или кнопку «Передать буфер».", help_keys_h: "Особые клавиши", help_keys: "Некоторые сочетания перехватывает сам этот ПК, и до удалённого они не доходят. Для них есть кнопки на панели сессии: «Win» открывает меню «Пуск», «Alt+Tab» переключает окна, «Ctrl+Shift+Esc» открывает диспетчер задач.", help_sec_h: "Безопасность", help_sec: "Пока идёт сессия, на удалённом ПК всегда видна плашка о том, что им управляют. Кнопка «Разорвать» на ней сразу завершает сессию — человек там может остановить вас в любой момент.", help_sec2: "У каждого ПК свой ключ, его отпечаток показан под ID. AnyPC запоминает ключ каждого ПК, к которому вы подключались. Если ключ сменился, появится предупреждение: если AnyPC там не переустанавливали, не подключайтесь — кто-то может выдавать себя за этот ПК.", help_site: "Скачать программу, новости и ответы на вопросы: [www.anypc.org](https://www.anypc.org)", tour_next: "Далее", tour_skip: "Пропустить", tour_done: "Готово", tour_of: "{n} из {m}", tour_id: "Это ID этого ПК. Сообщите его вместе с паролем тому, кто будет к вам подключаться.", tour_pw: "Здесь задаётся пароль этого ПК. Без пароля подключиться к нему нельзя.", tour_go: "Чтобы подключиться к другому ПК, введите его ID и пароль и нажмите «Подключиться».", tour_opts: "«Турбо» делает текст чётче и экономит трафик. «Только просмотр» показывает удалённый экран без управления.", tour_help: "Что-то забыли? Кнопка «?» открывает справку.", tour_bye: "«Разорвать» сразу завершает сессию.", tour_fs: "В полноэкранном режиме эта панель прячется. Подведите мышь к верхнему краю экрана, и она вернётся.", tour_files: "Здесь отправляют и получают файлы. Полученное сохраняется в «Загрузки», ход передачи видно на кнопке передач.",

  zh: { help_b: "帮助", help_h: "AnyPC 使用说明", help_x: "关闭", help_tour: "再次显示提示", help_about_h: "AnyPC 是什么", help_about: "AnyPC 能显示另一台电脑的屏幕，让您用自己的鼠标和键盘操作它，就像坐在它面前一样。连接是加密的。画面尽量在两台电脑之间直接传输，无法直连时经由中继服务器。", help_conn_h: "连接到另一台电脑", help_conn: "向远程电脑那边的人要它的 ID（9 位数字）和密码。在“远程电脑”中填入，然后点“连接”。", help_conn2: "如果远程电脑需要确认，请等那边的人回应。连接过的 ID 会出现在“最近”中，点一下即可填入。", help_host_h: "允许别人连接到本机", help_host: "没有密码，谁也连不上本机。在“本机”中设置至少 8 个字符的密码，并只把它和您的 ID 告诉信任的人。", help_host2: "开启“每次传入连接前询问”后，每次连接都会弹出窗口，有三个选项：“允许”交出控制权，“仅查看”只显示屏幕、不能控制，“拒绝”则不让连接。30 秒内不回应也视为拒绝。", help_turbo_h: "加速 (VP9)", help_turbo: "加速模式用 VP9 代替 H.264 传输视频：文字更清晰，流量更少。如果远程电脑不支持 VP9，AnyPC 会自动改用 H.264。", help_view_h: "仅查看", help_view: "您能看到远程屏幕，但不会发送鼠标、键盘、剪贴板和文件。只需要看一看时很方便。远程电脑那边的人也可以在“允许”窗口中选择这一模式。", help_audio_h: "声音（麦克风）", help_audio: "每个人用 🎤 按钮自己开关自己的麦克风：控制的一方在会话工具栏中，远程电脑那边的人在该电脑的 AnyPC 窗口中。两者默认都关闭；第一次开启时浏览器会请求麦克风权限。远程电脑的麦克风开启期间，它的提示条上显示 🎤。声音需要远程电脑上打开 AnyPC 窗口；如果听不到声音，请点“🔈 点击收听远程电脑”。戴耳机可避免回声。“仅查看”不会关闭声音。", help_files_h: "文件", help_files: "“发送文件”把本机的文件复制到远程电脑，也可以直接把文件拖到远程屏幕上。“获取文件”会在远程电脑上打开文件选择窗口，从那里取回文件。", help_files2: "文件保存在接收方电脑的“下载”文件夹中。会话栏上的传输按钮显示进度和文件列表。传输中断时，再发送一次同一文件即可从断点继续。", help_clip_h: "剪贴板", help_clip: "在远程电脑上复制的文字会进入本机剪贴板。在 AnyPC 程序中，本机复制的文字会自动发过去；在浏览器中请在会话窗口按 Ctrl+V，或点“发送剪贴板”。", help_keys_h: "特殊按键", help_keys: "有些组合键会被本机自己截获，到不了远程电脑。请改用会话栏上的按钮：“Win”打开开始菜单，“Alt+Tab”切换窗口，“Ctrl+Shift+Esc”打开任务管理器。", help_sec_h: "安全", help_sec: "会话期间，远程电脑上始终显示一个提示条，表明它正被控制。提示条上的“断开”按钮会立即结束会话，那边的人随时可以让您停下。", help_sec2: "每台电脑都有自己的密钥，其指纹显示在 ID 下方。AnyPC 会记住您连接过的每台电脑的密钥。如果密钥变了，会出现警告：除非那台电脑重装过 AnyPC，否则不要连接，可能有人在冒充它。", help_site: "下载、新闻和常见问题：[www.anypc.org](https://www.anypc.org)", tour_next: "下一步", tour_skip: "跳过", tour_done: "完成", tour_of: "{n} / {m}", tour_id: "这是本机的 ID。把它和密码一起告诉要连接您的人。", tour_pw: "在这里设置本机密码。没有密码，谁也连不上。", tour_go: "要连接另一台电脑，输入它的 ID 和密码，然后点“连接”。", tour_opts: "“加速”让文字更清晰、更省流量。“仅查看”只显示远程屏幕，不进行控制。", tour_help: "忘了怎么用？“?”按钮可以打开帮助。", tour_bye: "“断开”会立即结束会话。", tour_fs: "全屏时这个工具栏会隐藏。把鼠标移到屏幕顶端，它就会出现。", tour_files: "在这里发送和获取文件。收到的文件保存在“下载”文件夹，传输按钮显示进度。",

  es: { help_b: "Ayuda", help_h: "Cómo funciona AnyPC", help_x: "Cerrar", help_tour: "Volver a mostrar los consejos", help_about_h: "Qué es AnyPC", help_about: "AnyPC muestra la pantalla de otro equipo y te deja usarlo con tu propio ratón y teclado, como si estuvieras delante. La conexión va cifrada. La imagen viaja directamente entre los dos PC siempre que se puede y, si no, a través de un servidor de retransmisión.", help_conn_h: "Conectarse a otro PC", help_conn: "Pide a quien está en el PC remoto su ID (9 dígitos) y la contraseña. Escríbelos en «Equipo remoto» y pulsa «Conectar».", help_conn2: "Si el PC remoto pide confirmación, espera a que alguien responda allí. Los ID que ya has usado aparecen en «Recientes»: un clic rellena el ID.", help_host_h: "Permitir que se conecten a este PC", help_host: "Nadie puede conectarse a este PC sin contraseña. Pon una de al menos 8 caracteres en «Este equipo» y dásela, junto con tu ID, solo a personas de confianza.", help_host2: "Con «Preguntar antes de cada conexión entrante» activado, cada intento abre una ventana con tres respuestas. «Permitir» da el control, «Solo ver» muestra la pantalla sin control y «Rechazar» lo impide. Si nadie responde en 30 segundos, se rechaza.", help_turbo_h: "Turbo (VP9)", help_turbo: "Turbo envía el vídeo en VP9 en lugar de H.264: el texto se ve más nítido y se gasta menos tráfico. Si el PC remoto no admite VP9, AnyPC usa H.264 sin más.", help_view_h: "Solo ver", help_view: "Ves la pantalla remota, pero no se envían el ratón, el teclado, el portapapeles ni los archivos. Útil cuando solo hace falta mirar. Quien está en el PC remoto también puede elegir este modo en la ventana «Permitir».", help_audio_h: "Sonido (micrófonos)", help_audio: "Cada uno activa y desactiva su propio micrófono con el botón 🎤: quien controla, en la barra de la sesión; quien está en el PC remoto, en la ventana de AnyPC de ese PC. Los dos están desactivados por defecto; la primera vez el navegador pide acceso al micrófono. Mientras el micrófono del PC remoto está activado, su aviso muestra 🎤. Para el sonido, en el PC remoto tiene que estar abierta la ventana de AnyPC; si no oyes nada, pulsa «🔈 Haz clic para oír el PC remoto». Con auriculares no hay eco. «Solo ver» no desactiva el sonido.", help_files_h: "Archivos", help_files: "«Enviar archivo» copia un archivo de este PC al remoto; también puedes soltarlo sobre la pantalla remota. «Recibir archivo» abre un selector de archivos en el PC remoto para traerte un archivo de allí.", help_files2: "Los archivos se guardan en la carpeta Descargas del PC que los recibe. El botón de transferencias de la barra de sesión muestra el progreso y la lista de archivos. Si una transferencia se corta, envía el archivo otra vez y seguirá donde se quedó.", help_clip_h: "Portapapeles", help_clip: "El texto copiado en el PC remoto llega al portapapeles de este PC. En el programa AnyPC, lo que copias aquí pasa allí solo; en el navegador pulsa Ctrl+V en la ventana de la sesión o usa «Enviar portapapeles».", help_keys_h: "Teclas especiales", help_keys: "Algunas combinaciones las captura este PC y nunca llegan al remoto. Para ellas están los botones de la barra de sesión: «Win» abre el menú Inicio, «Alt+Tab» cambia de ventana y «Ctrl+Shift+Esc» abre el Administrador de tareas.", help_sec_h: "Seguridad", help_sec: "Durante la sesión, el PC remoto muestra siempre un aviso de que lo están controlando. Su botón «Desconectar» corta la sesión al instante: quien está allí puede pararte en cualquier momento.", help_sec2: "Cada PC tiene su propia clave; su huella aparece bajo el ID. AnyPC recuerda la clave de cada PC al que te conectas. Si la clave cambia, verás un aviso: si no se reinstaló AnyPC en ese PC, no te conectes, alguien podría estar haciéndose pasar por él.", help_site: "Descargas, novedades y respuestas: [www.anypc.org](https://www.anypc.org)", tour_next: "Siguiente", tour_skip: "Omitir", tour_done: "Listo", tour_of: "{n} de {m}", tour_id: "Este es el ID de este PC. Dáselo, junto con la contraseña, a quien vaya a conectarse contigo.", tour_pw: "Aquí se pone la contraseña de este PC. Sin ella nadie puede conectarse.", tour_go: "Para conectarte a otro PC, escribe su ID y su contraseña y pulsa «Conectar».", tour_opts: "«Turbo» hace el texto más nítido y ahorra tráfico. «Solo ver» muestra la pantalla remota sin controlarla.", tour_help: "¿Se te olvidó algo? El botón «?» abre la ayuda.", tour_bye: "«Desconectar» termina la sesión al momento.", tour_fs: "En pantalla completa esta barra se oculta. Lleva el ratón al borde superior de la pantalla para que vuelva.", tour_files: "Aquí se envían y reciben archivos. Lo recibido va a Descargas; el botón de transferencias muestra el progreso.",
    node_l: "Servidor propio", node_t: "Tu propio nodo AnyPC (install.sh en tu VPS). Vacío: servidores de AnyPC. Una conexión puntual por otro nodo: ID@nodo en el campo ID.", node_p: "my.example.com — vacío: servidores de AnyPC", node_save: "Guardar", nodepub_l: "seguir también en la red AnyPC", node_chk: "Comprobando el nodo…", node_ok: "Guardado: este PC ahora está registrado en: ", node_bad: "No guardado: ", id_node: "Dirección de nodo no válida tras @", upd: "Versión %s disponible — actualizar", ff_dl: "Descargando el componente FFmpeg (una sola vez):", ff_err: "No se pudo descargar FFmpeg: comprueba la conexión a internet; se reintenta cada 30 s", turn_l: "Servidor de retransmisión", turn_t: "Solo se usa si no es posible la conexión directa. Ping: desde este PC + desde el PC remoto (se conoce al conectar).", auto: "Auto", ms: "ms",

  de: { help_b: "Hilfe", help_h: "So funktioniert AnyPC", help_x: "Schließen", help_tour: "Tipps erneut anzeigen", help_about_h: "Was AnyPC ist", help_about: "AnyPC zeigt den Bildschirm eines anderen Computers und lässt Sie ihn mit Ihrer eigenen Maus und Tastatur bedienen, als säßen Sie davor. Die Verbindung ist verschlüsselt. Das Bild läuft nach Möglichkeit direkt zwischen den beiden PCs, sonst über einen Relay-Server.", help_conn_h: "Mit einem anderen PC verbinden", help_conn: "Lassen Sie sich von der Person am entfernten PC dessen ID (9 Ziffern) und Passwort geben. Tragen Sie beides unter „Entfernter Computer“ ein und klicken Sie auf „Verbinden“.", help_conn2: "Fragt der entfernte PC nach einer Bestätigung, warten Sie, bis dort jemand antwortet. Bereits genutzte IDs stehen unter „Zuletzt“; ein Klick setzt die ID ein.", help_host_h: "Verbindungen zu diesem PC erlauben", help_host: "Ohne Passwort kann sich niemand mit diesem PC verbinden. Legen Sie unter „Dieser Computer“ eines mit mindestens 8 Zeichen fest und geben Sie es zusammen mit Ihrer ID nur Menschen, denen Sie vertrauen.", help_host2: "Ist „Vor jeder eingehenden Verbindung fragen“ aktiv, öffnet jeder Versuch ein Fenster mit drei Antworten. „Erlauben“ gibt die Steuerung frei, „Nur ansehen“ zeigt den Bildschirm ohne Steuerung, „Ablehnen“ weist ab. Ohne Antwort innerhalb von 30 Sekunden wird abgelehnt.", help_turbo_h: "Turbo (VP9)", help_turbo: "Turbo überträgt das Video als VP9 statt H.264: Text wirkt schärfer, und es fällt weniger Datenverkehr an. Kann der entfernte PC kein VP9, nimmt AnyPC einfach H.264.", help_view_h: "Nur ansehen", help_view: "Sie sehen den entfernten Bildschirm, aber Maus, Tastatur, Zwischenablage und Dateien werden nicht übertragen. Praktisch, wenn Sie nur zuschauen müssen. Die Person am entfernten PC kann diesen Modus auch selbst im Fenster „Erlauben“ wählen.", help_audio_h: "Ton (Mikrofone)", help_audio: "Jeder schaltet sein eigenes Mikrofon mit der Schaltfläche 🎤 ein und aus: wer steuert, in der Leiste der Sitzung, die Person am entfernten PC im AnyPC-Fenster dort. Beide sind standardmäßig aus; beim ersten Mal fragt der Browser nach dem Zugriff auf das Mikrofon. Solange das Mikrofon des entfernten PCs an ist, zeigt sein Hinweis 🎤. Für Ton muss auf dem entfernten PC das AnyPC-Fenster geöffnet sein; hören Sie nichts, klicken Sie auf „🔈 Klicken, um den entfernten PC zu hören“. Kopfhörer verhindern Echo. „Nur ansehen“ schaltet den Ton nicht ab.", help_files_h: "Dateien", help_files: "„Datei senden“ kopiert eine Datei von diesem PC auf den entfernten; Sie können sie auch einfach auf den entfernten Bildschirm ziehen. „Datei holen“ öffnet auf dem entfernten PC eine Dateiauswahl, um eine Datei von dort zu holen.", help_files2: "Dateien landen im Ordner „Downloads“ des empfangenden PCs. Die Übertragungsschaltfläche in der Sitzungsleiste zeigt Fortschritt und Dateiliste. Bricht eine Übertragung ab, senden Sie die Datei erneut, dann geht es an der Abbruchstelle weiter.", help_clip_h: "Zwischenablage", help_clip: "Auf dem entfernten PC kopierter Text landet in der Zwischenablage dieses PCs. Im AnyPC-Programm geht hier Kopiertes von selbst hinüber; im Browser drücken Sie Strg+V im Sitzungsfenster oder nutzen „Zwischenablage senden“.", help_keys_h: "Sondertasten", help_keys: "Manche Tastenkombinationen fängt dieser PC selbst ab, sie kommen nie am entfernten an. Dafür gibt es Schaltflächen in der Sitzungsleiste: „Win“ öffnet das Startmenü, „Alt+Tab“ wechselt das Fenster, „Ctrl+Shift+Esc“ öffnet den Task-Manager.", help_sec_h: "Sicherheit", help_sec: "Während einer Sitzung zeigt der entfernte PC immer einen Hinweis, dass er gesteuert wird. Dessen Schaltfläche „Trennen“ beendet die Sitzung sofort – die Person dort kann Sie jederzeit stoppen.", help_sec2: "Jeder PC hat einen eigenen Schlüssel; sein Fingerabdruck steht unter der ID. AnyPC merkt sich den Schlüssel jedes PCs, mit dem Sie sich verbinden. Ändert er sich, erscheint eine Warnung: Wurde AnyPC dort nicht neu installiert, verbinden Sie sich nicht – jemand könnte sich als dieser PC ausgeben.", help_site: "Downloads, Neuigkeiten und Antworten: [www.anypc.org](https://www.anypc.org)", tour_next: "Weiter", tour_skip: "Überspringen", tour_done: "Fertig", tour_of: "{n} von {m}", tour_id: "Das ist die ID dieses PCs. Geben Sie sie zusammen mit dem Passwort an alle, die sich mit Ihnen verbinden sollen.", tour_pw: "Hier legen Sie das Passwort dieses PCs fest. Ohne Passwort kann sich niemand verbinden.", tour_go: "Um sich mit einem anderen PC zu verbinden, geben Sie dessen ID und Passwort ein und klicken auf „Verbinden“.", tour_opts: "„Turbo“ macht Text schärfer und spart Datenverkehr. „Nur ansehen“ zeigt den entfernten Bildschirm ohne Steuerung.", tour_help: "Etwas vergessen? Die Schaltfläche „?“ öffnet die Hilfe.", tour_bye: "„Trennen“ beendet die Sitzung sofort.", tour_fs: "Im Vollbild verschwindet diese Leiste. Bewegen Sie die Maus an den oberen Bildschirmrand, dann ist sie wieder da.", tour_files: "Hier senden und holen Sie Dateien. Empfangenes landet in „Downloads“; die Übertragungsschaltfläche zeigt den Fortschritt.",
    node_l: "Eigener Server", node_t: "Eigener AnyPC-Knoten (install.sh auf Ihrem VPS). Leer – AnyPC-Server. Einzelne Verbindung über einen anderen Knoten: ID@Knoten im ID-Feld.", node_p: "my.example.com – leer: AnyPC-Server", node_save: "Speichern", nodepub_l: "auch im AnyPC-Netz bleiben", node_chk: "Knoten wird geprüft…", node_ok: "Gespeichert – dieser PC ist jetzt angemeldet bei: ", node_bad: "Nicht gespeichert: ", id_node: "Ungültige Knotenadresse nach @", upd: "Version %s verfügbar — aktualisieren", ff_dl: "FFmpeg-Komponente wird heruntergeladen (einmalig):", ff_err: "FFmpeg konnte nicht heruntergeladen werden – Internetverbindung prüfen; neuer Versuch alle 30 s", turn_l: "Relay-Server", turn_t: "Wird nur genutzt, wenn keine Direktverbindung möglich ist. Ping: von diesem PC + vom entfernten PC (bekannt nach dem Verbinden).", auto: "Auto", ms: "ms",
    fp_l: 'Schlüssel-Fingerabdruck:', e_keychanged: 'der Schlüssel des entfernten PCs hat sich geändert. Wenn AnyPC dort nicht neu installiert wurde, nicht verbinden', trust: 'Neuem Schlüssel vertrauen und verbinden', mon_t: 'Monitor des entfernten PCs', q_t: 'Bild: Qualität — scharfes Bild, bei langsamer Verbindung weniger Bilder pro Sekunde; Tempo — flüssige Bewegung, weicheres Bild', q_quality: 'Qualität', q_speed: 'Tempo', f_broken: 'Verbindung unterbrochen – Datei erneut senden, um fortzusetzen', f_send: 'Datei senden', f_get: 'Datei holen', f_send_t: 'Datei an den entfernten PC senden (oder auf das Bild ziehen)', f_get_t: 'Öffnet eine Dateiauswahl auf dem entfernten PC', f_cancel: 'abgebrochen', f_err: 'Fehler', f_done_up: 'in „Downloads“ des entfernten PCs gespeichert', f_done_down: 'in „Downloads“ gespeichert',

  fr: { help_b: "Aide", help_h: "Comment fonctionne AnyPC", help_x: "Fermer", help_tour: "Revoir les astuces", help_about_h: "AnyPC, c’est quoi", help_about: "AnyPC affiche l’écran d’un autre ordinateur et vous permet de l’utiliser avec votre propre souris et votre clavier, comme si vous étiez devant. La connexion est chiffrée. L’image passe directement entre les deux PC quand c’est possible, sinon par un serveur relais.", help_conn_h: "Se connecter à un autre PC", help_conn: "Demandez à la personne devant le PC distant son ID (9 chiffres) et le mot de passe. Saisissez-les dans « Ordinateur distant » et cliquez sur « Se connecter ».", help_conn2: "Si le PC distant demande une confirmation, attendez que quelqu’un réponde là-bas. Les ID déjà utilisés apparaissent dans « Récents » : un clic remplit l’ID.", help_host_h: "Autoriser les connexions à ce PC", help_host: "Personne ne peut se connecter à ce PC sans mot de passe. Définissez-en un d’au moins 8 caractères dans « Cet ordinateur » et ne le donnez, avec votre ID, qu’à des personnes de confiance.", help_host2: "Si « Demander avant chaque connexion entrante » est coché, chaque tentative ouvre une fenêtre avec trois réponses. « Autoriser » donne le contrôle, « Affichage seul » montre l’écran sans contrôle, « Refuser » rejette. Sans réponse en 30 secondes, c’est un refus.", help_turbo_h: "Turbo (VP9)", help_turbo: "Turbo envoie la vidéo en VP9 au lieu de H.264 : le texte est plus net et le trafic plus faible. Si le PC distant ne gère pas VP9, AnyPC utilise simplement H.264.", help_view_h: "Affichage seul", help_view: "Vous voyez l’écran distant, mais la souris, le clavier, le presse-papiers et les fichiers ne sont pas transmis. Pratique quand il suffit de regarder. La personne devant le PC distant peut aussi choisir ce mode dans la fenêtre « Autoriser ».", help_audio_h: "Son (micros)", help_audio: "Chacun active et désactive son propre micro avec le bouton 🎤 : la personne qui contrôle, dans la barre de la session ; la personne devant le PC distant, dans la fenêtre AnyPC de ce PC. Les deux sont désactivés par défaut ; la première fois, le navigateur demande l’accès au micro. Tant que le micro du PC distant est activé, son bandeau affiche 🎤. Le son nécessite que la fenêtre AnyPC soit ouverte sur le PC distant ; si vous n’entendez rien, cliquez sur « 🔈 Cliquez pour entendre le PC distant ». Un casque évite l’écho. L’affichage seul ne coupe pas le son.", help_files_h: "Fichiers", help_files: "« Envoyer un fichier » copie un fichier de ce PC vers le PC distant ; vous pouvez aussi le déposer sur l’écran distant. « Récupérer un fichier » ouvre un sélecteur de fichiers sur le PC distant pour en rapatrier un.", help_files2: "Les fichiers sont enregistrés dans le dossier Téléchargements du PC qui les reçoit. Le bouton des transferts dans la barre de session affiche la progression et la liste des fichiers. Si un transfert est interrompu, renvoyez le fichier : il reprendra là où il s’est arrêté.", help_clip_h: "Presse-papiers", help_clip: "Le texte copié sur le PC distant arrive dans le presse-papiers de ce PC. Dans le programme AnyPC, ce que vous copiez ici part tout seul là-bas ; dans un navigateur, appuyez sur Ctrl+V dans la fenêtre de session ou utilisez « Envoyer le presse-papiers ».", help_keys_h: "Touches spéciales", help_keys: "Certaines combinaisons sont interceptées par ce PC et n’atteignent jamais le PC distant. Utilisez plutôt les boutons de la barre de session : « Win » ouvre le menu Démarrer, « Alt+Tab » change de fenêtre, « Ctrl+Shift+Esc » ouvre le Gestionnaire des tâches.", help_sec_h: "Sécurité", help_sec: "Pendant une session, le PC distant affiche toujours un bandeau indiquant qu’il est contrôlé. Son bouton « Déconnecter » met fin à la session aussitôt : la personne sur place peut vous arrêter à tout moment.", help_sec2: "Chaque PC a sa propre clé ; son empreinte s’affiche sous l’ID. AnyPC retient la clé de chaque PC auquel vous vous connectez. Si la clé change, un avertissement s’affiche : si AnyPC n’a pas été réinstallé sur ce PC, ne vous connectez pas, quelqu’un pourrait se faire passer pour lui.", help_site: "Téléchargements, actualités et réponses : [www.anypc.org](https://www.anypc.org)", tour_next: "Suivant", tour_skip: "Passer", tour_done: "Terminé", tour_of: "{n} sur {m}", tour_id: "Voici l’ID de ce PC. Donnez-le, avec le mot de passe, à la personne qui va se connecter à vous.", tour_pw: "C’est ici qu’on définit le mot de passe de ce PC. Sans lui, personne ne peut se connecter.", tour_go: "Pour vous connecter à un autre PC, saisissez son ID et son mot de passe, puis cliquez sur « Se connecter ».", tour_opts: "« Turbo » rend le texte plus net et économise du trafic. « Affichage seul » montre l’écran distant sans le contrôler.", tour_help: "Un oubli ? Le bouton « ? » ouvre l’aide.", tour_bye: "« Déconnecter » met fin à la session immédiatement.", tour_fs: "En plein écran, cette barre se cache. Amenez la souris en haut de l’écran pour la faire revenir.", tour_files: "Envoyez et récupérez des fichiers ici. Les fichiers reçus vont dans Téléchargements ; le bouton des transferts montre la progression.",
    node_l: "Serveur personnel", node_t: "Votre propre nœud AnyPC (install.sh sur votre VPS). Vide : serveurs AnyPC. Connexion ponctuelle via un autre nœud : ID@nœud dans le champ ID.", node_p: "my.example.com — vide : serveurs AnyPC", node_save: "Enregistrer", nodepub_l: "rester aussi sur le réseau AnyPC", node_chk: "Vérification du nœud…", node_ok: "Enregistré — ce PC est maintenant inscrit sur : ", node_bad: "Non enregistré : ", id_node: "Adresse de nœud invalide après @", upd: "Version %s disponible — mettre à jour", ff_dl: "Téléchargement du composant FFmpeg (une seule fois) :", ff_err: "Impossible de télécharger FFmpeg — vérifiez la connexion Internet ; nouvel essai toutes les 30 s", turn_l: "Serveur relais", turn_t: "Utilisé seulement si la connexion directe est impossible. Ping : depuis ce PC + depuis le PC distant (connu après la connexion).", auto: "Auto", ms: "ms",

  it: { help_b: "Guida", help_h: "Come funziona AnyPC", help_x: "Chiudi", help_tour: "Mostra di nuovo i suggerimenti", help_about_h: "Che cos’è AnyPC", help_about: "AnyPC mostra lo schermo di un altro computer e ti permette di usarlo con il tuo mouse e la tua tastiera, come se ci fossi davanti. La connessione è cifrata. L’immagine viaggia direttamente tra i due PC quando è possibile, altrimenti tramite un server relay.", help_conn_h: "Connettersi a un altro PC", help_conn: "Chiedi a chi sta al PC remoto il suo ID (9 cifre) e la password. Inseriscili in «Computer remoto» e premi «Connetti».", help_conn2: "Se il PC remoto chiede una conferma, aspetta che qualcuno risponda dall’altra parte. Gli ID già usati compaiono in «Recenti»: un clic inserisce l’ID.", help_host_h: "Permettere le connessioni a questo PC", help_host: "Senza password nessuno può connettersi a questo PC. Impostane una di almeno 8 caratteri in «Questo computer» e dalla, insieme al tuo ID, solo a persone di fiducia.", help_host2: "Con «Chiedi prima di ogni connessione in arrivo» attivo, ogni tentativo apre una finestra con tre risposte. «Consenti» dà il controllo, «Solo visualizzazione» mostra lo schermo senza controllo, «Rifiuta» respinge. Senza risposta entro 30 secondi la connessione viene rifiutata.", help_turbo_h: "Turbo (VP9)", help_turbo: "Turbo invia il video in VP9 invece che in H.264: il testo è più nitido e si consuma meno traffico. Se il PC remoto non supporta VP9, AnyPC usa semplicemente H.264.", help_view_h: "Solo visualizzazione", help_view: "Vedi lo schermo remoto, ma mouse, tastiera, appunti e file non vengono inviati. Comodo quando basta guardare. Anche chi sta al PC remoto può scegliere questa modalità nella finestra «Consenti».", help_audio_h: "Audio (microfoni)", help_audio: "Ognuno attiva e disattiva il proprio microfono con il pulsante 🎤: chi controlla, nella barra della sessione; chi sta al PC remoto, nella finestra di AnyPC su quel PC. Entrambi sono disattivati per impostazione predefinita; la prima volta il browser chiede l’accesso al microfono. Finché il microfono del PC remoto è attivo, il suo avviso mostra 🎤. Per l’audio sul PC remoto deve essere aperta la finestra di AnyPC; se non senti nulla, fai clic su «🔈 Fai clic per sentire il PC remoto». Le cuffie evitano l’eco. «Solo visualizzazione» non disattiva l’audio.", help_files_h: "File", help_files: "«Invia file» copia un file da questo PC a quello remoto; puoi anche trascinarlo sullo schermo remoto. «Ricevi file» apre una finestra di scelta file sul PC remoto per prelevare un file da lì.", help_files2: "I file vengono salvati nella cartella Download del PC che li riceve. Il pulsante dei trasferimenti sulla barra della sessione mostra l’avanzamento e l’elenco dei file. Se un trasferimento si interrompe, invia di nuovo il file: riprenderà da dove si era fermato.", help_clip_h: "Appunti", help_clip: "Il testo copiato sul PC remoto arriva negli appunti di questo PC. Nel programma AnyPC ciò che copi qui passa di là da solo; nel browser premi Ctrl+V nella finestra della sessione o usa «Invia appunti».", help_keys_h: "Tasti speciali", help_keys: "Alcune combinazioni vengono intercettate da questo PC e non arrivano mai a quello remoto. Per queste ci sono i pulsanti sulla barra della sessione: «Win» apre il menu Start, «Alt+Tab» cambia finestra, «Ctrl+Shift+Esc» apre Gestione attività.", help_sec_h: "Sicurezza", help_sec: "Durante una sessione il PC remoto mostra sempre un avviso che è controllato a distanza. Il suo pulsante «Disconnetti» chiude subito la sessione: chi è lì può fermarti in qualsiasi momento.", help_sec2: "Ogni PC ha una propria chiave; la sua impronta è sotto l’ID. AnyPC ricorda la chiave di ogni PC a cui ti connetti. Se la chiave cambia, compare un avviso: se AnyPC non è stato reinstallato su quel PC, non connetterti, qualcuno potrebbe spacciarsi per lui.", help_site: "Download, novità e risposte: [www.anypc.org](https://www.anypc.org)", tour_next: "Avanti", tour_skip: "Salta   if (!s.session && au.host) { audioStop(); au.host = false; $('hmic').classList.add('hidden'); }

const region = (() => { try { return new Intl.DisplayNames([lang], { type: 'region' }); } catch { return null; } })();
const turnName = h => { const c = (h.match(/^(?:any-)?([a-z]{2})\./) || [])[1]; return (c && region?.of(c.toUpperCase())?.replace(/\s*\(.*\)$/, '')) || h; }; // страна из имени: hk.anypc.org (и прежние any-hk.…)

const stunRtt = h => new Promise(ok => {

  const done = r => { p.close(); ok(r); };
  setTimeout(() => done(null), 2000);
  p.onicecandidate = e => e.candidate?.type === 'srflx' && done(Math.round(performance.now() - t0));

});

  for (let i = 0; i < 3; i++) { const r = await stunRtt(h); if (r != null && (best == null || r < best)) best = r; }
  rttMe[h] = best; renderTurn();
}));

$('go').onclick = async () => {

  const hubs = node ? [HUBS[0].slice(0, HUBS[0].indexOf('//') + 2) + node + '/ws'] : HUBS; // схема — как у своих хабов (wss; ws — только отладка)
  $('trust').classList.add('hidden');

  $('msg').textContent = t('connecting');

  last = null;
  // Резервная сигнализация: WS ко всем хабам сразу, сессия — через тот, чей offer пришёл первым.

  const lose = msg => { // хаб отказал до offer; конец — только когда отказали все
    errs.push(msg);

  };
  for (const u of hubs) {
    const w = new WebSocket(u);
    socks.push(w);
    let ice = [], out = false;
    const fail = msg => { if (!out) { out = true; lose(msg); } };
    w.onmessage = async e => {
      if (cur !== att || (ws && ws !== w)) return;
      const m = JSON.parse(e.data);

        if (ev.channel.label === 'auth') ev.channel.onmessage = e => onAuth(ev.channel, e, mine);
        if (ev.channel.label === 'file') authed ? recvFile(ev.channel) : ev.channel.close(); // Д-2: файлы — только после входа
      };

      let was = false; // «потеряна» — только если соединение было; иначе путь не нашёлся вовсе
      pc.onconnectionstatechange = () => { if (mine !== pc) return; const st = mine.connectionState;
        if (st === 'connected') was = true;
        else if (st === 'failed') { if (again?.host === host && again.n++ < 3) redial(); else end(t(was ? 'lost' : 'nopath')); } };
      await pc.setRemoteDescription({ type: m.data.type, sdp: m.data.sdp });
      await pc.setLocalDescription();

    };

// В браузере CPace — из pake.wasm (тот же Go-код, что в программе); грузится при первом подключении.
// go.run запускает Go асинхронно: pakeRespond появляется не сразу — ждём до 5 с. Неудача не запоминается.
let pakeReady;
async function loadPake() {
  if (typeof window.pakeRespond === 'function') return true;
  pakeReady ??= (async () => {
    if (typeof Go !== 'function') await new Promise((ok, no) => {
      const s = document.createElement('script');
      s.src = 'wasm_exec.js'; s.onload = ok; s.onerror = no;
      document.head.append(s);

    const go = new Go();
    const r = await WebAssembly.instantiateStreaming(fetch('pake.wasm'), go.importObject);
    go.run(r.instance);
    for (let i = 0; i < 100 && typeof window.pakeRespond !== 'function'; i++) await new Promise(r => setTimeout(r, 50));
  })();
  try { await pakeReady; } catch {}
  pakeReady = null;
  return typeof window.pakeRespond === 'function';
}

let expect = '', authed = false; // authed — хост доказал CPace и ключ (Д-1, Д-2)

function ckeys() { try { return JSON.parse(localStorage.getItem('ckeys')) || {}; } catch { return {}; } }
async function onAuth(ch, e, mine) {
  const m = JSON.parse(e.data);
  if (m.t === 'a') {
    // один обмен CPace на соединение: иначе поддельный хост (хаб) шлёт «a» с новой догадкой пароля раз за разом
    // и по ответу проверяет каждую — перебор мимо блокировки на хосте (REQ-S-04)
    if (mine !== pc) return; // сообщение старой попытки
    if (mine.cpace) return end(t('err') + t('e_hostauth'));
    mine.cpace = true;
    try {
      const r = await pakeRespond($('pw').value, m.salt, m.msg, host, pc.localDescription.sdp, pc.remoteDescription.sdp);
      expect = r.expect;
      // У3: свой ключ на этот хост — после входа по паролю хост его закрепит, и блокировка перебора владельца не запрёт
      const ks = ckeys(), k = typeof clientSign === 'function' && clientSign(ks[host]?.seed || '', host, pc.localDescription.sdp, pc.remoteDescription.sdp);

      ch.send(JSON.stringify({ t: 'b', msg: r.msg, conf: r.conf, cpub: k?.pub, csig: k?.sig }));
    } catch (err) { end(t('err') + err); }
  } else if (m.t === 'ok') {
    if (!expect || m.conf !== expect) return end(t('err') + t('e_hostauth')); // Д-1: «ok» без обмена CPace — подмена // ответил не тот хост или соединение подменено
    // REQ-S-05: подпись хоста над DTLS-отпечатками; отпечаток его ключа запоминается при первом входе (TOFU)
    let fp;
    try { fp = await hostVerify(m.pub, m.sig, host, pc.localDescription.sdp, pc.remoteDescription.sdp); }
    catch { return end(t('err') + t('e_hostauth')); }
    const was = await known.get(host);
    if (was && was !== fp && !(trustNext?.host === host && trustNext.fp === fp)) {
      trustNext = { host, fp };
      end(t('err') + t('e_keychanged'));

      return;
    }
    trustNext = null; expect = ''; authed = true; hostState(lastState);
    document.body.classList.toggle('view', !!m.view); // REQ-F-20: режим сессии решает хост (мог сузить сам)

  else if (m.t === 'denied') end(t('err') + t('e_denied'));
  else if (m.t === 'fail') end(t('err') + t('e_auth'));
  else if (m.t === 'busy') end(t('err') + t('e_busy')); // пароль верный, но другой вход успел раньше
  else if (m.t === 'locked') end(t('err') + t('e_locked'));
}

const CLIP_MAX = 60 * 1024; // как agent.ClipMax (в байтах UTF-8)

    kbps = Math.round((now.b - last.b) * 8 / (now.t - last.t));
    samples.push({ t: new Date().toISOString(), path, rtt, fps, kbps, lost: now.lost - last.lost, rx: now.rx - last.rx,
      jb: now.jbn > last.jbn ? Math.round((now.jbd - last.jbd) / (now.jbn - last.jbn) * 1000) : 0, frz: now.frz - last.frz });
    $('sum').textContent = summary();
  }
  last = now;
  $('st').textContent = `${host} · ${path} (${loc}/${rem}) · ${codec} · RTT ${rtt} ${t('ms')} · ${fps} ${t('fps')} · ${kbps} ${t('kbps')} · ${inb.frameWidth || 0}×${inb.frameHeight || 0}` + (document.body.classList.contains('view') ? ' · ' + t('view_s') : '');
}

// ---------- Справка (кнопка «?») ----------
const HELP = [['help_about_h', 'help_about'], ['help_conn_h', 'help_conn', 'help_conn2'], ['help_host_h', 'help_host', 'help_host2'],
  ['help_turbo_h', 'help_turbo'], ['help_view_h', 'help_view'], ['help_audio_h', 'help_audio'], ['help_files_h', 'help_files', 'help_files2'], ['help_clip_h', 'help_clip'],
  ['help_keys_h', 'help_keys'], ['help_sec_h', 'help_sec', 'help_sec2']];
function rich(el, s) { // «[текст](https://…)» → ссылка; без innerHTML
  let i = 0;
  for (const m of s.matchAll(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g)) {
    const a = Object.assign(document.createElement('a'), { href: m[2], target: '_blank', rel: 'noopener', textContent: m[1] });
    a.onclick = e => { if (window.openSite) { e.preventDefault(); openSite(); } }; // Windows: главная сайта — в системном браузере (адрес фиксирован в программе)
    el.append(s.slice(i, m.index), a); i = m.index + m[0].length;
  }
  el.append(s.slice(i)); return el;
}
const mkEl = (tag, txt) => rich(document.createElement(tag), txt);
const helpOpen = () => !$('help').classList.contains('hidden');
let eatEsc = false; // keyup от Esc, закрывшего справку, не отправлять на удалённый ПК
function openHelp() {
  if (!$('helpbody').childElementCount) {
    const again = Object.assign(document.createElement('button'), { textContent: t('help_tour') });
    again.onclick = () => { for (const k of ['home', 'sess']) { toured[k] = 0; store.set('tour_' + k, 0); }
      closeHelp(); startTour($('sess').classList.contains('hidden') ? 'home' : 'sess', true); };
    const row = document.createElement('div'); row.className = 'row'; row.append(again);
    $('helpbody').append(...HELP.flatMap(([h, ...p]) => [mkEl('h3', t(h)), ...p.map(k => mkEl('p', t(k)))]), mkEl('p', t('help_site')), row);
    $('helpx').setAttribute('aria-label', t('help_x'));
  }
  tourEnd(); $('help').classList.remove('hidden'); $('helpbody').parentElement.scrollTop = 0; $('helpx').focus();
}
function closeHelp() { $('help').classList.add('hidden'); if (!$('sess').classList.contains('hidden')) v.focus(); }
$('helpbtn').onclick = $('help2').onclick = openHelp;
$('helpx').onclick = closeHelp;
$('help').onclick = e => { if (e.target === $('help')) closeHelp(); };
// Справка поверх сессии: клавиши не уходят на удалённый ПК (перехват раньше обработчика на document)
window.addEventListener('keydown', e => {
  if (helpOpen()) { e.stopImmediatePropagation(); if (e.key === 'Escape') { e.preventDefault(); eatEsc = true; closeHelp(); } return; }
  if (tour && e.key === 'Escape' && !capturing()) tourEnd();
}, true);
window.addEventListener('keyup', e => { if (helpOpen() || eatEsc && e.key === 'Escape') { e.stopImmediatePropagation(); eatEsc = false; } }, true);

// ---------- Тур для новичка: выноски у элементов, один раз (флаг tour_home / tour_sess в localStorage) ----------
// Выноска не перехватывает клики по странице (#tour — pointer-events: none, кроме самой выноски).
var tour = null; // var — show() может прийти раньше этой строки
const toured = {}; // показан в этой загрузке страницы — на случай недоступного localStorage
const TOURS = {
  home: [[['myid'], 'tour_id'], [['newpw', 'setpw'], 'tour_pw'], [['id', 'pw', 'go'], 'tour_go'], [['turbo', 'view'], 'tour_opts'], [['helpbtn'], 'tour_help']],
  sess: [[['bye'], 'tour_bye'], [['fsbtn'], 'tour_fs'], [['fsend', 'fget', 'dl'], 'tour_files']],
};
const tbox = id => { const e = $(id); return e?.closest('label') || e; }; // галочка — вместе с подписью
const seen = e => !!e && e.getClientRects().length > 0;
const tEls = s => s[0].map(tbox).filter(seen);
const tRect = e => { // по содержимому: блок с ID и подпись галочки растянуты на всю ширину карточки
  if (/^(INPUT|BUTTON|SELECT)$/.test(e.tagName)) return e.getBoundingClientRect();
  const g = document.createRange(); g.selectNodeContents(e); return g.getBoundingClientRect();
};
function startTour(kind, force) {
  if (!force && (toured[kind] || store.get('tour_' + kind, 0))) return;
  const steps = TOURS[kind].filter(s => tEls(s).length);
  if (!steps.length || helpOpen()) return;
  toured[kind] = 1; store.set('tour_' + kind, 1);
  tour = { kind, steps, i: 0 }; tourStep();
}
function tourStep() {
  const { steps, i } = tour, els = tEls(steps[i]);
  if (!els.length) return tourGo();
  const last = i === steps.length - 1;
  $('tiptxt').textContent = t(steps[i][1]);
  $('tipn').textContent = t('tour_of').replace('{n}', i + 1).replace('{m}', steps.length);
  $('tipnext').textContent = t(last ? 'tour_done' : 'tour_next');
  $('tipskip').classList.toggle('hidden', last);
  els.at(-1).scrollIntoView({ block: 'nearest' }); els[0].scrollIntoView({ block: 'nearest' }); // вся группа в окне, начало — обязательно
  tour.els = els; $('tour').classList.remove('hidden'); tourPlace();
}
function tourGo() { if (++tour.i >= tour.steps.length) tourEnd(); else tourStep(); }
function tourEnd() { tour = null; $('tour').classList.add('hidden'); }
function tourPlace() {
  if (!tour) return;
  const els = tour.els.filter(seen);
  if (!els.length) return tourEnd();
  const rs = els.map(tRect), W = innerWidth, H = innerHeight, p = 4;
  const r = { l: Math.min(...rs.map(x => x.left)) - p, t: Math.min(...rs.map(x => x.top)) - p, r: Math.max(...rs.map(x => x.right)) + p, b: Math.max(...rs.map(x => x.bottom)) + p };
  Object.assign($('tring').style, { left: r.l + 'px', top: r.t + 'px', width: r.r - r.l + 'px', height: r.b - r.t + 'px' });
  const tip = $('tip'), w = Math.min(320, W - 16);
  tip.style.width = w + 'px';
  const h = tip.offsetHeight, below = r.b + 12 + h <= H - 8 || r.t - 12 - h < 8;
  const cx = (Math.max(r.l, 0) + Math.min(r.r, W)) / 2, left = Math.max(8, Math.min(cx - w / 2, W - w - 8));
  tip.dataset.side = below ? 'b' : 't';
  tip.style.left = left + 'px';
  tip.style.top = Math.max(8, Math.min(below ? r.b + 12 : r.t - 12 - h, H - h - 8)) + 'px';
  tip.style.setProperty('--ax', Math.max(18, Math.min(cx - left, w - 18)) + 'px');
}
$('tipnext').onclick = tourGo;
$('tipskip').onclick = tourEnd;
addEventListener('resize', tourPlace);
addEventListener('scroll', tourPlace, true);
function tourOnShow(sess) { // смена экрана: тур другого экрана закрыть; первая сессия — свой короткий тур
  if (tour && tour.kind !== (sess ? 'sess' : 'home')) tourEnd();
  if (sess) setTimeout(() => !$('sess').classList.contains('hidden') && startTour('sess'), 800);
}
setTimeout(() => !$('home').classList.contains('hidden') && startTour('home'), 1000); // в программе — после первого hostInfo (ID уже на месте)
</script>
</html>
