<style>
  :root { --bg: #f6f6f4; --card: #fff; --fg: #1a1a1a; --mut: #6b6b6b; --line: #ddd; --acc: #c0392b; --ok: #2e7d32; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161616; --card: #202020; --fg: #eee; --mut: #9a9a9a; --line: #333; --acc: #e57368; --ok: #81c784; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  button, input { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); }
  button { cursor: pointer; } button.main { background: var(--acc); color: #fff; border-color: var(--acc); }
  .hidden { display: none !important; }
  .eye { padding: 4px 8px; } .eye.on { background: var(--acc); color: #fff; }
  body.nostat #sum, body.nostat #csv, body.nostat #reset, body.nostat:not(.view) #st { display: none; } /* кнопка «Статистика»; «только просмотр» в #st видно всегда */
  body.view [data-keys], body.view #fsend, body.view #fget, body.view #clipbtn { display: none !important; } /* только просмотр: хост это всё равно отбросит */
  .mut { color: var(--mut); } .mono { font-family: ui-monospace, monospace; }
  #home { display: flex; gap: 16px; padding: 16px; flex-wrap: wrap; align-items: flex-start; overflow: auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; flex: 1 1 320px; display: flex; flex-direction: column; gap: 10px; }
  .card h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .big { font-size: 28px; letter-spacing: 2px; font-family: ui-monospace, monospace; }
  #myid { user-select: all; display: inline-block; } /* один щелчок выделяет весь ID — «Копировать» в контекстном меню */
  .kbwarn { color: var(--warn, #b45309); font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .banner { border: 1px solid var(--acc); border-radius: 8px; padding: 10px; }
  #recent button { font-family: ui-monospace, monospace; }
  #msg { color: var(--acc); min-height: 1.2em; }
  #sess { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #bar { display: flex; gap: 6px; padding: 6px 8px; flex-wrap: wrap; align-items: center; background: var(--card); border-bottom: 1px solid var(--line); }
  #bar button { padding: 4px 8px; }
  #dl { position: relative; } #dlbtn { display: inline-flex; align-items: center; gap: 4px; }
  #dlpop { position: absolute; top: calc(100% + 4px); right: 0; z-index: 5; width: min(380px, 90vw); max-height: 50vh; overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 24px #0003; padding: 4px; }
  .xf { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; align-items: center; padding: 6px; border-radius: 6px; }
  .xf + .xf { border-top: 1px solid var(--line); } .xf .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .xf progress { grid-column: 2 / 4; width: 100%; height: 6px; accent-color: var(--acc); } .xf .st { grid-column: 2 / 4; font-size: 12px; }
  video { flex: 1; min-height: 0; width: 100%; background: #000; object-fit: contain; outline: none; }
  #cur { position: fixed; pointer-events: none; z-index: 5; }
  #hstate { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; max-width: calc(100vw - 32px); padding: 12px 18px; border-radius: 8px; background: rgba(0, 0, 0, .75); color: #fff; text-align: center; pointer-events: none; }
  .seg { display: inline-flex; } .seg button { border-radius: 0; } .seg button:first-child { border-radius: 6px 0 0 6px; } .seg button:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
  .seg button[aria-pressed="true"] { background: var(--acc); color: #fff; border-color: var(--acc); }
  body.fs #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 2; transform: translateY(calc(-100% + 4px)); transition: transform .15s; opacity: .95; }
  body.fs #bar:hover { transform: none; }
  .qbtn, #bar .qbtn { width: 28px; height: 28px; padding: 0; border-radius: 50%; font-weight: 700; flex: none; }
  #mic.on, #hmic.on { background: var(--acc); color: #fff; border-color: var(--acc); } #aplay { position: fixed; right: 16px; bottom: 16px; z-index: 5; }
  #helpbtn { position: fixed; top: 6px; right: 6px; z-index: 3; } #bar .qbtn { width: 26px; height: 26px; }
  #help { position: fixed; inset: 0; z-index: 30; background: #0007; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #help .dlg { background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 40px #0005; width: min(600px, 100%); max-height: 100%; overflow: auto; padding: 14px 20px 18px; }
  #help .dlg h2 { margin: 0; font-size: 17px; flex: 1; } #helpx { font-size: 18px; line-height: 1; padding: 4px 10px; }
  #helpbody h3 { font-size: 14px; margin: 16px 0 4px; } #helpbody p { margin: 4px 0; line-height: 1.45; } #helpbody a, #tip a { color: var(--acc); }
  #helpbody .row { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); }
  #tour { position: fixed; inset: 0; z-index: 20; pointer-events: none; } /* выше #dlpop; клики по странице не перехватывает — только сама выноска */
  #tring { position: fixed; border: 2px solid var(--acc); border-radius: 8px; box-shadow: 0 0 0 9999px #0003; transition: left .2s, top .2s, width .2s, height .2s; }
  #tip { position: fixed; pointer-events: auto; background: var(--card); color: var(--fg); border: 1px solid var(--acc); border-radius: 10px; box-shadow: 0 8px 28px #0004; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; line-height: 1.4; }
  #tip::before { content: ''; position: absolute; left: calc(var(--ax, 50%) - 7px); width: 12px; height: 12px; background: var(--card); border: 1px solid var(--acc); transform: rotate(45deg); }
  #tip[data-side="b"]::before { top: -7px; border-right: none; border-bottom: none; } #tip[data-side="t"]::before { bottom: -7px; border-left: none; border-top: none; }
  #tip .row { justify-content: flex-end; } #tipn { margin-right: auto; font-size: 12px; } #tip button { padding: 4px 10px; }

<script>
const $ = id => document.getElementById(id);
// Хабы сигнализации: в программе — из настроек (через запятую), в браузере — свой и соседние из /hubs.
const HUBS = (window.ANYPC?.ws || (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws').split(',').map(u => u.trim()).filter(Boolean);
const httpOf = u => u.replace(/^ws/, 'http').replace(/\/ws$/, '');
const APP = typeof window.hostInfo === 'function'; // открыто в AnyPC.exe
if (!APP) fetch(httpOf(HUBS[0]) + '/hubs').then(r => r.json()).then(l => { for (const u of l) if (!HUBS.includes(u)) HUBS.push(u); }).catch(() => {});
// ---------- Языки: по языку Windows/браузера, по умолчанию английский ----------
const L = {
  en: { mode_limit: "Control was refused 3 times — reconnect to ask again", mode_ctl: "Control", mode_ctl_t: "Ask for control: the person at the remote PC must press “Allow”", mode_view: "View only", mode_view_t: "Switch to view only: your mouse, keyboard, clipboard and files are no longer sent", mode_ask: "Waiting for “Allow” on the remote PC…", mode_denied: "Control was not allowed", mode_viewonly: "The remote PC has “Only show the screen” on — control is not possible", mode_rights: "This connection cannot get control", mode_busy: "The request is already sent — waiting for an answer", mode_again: "Control was just refused — try again in 10 seconds", help_view2: "If you connected with a one-time code and “Allow”, you can switch during the session: “View only” works at once, “Control” asks the person at the remote PC to press “Allow” again. With a password or user name the mode is set by your rights on the remote PC.", code_l: "One-time code:", code_new_t: "New code (the old one stops working)", tour_code: "With “Ask before each connection” on, give the ID and this one-time code to whoever connects. It changes after every session; ↻ changes it right away.", help_code: "With “Ask before each connection” on, the password is a one-time code shown under “This computer”: it changes after every session, after too many wrong attempts and by ↻. The permanent password and users work only with that option off (plus a TOTP code).", user_p: "Name (optional)", e_nousers: "the remote PC does not know user names — update AnyPC there or leave “Name” empty", e_auth_u: "wrong name or password", users_h: "Users", users_hint: "Give each person their own name, password and rights. Connecting without a name uses the password of this PC above.", uname_p: "Name", u_full: "Full control", u_view: "View only", u_add: "Save", u_pw: "Password", u_otp: "Set up TOTP", u_otp_off: "Turn off TOTP", u_del: "Delete", u_del_q: "Delete user “%s”?", help_sec4: "Under “Users” on the remote PC everyone can get their own name, password and rights (full control or view only); they type the name in “Name” when connecting, and the remote PC shows it on the session notice. Connecting without a name uses the PC’s own password.", help_b: "Help", help_h: "How AnyPC works", help_x: "Close", help_tour: "Show tips again", help_about_h: "What AnyPC is", help_about: "AnyPC shows the screen of another computer and lets you work on it with your own mouse and keyboard, as if you were sitting in front of it. The connection is encrypted. The picture goes straight between the two PCs when possible, otherwise through a relay server.", help_conn_h: "Connecting to another PC", help_conn: "Ask the person at the remote PC for its ID (9 digits) and password. Enter both under “Remote computer” and press “Connect”.", help_conn2: "If the remote PC asks for confirmation, wait until someone there answers. IDs you have used appear under “Recent”: one click fills in the ID.", help_host_h: "Letting others connect to this PC", help_host: "Nobody can connect to this PC without a password. Set one of at least 8 characters under “This computer” and give it, together with your ID, only to people you trust.", help_host2: "With “Ask before each incoming connection” on, every attempt opens a window with three answers. “Allow” gives control, “View only” shows the screen without control, “Deny” refuses. No answer within 30 seconds counts as “Deny”.", help_turbo_h: "Turbo (VP9)", help_turbo: "Turbo sends video as VP9 instead of H.264: text looks sharper and less traffic is used. If the remote PC cannot do VP9, AnyPC simply uses H.264.", help_view_h: "View only", help_view: "You see the remote screen, but your mouse, keyboard, clipboard and files are not sent. Handy when you only need to watch. The person at the remote PC can also pick this mode in the “Allow” window. The remote PC can also turn on “Only show the screen” in “This computer”: then every incoming connection is view only.", viewonly_l: "Only show the screen", viewonly_t: "Every incoming connection is view only: mouse, keyboard, clipboard and files from the other side are not accepted. “Allow” also gives view only", help_audio_h: "Sound (microphones)", help_audio: "Everyone turns their own microphone on and off with the 🎤 button: the person controlling — in the session toolbar, the person at the remote PC — in the AnyPC window there. Both are off by default; the first time, the browser asks for access to the microphone. While the remote PC’s microphone is on, its notice shows 🎤. Sound needs the AnyPC window open on the remote PC; if you hear nothing, click “🔈 Click to hear the remote PC”. Headphones prevent echo. View only does not turn sound off.", help_files_h: "Files", help_files: "“Send file” copies a file from this PC to the remote one; you can also drop a file onto the remote screen. “Get file” opens a file picker on the remote PC to fetch a file from it.", help_files2: "Files are saved to the Downloads folder of the receiving PC. The transfers button on the session bar shows progress and the list of files. If a transfer breaks off, send the file again and it resumes where it stopped.", help_clip_h: "Clipboard", help_clip: "Text copied on the remote PC lands in the clipboard of this PC. Text copied here goes there automatically in the AnyPC program; in a browser press Ctrl+V in the session window or use “Send clipboard”.", help_keys_h: "Special keys", help_keys: "Some key combinations are caught by this PC and never reach the remote one. Use the buttons on the session bar instead: “Win” opens the Start menu, “Alt+Tab” switches windows, “Ctrl+Shift+Esc” opens Task Manager.", help_sec_h: "Security", help_sec: "During a session the remote PC always shows a notice that it is being controlled. Its “Disconnect” button ends the session at once, so the person there can stop you at any moment.", help_sec2: "Every PC has its own key; its fingerprint is shown under the ID. AnyPC remembers the key of each PC you connect to. If the key changes, you get a warning: unless AnyPC was reinstalled on that PC, do not connect, someone may be posing as it.", e_otp_late: "the time to enter the code is over — connect again", help_sec3: "To connect without confirmation, the remote PC needs, besides the password, a 6-digit code from an authenticator app on your phone (TOTP). It is set up in “This computer” when you turn off “Ask before each incoming connection”. “Remember password” keeps the password on this PC, so connecting without confirmation is protected by the second factor.", otp_is_on: "Connections without confirmation: password + code from the authenticator app (TOTP)", otp_warn: "Connections without confirmation are off until a second factor (TOTP) is set up: every connection asks Allow / Deny.", otp_setup: "Set up", otp_h: "Second factor (TOTP)", otp_scan: "To connect without confirmation, a code from an authenticator app will be needed after the password. Scan the QR code with the app (Google Authenticator, Microsoft Authenticator, Aegis…) or enter the key by hand, then type the 6-digit code it shows.", otp_key: "Key:", otp_code_p: "6-digit code", otp_on: "Turn on", otp_cancel: "Cancel", otp_bad: "Wrong code. Check that the time on the phone is correct and try again", remember_l: "Remember password", otp_ask: "Enter the 6-digit code from the authenticator app for this PC", otp_send: "Sign in", otp_check: "checking the code…", ask_nootp: "the second factor (TOTP) is not set up on the remote PC, so the person there has to allow the connection", help_site: "Downloads, news and answers: [www.anypc.org](https://www.anypc.org)", tour_next: "Next", tour_skip: "Skip", tour_done: "Done", tour_of: "{n} of {m}", tour_id: "This is the ID of this PC. Give it to whoever will connect to you, together with the one-time code (or the password, if you do not ask).", tour_pw: "The permanent password of this PC: for connecting without asking (a TOTP code is also needed).", tour_go: "To connect to another PC, enter its ID and password and press “Connect”.", tour_opts: "“Turbo” makes text sharper and saves traffic. “View only” shows the remote screen without controlling it.", tour_help: "Need a reminder? The “?” button opens help.", tour_bye: "“Disconnect” ends the session right away.", tour_fs: "Full screen hides this bar. Move the mouse to the top edge of the screen to bring it back.", tour_files: "Send and get files here. Received files go to the Downloads folder; the transfers button shows progress.",

  ru: { mode_limit: "Управление отклонили 3 раза — чтобы попросить снова, подключитесь заново", mode_ctl: "Управление", mode_ctl_t: "Попросить управление: человек за удалённым ПК должен нажать «Разрешить»", mode_view: "Только просмотр", mode_view_t: "Перейти в просмотр: мышь, клавиатура, буфер обмена и файлы больше не передаются", mode_ask: "Ждём «Разрешить» на удалённом ПК…", mode_denied: "Управление не разрешили", mode_viewonly: "На удалённом ПК включён «Только показ экрана» — управление невозможно", mode_rights: "Для этого подключения управление недоступно", mode_busy: "Запрос уже отправлен — ждём ответа", mode_again: "Только что отказали — повторить можно через 10 секунд", help_view2: "Если вы вошли по одноразовому коду и «Разрешить», режим можно сменить во время сессии: «Только просмотр» — сразу, «Управление» — человек за удалённым ПК снова должен нажать «Разрешить». При входе паролем или по имени режим задают ваши права на удалённом ПК.", code_l: "Одноразовый код:", code_new_t: "Новый код (старый перестанет действовать)", tour_code: "Когда включено «Спрашивать перед каждым подключением», сообщите ID и этот одноразовый код тому, кто подключается. Код меняется после каждой сессии, ↻ — сразу.", help_code: "Когда включено «Спрашивать перед каждым подключением», пароль — одноразовый код в блоке «Это рабочее место»: он меняется после каждой сессии, после неверных попыток и по ↻. Постоянный пароль и пользователи действуют, только когда галочка снята (вместе с кодом TOTP).", user_p: "Имя (необязательно)", e_nousers: "удалённый ПК не знает имён пользователей — обновите там AnyPC или оставьте «Имя» пустым", e_auth_u: "неверное имя или пароль", users_h: "Пользователи", users_hint: "Каждому — своё имя, пароль и права. Вход без имени — по паролю этого компьютера выше.", uname_p: "Имя", u_full: "Полный доступ", u_view: "Только просмотр", u_add: "Сохранить", u_pw: "Пароль", u_otp: "Настроить TOTP", u_otp_off: "Отключить TOTP", u_del: "Удалить", u_del_q: "Удалить пользователя «%s»?", help_sec4: "В блоке «Пользователи» на удалённом ПК каждому можно дать своё имя, пароль и права (полный доступ или только просмотр): имя вводят в поле «Имя» при подключении, и удалённый ПК показывает его на плашке сессии. Без имени вход — по паролю самого ПК.", help_b: "Справка", help_h: "Как пользоваться AnyPC", help_x: "Закрыть", help_tour: "Показать подсказки снова", help_about_h: "Что такое AnyPC", help_about: "AnyPC показывает экран другого компьютера и даёт работать на нём своей мышью и клавиатурой — будто вы сидите перед ним. Соединение шифруется. Картинка идёт напрямую между двумя ПК, а если напрямую не выходит — через сервер-ретранслятор.", help_conn_h: "Как подключиться к другому ПК", help_conn: "Узнайте у человека за удалённым ПК его ID (9 цифр) и пароль. Введите их в блоке «Удалённое рабочее место» и нажмите «Подключиться».", help_conn2: "Если удалённый ПК спрашивает подтверждение, подождите, пока там ответят. ID, к которым вы уже подключались, видны в «Недавних» — щелчок подставит ID.", help_host_h: "Как разрешить подключаться к этому ПК", help_host: "Без пароля к этому ПК не подключится никто. Задайте пароль от 8 символов в блоке «Это рабочее место» и сообщайте его вместе с ID только тем, кому доверяете.", help_host2: "Если включено «Спрашивать перед каждым входящим подключением», на каждую попытку появится окно с тремя ответами. «Разрешить» — даёт управление, «Только просмотр» — показывает экран без управления, «Отклонить» — отказ. Нет ответа 30 секунд — тоже отказ.", help_turbo_h: "Турбо (VP9)", help_turbo: "Турбо передаёт видео в VP9 вместо H.264: текст чётче, трафика меньше. Если удалённый ПК не умеет VP9, AnyPC просто возьмёт H.264.", help_view_h: "Только просмотр", help_view: "Вы видите удалённый экран, но мышь, клавиатура, буфер обмена и файлы не передаются. Удобно, когда нужно только посмотреть. Человек за удалённым ПК тоже может выбрать этот режим в окне «Разрешить». На удалённом ПК можно включить «Только показ экрана» в блоке «Это рабочее место» — тогда каждое входящее подключение будет только просмотром.", viewonly_l: "Только показ экрана", viewonly_t: "Каждое входящее подключение — только просмотр: мышь, клавиатура, буфер обмена и файлы с той стороны не принимаются. «Разрешить» тоже даёт только просмотр", help_audio_h: "Звук (микрофоны)", help_audio: "Каждый сам включает и выключает свой микрофон кнопкой 🎤: управляющий — на панели сессии, человек за удалённым ПК — в окне AnyPC на нём. По умолчанию оба выключены; в первый раз браузер спросит доступ к микрофону. Пока микрофон удалённого ПК включён, на его плашке видно 🎤. Для звука на удалённом ПК должно быть открыто окно AnyPC; если ничего не слышно, нажмите «🔈 Нажмите, чтобы слышать удалённый ПК». Наушники убирают эхо. «Только просмотр» звук не отключает.", help_files_h: "Файлы", help_files: "«Отправить файл» копирует файл с этого ПК на удалённый; можно и просто перетащить файл на удалённый экран. «Получить файл» открывает выбор файла на удалённом ПК, чтобы забрать файл оттуда.", help_files2: "Файлы сохраняются в папку «Загрузки» на принимающем ПК. Кнопка передач на панели сессии показывает ход и список файлов. Если передача оборвалась, отправьте файл ещё раз — она продолжится с места обрыва.", help_clip_h: "Буфер обмена", help_clip: "Текст, скопированный на удалённом ПК, попадает в буфер обмена этого ПК. Скопированное здесь в программе AnyPC уходит туда само, а в браузере нажмите Ctrl+V в окне сессии или кнопку «Передать буфер».", help_keys_h: "Особые клавиши", help_keys: "Некоторые сочетания перехватывает сам этот ПК, и до удалённого они не доходят. Для них есть кнопки на панели сессии: «Win» открывает меню «Пуск», «Alt+Tab» переключает окна, «Ctrl+Shift+Esc» открывает диспетчер задач.", help_sec_h: "Безопасность", help_sec: "Пока идёт сессия, на удалённом ПК всегда видна плашка о том, что им управляют. Кнопка «Разорвать» на ней сразу завершает сессию — человек там может остановить вас в любой момент.", help_sec2: "У каждого ПК свой ключ, его отпечаток показан под ID. AnyPC запоминает ключ каждого ПК, к которому вы подключались. Если ключ сменился, появится предупреждение: если AnyPC там не переустанавливали, не подключайтесь — кто-то может выдавать себя за этот ПК.", e_otp_late: "время на ввод кода истекло — подключитесь снова", help_sec3: "Для входа без подтверждения удалённый ПК, кроме пароля, просит 6-значный код из приложения-аутентификатора на телефоне (TOTP). Он настраивается в блоке «Это рабочее место», когда вы снимаете «Спрашивать перед каждым входящим подключением». «Запомнить пароль» хранит пароль на этом ПК, поэтому вход без подтверждения защищён вторым фактором.", otp_is_on: "Вход без подтверждения: пароль + код из приложения-аутентификатора (TOTP)", otp_warn: "Вход без подтверждения выключен, пока не настроен второй фактор (TOTP): каждое подключение спрашивает «Разрешить / Отклонить».", otp_setup: "Настроить", otp_h: "Второй фактор (TOTP)", otp_scan: "Для входа без подтверждения после пароля понадобится код из приложения-аутентификатора. Отсканируйте QR-код приложением (Google Authenticator, Microsoft Authenticator, Aegis…) или введите ключ вручную, затем введите 6-значный код, который оно покажет.", otp_key: "Ключ:", otp_code_p: "Код из 6 цифр", otp_on: "Включить", otp_cancel: "Отмена", otp_bad: "Неверный код. Проверьте, что время на телефоне верное, и попробуйте снова", remember_l: "Запомнить пароль", otp_ask: "Введите 6-значный код из приложения-аутентификатора для этого ПК", otp_send: "Войти", otp_check: "проверка кода…", ask_nootp: "на удалённом ПК не настроен второй фактор (TOTP), поэтому подключение должен разрешить человек там", help_site: "Скачать программу, новости и ответы на вопросы: [www.anypc.org](https://www.anypc.org)", tour_next: "Далее", tour_skip: "Пропустить", tour_done: "Готово", tour_of: "{n} из {m}", tour_id: "Это ID этого ПК. Сообщите его тому, кто будет к вам подключаться, вместе с одноразовым кодом (или паролем, если не спрашивать).", tour_pw: "Постоянный пароль этого ПК — для подключения без вопросов (нужен ещё код TOTP).", tour_go: "Чтобы подключиться к другому ПК, введите его ID и пароль и нажмите «Подключиться».", tour_opts: "«Турбо» делает текст чётче и экономит трафик. «Только просмотр» показывает удалённый экран без управления.", tour_help: "Что-то забыли? Кнопка «?» открывает справку.", tour_bye: "«Разорвать» сразу завершает сессию.", tour_fs: "В полноэкранном режиме эта панель прячется. Подведите мышь к верхнему краю экрана, и она вернётся.", tour_files: "Здесь отправляют и получают файлы. Полученное сохраняется в «Загрузки», ход передачи видно на кнопке передач.",

  zh: { mode_limit: "控制已被拒绝 3 次——如需再次请求，请重新连接", mode_ctl: "控制", mode_ctl_t: "请求控制：远程电脑那边的人需要点击“允许”", mode_view: "仅查看", mode_view_t: "切换为仅查看：不再发送鼠标、键盘、剪贴板和文件", mode_ask: "正在等待远程电脑上的“允许”…", mode_denied: "未被允许控制", mode_viewonly: "远程电脑开启了“仅显示屏幕”——无法控制", mode_rights: "此连接无法获得控制", mode_busy: "请求已发送——正在等待回应", mode_again: "刚被拒绝——10 秒后可再次请求", help_view2: "如果您是用一次性代码并经“允许”连接的，会话中可以切换模式：“仅查看”立即生效，“控制”需要远程电脑那边的人再次点击“允许”。用密码或用户名连接时，模式由您在远程电脑上的权限决定。", code_l: "一次性代码：", code_new_t: "新代码（旧代码将失效）", tour_code: "开启“每次连接前询问”时，把 ID 和这个一次性代码告诉连接的人。每次会话后代码都会更换，点 ↻ 立即更换。", help_code: "开启“每次连接前询问”时，密码就是“本机”中显示的一次性代码：每次会话后、多次输错后或点 ↻ 时更换。固定密码和用户只在关闭该选项时有效（还需 TOTP 代码）。", user_p: "用户名（可选）", e_nousers: "远程电脑不支持用户名——请在那边更新 AnyPC，或将“用户名”留空", e_auth_u: "用户名或密码错误", users_h: "用户", users_hint: "为每个人设置自己的用户名、密码和权限。不填用户名连接时，使用上方这台电脑的密码。", uname_p: "用户名", u_full: "完全控制", u_view: "仅查看", u_add: "保存", u_pw: "密码", u_otp: "设置 TOTP", u_otp_off: "关闭 TOTP", u_del: "删除", u_del_q: "删除用户“%s”？", help_sec4: "在远程电脑的“用户”中，可以为每个人设置自己的用户名、密码和权限（完全控制或仅查看）；连接时在“用户名”中输入，远程电脑会在会话提示上显示它。不填用户名时使用该电脑本身的密码。", help_b: "帮助", help_h: "AnyPC 使用说明", help_x: "关闭", help_tour: "再次显示提示", help_about_h: "AnyPC 是什么", help_about: "AnyPC 能显示另一台电脑的屏幕，让您用自己的鼠标和键盘操作它，就像坐在它面前一样。连接是加密的。画面尽量在两台电脑之间直接传输，无法直连时经由中继服务器。", help_conn_h: "连接到另一台电脑", help_conn: "向远程电脑那边的人要它的 ID（9 位数字）和密码。在“远程电脑”中填入，然后点“连接”。", help_conn2: "如果远程电脑需要确认，请等那边的人回应。连接过的 ID 会出现在“最近”中，点一下即可填入。", help_host_h: "允许别人连接到本机", help_host: "没有密码，谁也连不上本机。在“本机”中设置至少 8 个字符的密码，并只把它和您的 ID 告诉信任的人。", help_host2: "开启“每次传入连接前询问”后，每次连接都会弹出窗口，有三个选项：“允许”交出控制权，“仅查看”只显示屏幕、不能控制，“拒绝”则不让连接。30 秒内不回应也视为拒绝。", help_turbo_h: "加速 (VP9)", help_turbo: "加速模式用 VP9 代替 H.264 传输视频：文字更清晰，流量更少。如果远程电脑不支持 VP9，AnyPC 会自动改用 H.264。", help_view_h: "仅查看", help_view: "您能看到远程屏幕，但不会发送鼠标、键盘、剪贴板和文件。只需要看一看时很方便。远程电脑那边的人也可以在“允许”窗口中选择这一模式。远程电脑也可以在“本机”中开启“仅显示屏幕”，这样每个传入连接都只能查看。", viewonly_l: "仅显示屏幕", viewonly_t: "每个传入连接都仅能查看：不接受对方的鼠标、键盘、剪贴板和文件。“允许”也只给查看权限", help_audio_h: "声音（麦克风）", help_audio: "每个人用 🎤 按钮自己开关自己的麦克风：控制的一方在会话工具栏中，远程电脑那边的人在该电脑的 AnyPC 窗口中。两者默认都关闭；第一次开启时浏览器会请求麦克风权限。远程电脑的麦克风开启期间，它的提示条上显示 🎤。声音需要远程电脑上打开 AnyPC 窗口；如果听不到声音，请点“🔈 点击收听远程电脑”。戴耳机可避免回声。“仅查看”不会关闭声音。", help_files_h: "文件", help_files: "“发送文件”把本机的文件复制到远程电脑，也可以直接把文件拖到远程屏幕上。“获取文件”会在远程电脑上打开文件选择窗口，从那里取回文件。", help_files2: "文件保存在接收方电脑的“下载”文件夹中。会话栏上的传输按钮显示进度和文件列表。传输中断时，再发送一次同一文件即可从断点继续。", help_clip_h: "剪贴板", help_clip: "在远程电脑上复制的文字会进入本机剪贴板。在 AnyPC 程序中，本机复制的文字会自动发过去；在浏览器中请在会话窗口按 Ctrl+V，或点“发送剪贴板”。", help_keys_h: "特殊按键", help_keys: "有些组合键会被本机自己截获，到不了远程电脑。请改用会话栏上的按钮：“Win”打开开始菜单，“Alt+Tab”切换窗口，“Ctrl+Shift+Esc”打开任务管理器。", help_sec_h: "安全", help_sec: "会话期间，远程电脑上始终显示一个提示条，表明它正被控制。提示条上的“断开”按钮会立即结束会话，那边的人随时可以让您停下。", help_sec2: "每台电脑都有自己的密钥，其指纹显示在 ID 下方。AnyPC 会记住您连接过的每台电脑的密钥。如果密钥变了，会出现警告：除非那台电脑重装过 AnyPC，否则不要连接，可能有人在冒充它。", e_otp_late: "输入验证码的时间已过——请重新连接", help_sec3: "要免确认连接，远程电脑除密码外还要求手机上身份验证器应用中的 6 位验证码（TOTP）。在“本机”中取消“每次传入连接前询问”时进行设置。“记住密码”会把密码保存在这台电脑上，因此免确认连接由第二因素保护。", otp_is_on: "免确认连接：密码 + 身份验证器应用中的验证码（TOTP）", otp_warn: "在设置第二因素（TOTP）之前，免确认连接已关闭：每次连接都会询问“允许 / 拒绝”。", otp_setup: "设置", otp_h: "第二因素（TOTP）", otp_scan: "免确认连接时，输入密码后还需要身份验证器应用中的验证码。用应用（Google Authenticator、Microsoft Authenticator、Aegis…）扫描二维码或手动输入密钥，然后输入它显示的 6 位验证码。", otp_key: "密钥：", otp_code_p: "6 位验证码", otp_on: "开启", otp_cancel: "取消", otp_bad: "验证码错误。请确认手机时间正确后重试", remember_l: "记住密码", otp_ask: "请输入身份验证器应用中此电脑的 6 位验证码", otp_send: "登录", otp_check: "正在验证…", ask_nootp: "远程电脑未设置第二因素（TOTP），因此需要那边的人允许连接", help_site: "下载、新闻和常见问题：[www.anypc.org](https://www.anypc.org)", tour_next: "下一步", tour_skip: "跳过", tour_done: "完成", tour_of: "{n} / {m}", tour_id: "这是本机的 ID。请把它和一次性代码（不询问时为密码）一起告诉要连接你的人。", tour_pw: "本机的固定密码：用于无需询问的连接（还需要 TOTP 代码）。", tour_go: "要连接另一台电脑，输入它的 ID 和密码，然后点“连接”。", tour_opts: "“加速”让文字更清晰、更省流量。“仅查看”只显示远程屏幕，不进行控制。", tour_help: "忘了怎么用？“?”按钮可以打开帮助。", tour_bye: "“断开”会立即结束会话。", tour_fs: "全屏时这个工具栏会隐藏。把鼠标移到屏幕顶端，它就会出现。", tour_files: "在这里发送和获取文件。收到的文件保存在“下载”文件夹，传输按钮显示进度。",

  es: { mode_limit: "El control se rechazó 3 veces: vuelve a conectarte para pedirlo de nuevo", mode_ctl: "Control", mode_ctl_t: "Pedir el control: quien está en el PC remoto debe pulsar «Permitir»", mode_view: "Solo ver", mode_view_t: "Pasar a solo ver: el ratón, el teclado, el portapapeles y los archivos dejan de enviarse", mode_ask: "Esperando «Permitir» en el PC remoto…", mode_denied: "No se permitió el control", mode_viewonly: "El PC remoto tiene activado «Solo mostrar la pantalla»: el control no es posible", mode_rights: "Esta conexión no puede obtener el control", mode_busy: "La solicitud ya se envió: esperando respuesta", mode_again: "Se acaba de rechazar: vuelve a intentarlo en 10 segundos", help_view2: "Si te conectaste con un código de un solo uso y «Permitir», puedes cambiar de modo durante la sesión: «Solo ver» funciona al instante, «Control» pide a quien está en el PC remoto que vuelva a pulsar «Permitir». Con contraseña o nombre de usuario, el modo lo fijan tus permisos en el PC remoto.", code_l: "Código de un solo uso:", code_new_t: "Código nuevo (el anterior deja de valer)", tour_code: "Con «Preguntar antes de cada conexión» activado, da el ID y este código de un solo uso a quien se conecte. Cambia después de cada sesión; ↻ lo cambia al momento.", help_code: "Con «Preguntar antes de cada conexión» activado, la contraseña es un código de un solo uso que se ve en «Este equipo»: cambia tras cada sesión, tras varios intentos fallidos y con ↻. La contraseña fija y los usuarios solo valen con esa opción desactivada (y un código TOTP).", user_p: "Nombre (opcional)", e_nousers: "el PC remoto no admite nombres de usuario: actualiza AnyPC allí o deja «Nombre» vacío", e_auth_u: "nombre o contraseña incorrectos", users_h: "Usuarios", users_hint: "Da a cada persona su propio nombre, contraseña y permisos. Conectarse sin nombre usa la contraseña de este PC de arriba.", uname_p: "Nombre", u_full: "Control total", u_view: "Solo ver", u_add: "Guardar", u_pw: "Contraseña", u_otp: "Configurar TOTP", u_otp_off: "Desactivar TOTP", u_del: "Eliminar", u_del_q: "¿Eliminar el usuario «%s»?", help_sec4: "En «Usuarios» del PC remoto cada persona puede tener su propio nombre, contraseña y permisos (control total o solo ver); al conectarse escribe el nombre en «Nombre» y el PC remoto lo muestra en el aviso de sesión. Sin nombre se usa la contraseña del propio PC.", help_b: "Ayuda", help_h: "Cómo funciona AnyPC", help_x: "Cerrar", help_tour: "Volver a mostrar los consejos", help_about_h: "Qué es AnyPC", help_about: "AnyPC muestra la pantalla de otro equipo y te deja usarlo con tu propio ratón y teclado, como si estuvieras delante. La conexión va cifrada. La imagen viaja directamente entre los dos PC siempre que se puede y, si no, a través de un servidor de retransmisión.", help_conn_h: "Conectarse a otro PC", help_conn: "Pide a quien está en el PC remoto su ID (9 dígitos) y la contraseña. Escríbelos en «Equipo remoto» y pulsa «Conectar».", help_conn2: "Si el PC remoto pide confirmación, espera a que alguien responda allí. Los ID que ya has usado aparecen en «Recientes»: un clic rellena el ID.", help_host_h: "Permitir que se conecten a este PC", help_host: "Nadie puede conectarse a este PC sin contraseña. Pon una de al menos 8 caracteres en «Este equipo» y dásela, junto con tu ID, solo a personas de confianza.", help_host2: "Con «Preguntar antes de cada conexión entrante» activado, cada intento abre una ventana con tres respuestas. «Permitir» da el control, «Solo ver» muestra la pantalla sin control y «Rechazar» lo impide. Si nadie responde en 30 segundos, se rechaza.", help_turbo_h: "Turbo (VP9)", help_turbo: "Turbo envía el vídeo en VP9 en lugar de H.264: el texto se ve más nítido y se gasta menos tráfico. Si el PC remoto no admite VP9, AnyPC usa H.264 sin más.", help_view_h: "Solo ver", help_view: "Ves la pantalla remota, pero no se envían el ratón, el teclado, el portapapeles ni los archivos. Útil cuando solo hace falta mirar. Quien está en el PC remoto también puede elegir este modo en la ventana «Permitir». El PC remoto también puede activar «Solo mostrar la pantalla» en «Este equipo»: entonces cada conexión entrante es solo ver.", viewonly_l: "Solo mostrar la pantalla", viewonly_t: "Cada conexión entrante es solo ver: no se aceptan ratón, teclado, portapapeles ni archivos del otro lado. «Permitir» también da solo ver", help_audio_h: "Sonido (micrófonos)", help_audio: "Cada uno activa y desactiva su propio micrófono con el botón 🎤: quien controla, en la barra de la sesión; quien está en el PC remoto, en la ventana de AnyPC de ese PC. Los dos están desactivados por defecto; la primera vez el navegador pide acceso al micrófono. Mientras el micrófono del PC remoto está activado, su aviso muestra 🎤. Para el sonido, en el PC remoto tiene que estar abierta la ventana de AnyPC; si no oyes nada, pulsa «🔈 Haz clic para oír el PC remoto». Con auriculares no hay eco. «Solo ver» no desactiva el sonido.", help_files_h: "Archivos", help_files: "«Enviar archivo» copia un archivo de este PC al remoto; también puedes soltarlo sobre la pantalla remota. «Recibir archivo» abre un selector de archivos en el PC remoto para traerte un archivo de allí.", help_files2: "Los archivos se guardan en la carpeta Descargas del PC que los recibe. El botón de transferencias de la barra de sesión muestra el progreso y la lista de archivos. Si una transferencia se corta, envía el archivo otra vez y seguirá donde se quedó.", help_clip_h: "Portapapeles", help_clip: "El texto copiado en el PC remoto llega al portapapeles de este PC. En el programa AnyPC, lo que copias aquí pasa allí solo; en el navegador pulsa Ctrl+V en la ventana de la sesión o usa «Enviar portapapeles».", help_keys_h: "Teclas especiales", help_keys: "Algunas combinaciones las captura este PC y nunca llegan al remoto. Para ellas están los botones de la barra de sesión: «Win» abre el menú Inicio, «Alt+Tab» cambia de ventana y «Ctrl+Shift+Esc» abre el Administrador de tareas.", help_sec_h: "Seguridad", help_sec: "Durante la sesión, el PC remoto muestra siempre un aviso de que lo están controlando. Su botón «Desconectar» corta la sesión al instante: quien está allí puede pararte en cualquier momento.", help_sec2: "Cada PC tiene su propia clave; su huella aparece bajo el ID. AnyPC recuerda la clave de cada PC al que te conectas. Si la clave cambia, verás un aviso: si no se reinstaló AnyPC en ese PC, no te conectes, alguien podría estar haciéndose pasar por él.", e_otp_late: "se acabó el tiempo para introducir el código: vuelve a conectar", help_sec3: "Para conectar sin confirmación, el PC remoto pide, además de la contraseña, un código de 6 dígitos de una app de autenticación en el teléfono (TOTP). Se configura en «Este equipo» al desmarcar «Preguntar antes de cada conexión entrante». «Recordar contraseña» guarda la contraseña en este PC; por eso la conexión sin confirmación está protegida por el segundo factor.", otp_is_on: "Conexión sin confirmación: contraseña + código de la app de autenticación (TOTP)", otp_warn: "La conexión sin confirmación está desactivada hasta configurar un segundo factor (TOTP): cada conexión pregunta Permitir / Rechazar.", otp_setup: "Configurar", otp_h: "Segundo factor (TOTP)", otp_scan: "Para conectar sin confirmación hará falta, tras la contraseña, un código de una app de autenticación. Escanea el código QR con la app (Google Authenticator, Microsoft Authenticator, Aegis…) o introduce la clave a mano y escribe el código de 6 dígitos que muestre.", otp_key: "Clave:", otp_code_p: "Código de 6 dígitos", otp_on: "Activar", otp_cancel: "Cancelar", otp_bad: "Código incorrecto. Comprueba que la hora del teléfono es correcta e inténtalo de nuevo", remember_l: "Recordar contraseña", otp_ask: "Introduce el código de 6 dígitos de la app de autenticación para este PC", otp_send: "Entrar", otp_check: "comprobando el código…", ask_nootp: "el PC remoto no tiene configurado el segundo factor (TOTP), así que la conexión debe permitirla alguien allí", help_site: "Descargas, novedades y respuestas: [www.anypc.org](https://www.anypc.org)", tour_next: "Siguiente", tour_skip: "Omitir", tour_done: "Listo", tour_of: "{n} de {m}", tour_id: "Este es el ID de este PC. Dáselo a quien vaya a conectarse, junto con el código de un solo uso (o la contraseña, si no se pregunta).", tour_pw: "La contraseña fija de este PC: para conectarse sin preguntar (también hace falta un código TOTP).", tour_go: "Para conectarte a otro PC, escribe su ID y su contraseña y pulsa «Conectar».", tour_opts: "«Turbo» hace el texto más nítido y ahorra tráfico. «Solo ver» muestra la pantalla remota sin controlarla.", tour_help: "¿Se te olvidó algo? El botón «?» abre la ayuda.", tour_bye: "«Desconectar» termina la sesión al momento.", tour_fs: "En pantalla completa esta barra se oculta. Lleva el ratón al borde superior de la pantalla para que vuelva.", tour_files: "Aquí se envían y reciben archivos. Lo recibido va a Descargas; el botón de transferencias muestra el progreso.",

  de: { mode_limit: "Steuerung wurde 3-mal abgelehnt – für eine neue Anfrage neu verbinden", mode_ctl: "Steuern", mode_ctl_t: "Steuerung anfragen: Die Person am entfernten PC muss „Erlauben“ drücken", mode_view: "Nur ansehen", mode_view_t: "Zu „Nur ansehen“ wechseln: Maus, Tastatur, Zwischenablage und Dateien werden nicht mehr übertragen", mode_ask: "Warte auf „Erlauben“ am entfernten PC…", mode_denied: "Steuerung wurde nicht erlaubt", mode_viewonly: "Am entfernten PC ist „Nur Bildschirm zeigen“ an – Steuerung nicht möglich", mode_rights: "Diese Verbindung kann keine Steuerung erhalten", mode_busy: "Anfrage ist schon gesendet – warte auf Antwort", mode_again: "Gerade abgelehnt – erneut in 10 Sekunden möglich", help_view2: "Wenn Sie sich mit einem Einmalcode und „Erlauben“ verbunden haben, können Sie den Modus während der Sitzung wechseln: „Nur ansehen“ wirkt sofort, bei „Steuern“ muss die Person am entfernten PC erneut „Erlauben“ drücken. Mit Passwort oder Benutzername bestimmen Ihre Rechte am entfernten PC den Modus.", code_l: "Einmalcode:", code_new_t: "Neuer Code (der alte gilt nicht mehr)", tour_code: "Ist „Vor jeder Verbindung fragen“ an, geben Sie die ID und diesen Einmalcode an die Person, die sich verbindet. Er wechselt nach jeder Sitzung, ↻ wechselt ihn sofort.", help_code: "Ist „Vor jeder Verbindung fragen“ an, ist das Passwort ein Einmalcode unter „Dieser Computer“: Er wechselt nach jeder Sitzung, nach zu vielen Fehlversuchen und per ↻. Das feste Passwort und die Benutzer gelten nur, wenn die Option aus ist (dazu ein TOTP-Code).", user_p: "Name (optional)", e_nousers: "der entfernte PC kennt keine Benutzernamen – AnyPC dort aktualisieren oder „Name“ leer lassen", e_auth_u: "falscher Name oder falsches Passwort", users_h: "Benutzer", users_hint: "Jede Person bekommt eigenen Namen, eigenes Passwort und eigene Rechte. Ohne Namen gilt das Passwort dieses PCs oben.", uname_p: "Name", u_full: "Volle Steuerung", u_view: "Nur ansehen", u_add: "Speichern", u_pw: "Passwort", u_otp: "TOTP einrichten", u_otp_off: "TOTP ausschalten", u_del: "Löschen", u_del_q: "Benutzer „%s“ löschen?", help_sec4: "Unter „Benutzer“ am entfernten PC kann jede Person eigenen Namen, eigenes Passwort und eigene Rechte bekommen (volle Steuerung oder nur ansehen); beim Verbinden wird der Name unter „Name“ eingegeben, der entfernte PC zeigt ihn im Sitzungshinweis. Ohne Namen gilt das Passwort des PCs selbst.", help_b: "Hilfe", help_h: "So funktioniert AnyPC", help_x: "Schließen", help_tour: "Tipps erneut anzeigen", help_about_h: "Was AnyPC ist", help_about: "AnyPC zeigt den Bildschirm eines anderen Computers und lässt Sie ihn mit Ihrer eigenen Maus und Tastatur bedienen, als säßen Sie davor. Die Verbindung ist verschlüsselt. Das Bild läuft nach Möglichkeit direkt zwischen den beiden PCs, sonst über einen Relay-Server.", help_conn_h: "Mit einem anderen PC verbinden", help_conn: "Lassen Sie sich von der Person am entfernten PC dessen ID (9 Ziffern) und Passwort geben. Tragen Sie beides unter „Entfernter Computer“ ein und klicken Sie auf „Verbinden“.", help_conn2: "Fragt der entfernte PC nach einer Bestätigung, warten Sie, bis dort jemand antwortet. Bereits genutzte IDs stehen unter „Zuletzt“; ein Klick setzt die ID ein.", help_host_h: "Verbindungen zu diesem PC erlauben", help_host: "Ohne Passwort kann sich niemand mit diesem PC verbinden. Legen Sie unter „Dieser Computer“ eines mit mindestens 8 Zeichen fest und geben Sie es zusammen mit Ihrer ID nur Menschen, denen Sie vertrauen.", help_host2: "Ist „Vor jeder eingehenden Verbindung fragen“ aktiv, öffnet jeder Versuch ein Fenster mit drei Antworten. „Erlauben“ gibt die Steuerung frei, „Nur ansehen“ zeigt den Bildschirm ohne Steuerung, „Ablehnen“ weist ab. Ohne Antwort innerhalb von 30 Sekunden wird abgelehnt.", help_turbo_h: "Turbo (VP9)", help_turbo: "Turbo überträgt das Video als VP9 statt H.264: Text wirkt schärfer, und es fällt weniger Datenverkehr an. Kann der entfernte PC kein VP9, nimmt AnyPC einfach H.264.", help_view_h: "Nur ansehen", help_view: "Sie sehen den entfernten Bildschirm, aber Maus, Tastatur, Zwischenablage und Dateien werden nicht übertragen. Praktisch, wenn Sie nur zuschauen müssen. Die Person am entfernten PC kann diesen Modus auch selbst im Fenster „Erlauben“ wählen. Der entfernte PC kann auch „Nur Bildschirm zeigen“ unter „Dieser Computer“ einschalten: Dann ist jede eingehende Verbindung nur zum Ansehen.", viewonly_l: "Nur Bildschirm zeigen", viewonly_t: "Jede eingehende Verbindung ist nur zum Ansehen: Maus, Tastatur, Zwischenablage und Dateien der Gegenseite werden nicht angenommen. „Erlauben“ gibt ebenfalls nur Ansehen", help_audio_h: "Ton (Mikrofone)", help_audio: "Jeder schaltet sein eigenes Mikrofon mit der Schaltfläche 🎤 ein und aus: wer steuert, in der Leiste der Sitzung, die Person am entfernten PC im AnyPC-Fenster dort. Beide sind standardmäßig aus; beim ersten Mal fragt der Browser nach dem Zugriff auf das Mikrofon. Solange das Mikrofon des entfernten PCs an ist, zeigt sein Hinweis 🎤. Für Ton muss auf dem entfernten PC das AnyPC-Fenster geöffnet sein; hören Sie nichts, klicken Sie auf „🔈 Klicken, um den entfernten PC zu hören“. Kopfhörer verhindern Echo. „Nur ansehen“ schaltet den Ton nicht ab.", help_files_h: "Dateien", help_files: "„Datei senden“ kopiert eine Datei von diesem PC auf den entfernten; Sie können sie auch einfach auf den entfernten Bildschirm ziehen. „Datei holen“ öffnet auf dem entfernten PC eine Dateiauswahl, um eine Datei von dort zu holen.", help_files2: "Dateien landen im Ordner „Downloads“ des empfangenden PCs. Die Übertragungsschaltfläche in der Sitzungsleiste zeigt Fortschritt und Dateiliste. Bricht eine Übertragung ab, senden Sie die Datei erneut, dann geht es an der Abbruchstelle weiter.", help_clip_h: "Zwischenablage", help_clip: "Auf dem entfernten PC kopierter Text landet in der Zwischenablage dieses PCs. Im AnyPC-Programm geht hier Kopiertes von selbst hinüber; im Browser drücken Sie Strg+V im Sitzungsfenster oder nutzen „Zwischenablage senden“.", help_keys_h: "Sondertasten", help_keys: "Manche Tastenkombinationen fängt dieser PC selbst ab, sie kommen nie am entfernten an. Dafür gibt es Schaltflächen in der Sitzungsleiste: „Win“ öffnet das Startmenü, „Alt+Tab“ wechselt das Fenster, „Ctrl+Shift+Esc“ öffnet den Task-Manager.", help_sec_h: "Sicherheit", help_sec: "Während einer Sitzung zeigt der entfernte PC immer einen Hinweis, dass er gesteuert wird. Dessen Schaltfläche „Trennen“ beendet die Sitzung sofort – die Person dort kann Sie jederzeit stoppen.", help_sec2: "Jeder PC hat einen eigenen Schlüssel; sein Fingerabdruck steht unter der ID. AnyPC merkt sich den Schlüssel jedes PCs, mit dem Sie sich verbinden. Ändert er sich, erscheint eine Warnung: Wurde AnyPC dort nicht neu installiert, verbinden Sie sich nicht – jemand könnte sich als dieser PC ausgeben.", e_otp_late: "die Zeit für die Codeeingabe ist abgelaufen – bitte erneut verbinden", help_sec3: "Für Verbindungen ohne Bestätigung verlangt der entfernte PC neben dem Passwort einen 6-stelligen Code aus einer Authenticator-App auf dem Telefon (TOTP). Er wird unter „Dieser Computer“ eingerichtet, wenn Sie „Vor jeder eingehenden Verbindung fragen“ ausschalten. „Passwort merken“ speichert das Passwort auf diesem PC, deshalb sind Verbindungen ohne Bestätigung durch den zweiten Faktor geschützt.", otp_is_on: "Verbindung ohne Bestätigung: Passwort + Code aus der Authenticator-App (TOTP)", otp_warn: "Verbindungen ohne Bestätigung sind aus, bis ein zweiter Faktor (TOTP) eingerichtet ist: Jede Verbindung fragt Erlauben / Ablehnen.", otp_setup: "Einrichten", otp_h: "Zweiter Faktor (TOTP)", otp_scan: "Für Verbindungen ohne Bestätigung wird nach dem Passwort ein Code aus einer Authenticator-App nötig. Scannen Sie den QR-Code mit der App (Google Authenticator, Microsoft Authenticator, Aegis…) oder geben Sie den Schlüssel von Hand ein, dann den 6-stelligen Code, den sie anzeigt.", otp_key: "Schlüssel:", otp_code_p: "6-stelliger Code", otp_on: "Einschalten", otp_cancel: "Abbrechen", otp_bad: "Falscher Code. Prüfen Sie, ob die Uhrzeit am Telefon stimmt, und versuchen Sie es erneut", remember_l: "Passwort merken", otp_ask: "Geben Sie den 6-stelligen Code aus der Authenticator-App für diesen PC ein", otp_send: "Anmelden", otp_check: "Code wird geprüft…", ask_nootp: "am entfernten PC ist kein zweiter Faktor (TOTP) eingerichtet, daher muss die Person dort die Verbindung erlauben", help_site: "Downloads, Neuigkeiten und Antworten: [www.anypc.org](https://www.anypc.org)", tour_next: "Weiter", tour_skip: "Überspringen", tour_done: "Fertig", tour_of: "{n} von {m}", tour_id: "Das ist die ID dieses PCs. Geben Sie sie zusammen mit dem Einmalcode (oder dem Passwort, wenn nicht gefragt wird) an die Person, die sich verbinden soll.", tour_pw: "Das feste Passwort dieses PCs: für Verbindungen ohne Nachfrage (dazu ist ein TOTP-Code nötig).", tour_go: "Um sich mit einem anderen PC zu verbinden, geben Sie dessen ID und Passwort ein und klicken auf „Verbinden“.", tour_opts: "„Turbo“ macht Text schärfer und spart Datenverkehr. „Nur ansehen“ zeigt den entfernten Bildschirm ohne Steuerung.", tour_help: "Etwas vergessen? Die Schaltfläche „?“ öffnet die Hilfe.", tour_bye: "„Trennen“ beendet die Sitzung sofort.", tour_fs: "Im Vollbild verschwindet diese Leiste. Bewegen Sie die Maus an den oberen Bildschirmrand, dann ist sie wieder da.", tour_files: "Hier senden und holen Sie Dateien. Empfangenes landet in „Downloads“; die Übertragungsschaltfläche zeigt den Fortschritt.",

  fr: { mode_limit: "Contrôle refusé 3 fois : reconnectez-vous pour redemander", mode_ctl: "Contrôle", mode_ctl_t: "Demander le contrôle : la personne devant le PC distant doit appuyer sur « Autoriser »", mode_view: "Affichage seul", mode_view_t: "Passer en affichage seul : la souris, le clavier, le presse-papiers et les fichiers ne sont plus transmis", mode_ask: "En attente de « Autoriser » sur le PC distant…", mode_denied: "Le contrôle n’a pas été autorisé", mode_viewonly: "Le PC distant a activé « Montrer l’écran seulement » : contrôle impossible", mode_rights: "Cette connexion ne peut pas obtenir le contrôle", mode_busy: "La demande est déjà envoyée : en attente de réponse", mode_again: "Refus à l’instant : réessayez dans 10 secondes", help_view2: "Si vous vous êtes connecté avec un code à usage unique et « Autoriser », vous pouvez changer de mode pendant la session : « Affichage seul » agit tout de suite, « Contrôle » demande à la personne devant le PC distant d’appuyer à nouveau sur « Autoriser ». Avec un mot de passe ou un nom d’utilisateur, le mode dépend de vos droits sur le PC distant.", code_l: "Code à usage unique :", code_new_t: "Nouveau code (l’ancien ne marche plus)", tour_code: "Avec « Demander avant chaque connexion » coché, donnez l’ID et ce code à usage unique à la personne qui se connecte. Il change après chaque session ; ↻ le change tout de suite.", help_code: "Avec « Demander avant chaque connexion » coché, le mot de passe est un code à usage unique affiché dans « Cet ordinateur » : il change après chaque session, après trop d’essais faux et avec ↻. Le mot de passe fixe et les utilisateurs ne valent que si l’option est décochée (avec un code TOTP).", user_p: "Nom (facultatif)", e_nousers: "le PC distant ne connaît pas les noms d’utilisateur — mettez AnyPC à jour là-bas ou laissez « Nom » vide", e_auth_u: "nom ou mot de passe incorrect", users_h: "Utilisateurs", users_hint: "Chaque personne a son nom, son mot de passe et ses droits. Sans nom, c’est le mot de passe de ce PC ci-dessus.", uname_p: "Nom", u_full: "Contrôle total", u_view: "Affichage seul", u_add: "Enregistrer", u_pw: "Mot de passe", u_otp: "Configurer TOTP", u_otp_off: "Désactiver TOTP", u_del: "Supprimer", u_del_q: "Supprimer l’utilisateur « %s » ?", help_sec4: "Dans « Utilisateurs » du PC distant, chaque personne peut avoir son nom, son mot de passe et ses droits (contrôle total ou affichage seul) ; elle saisit le nom dans « Nom » en se connectant, et le PC distant l’affiche sur le bandeau de session. Sans nom, c’est le mot de passe du PC lui-même.", help_b: "Aide", help_h: "Comment fonctionne AnyPC", help_x: "Fermer", help_tour: "Revoir les astuces", help_about_h: "AnyPC, c’est quoi", help_about: "AnyPC affiche l’écran d’un autre ordinateur et vous permet de l’utiliser avec votre propre souris et votre clavier, comme si vous étiez devant. La connexion est chiffrée. L’image passe directement entre les deux PC quand c’est possible, sinon par un serveur relais.", help_conn_h: "Se connecter à un autre PC", help_conn: "Demandez à la personne devant le PC distant son ID (9 chiffres) et le mot de passe. Saisissez-les dans « Ordinateur distant » et cliquez sur « Se connecter ».", help_conn2: "Si le PC distant demande une confirmation, attendez que quelqu’un réponde là-bas. Les ID déjà utilisés apparaissent dans « Récents » : un clic remplit l’ID.", help_host_h: "Autoriser les connexions à ce PC", help_host: "Personne ne peut se connecter à ce PC sans mot de passe. Définissez-en un d’au moins 8 caractères dans « Cet ordinateur » et ne le donnez, avec votre ID, qu’à des personnes de confiance.", help_host2: "Si « Demander avant chaque connexion entrante » est coché, chaque tentative ouvre une fenêtre avec trois réponses. « Autoriser » donne le contrôle, « Affichage seul » montre l’écran sans contrôle, « Refuser » rejette. Sans réponse en 30 secondes, c’est un refus.", help_turbo_h: "Turbo (VP9)", help_turbo: "Turbo envoie la vidéo en VP9 au lieu de H.264 : le texte est plus net et le trafic plus faible. Si le PC distant ne gère pas VP9, AnyPC utilise simplement H.264.", help_view_h: "Affichage seul", help_view: "Vous voyez l’écran distant, mais la souris, le clavier, le presse-papiers et les fichiers ne sont pas transmis. Pratique quand il suffit de regarder. La personne devant le PC distant peut aussi choisir ce mode dans la fenêtre « Autoriser ». Le PC distant peut aussi activer « Montrer l’écran seulement » dans « Cet ordinateur » : chaque connexion entrante est alors en affichage seul.", viewonly_l: "Montrer l’écran seulement", viewonly_t: "Chaque connexion entrante est en affichage seul : souris, clavier, presse-papiers et fichiers de l’autre côté ne sont pas acceptés. « Autoriser » donne aussi l’affichage seul", help_audio_h: "Son (micros)", help_audio: "Chacun active et désactive son propre micro avec le bouton 🎤 : la personne qui contrôle, dans la barre de la session ; la personne devant le PC distant, dans la fenêtre AnyPC de ce PC. Les deux sont désactivés par défaut ; la première fois, le navigateur demande l’accès au micro. Tant que le micro du PC distant est activé, son bandeau affiche 🎤. Le son nécessite que la fenêtre AnyPC soit ouverte sur le PC distant ; si vous n’entendez rien, cliquez sur « 🔈 Cliquez pour entendre le PC distant ». Un casque évite l’écho. L’affichage seul ne coupe pas le son.", help_files_h: "Fichiers", help_files: "« Envoyer un fichier » copie un fichier de ce PC vers le PC distant ; vous pouvez aussi le déposer sur l’écran distant. « Récupérer un fichier » ouvre un sélecteur de fichiers sur le PC distant pour en rapatrier un.", help_files2: "Les fichiers sont enregistrés dans le dossier Téléchargements du PC qui les reçoit. Le bouton des transferts dans la barre de session affiche la progression et la liste des fichiers. Si un transfert est interrompu, renvoyez le fichier : il reprendra là où il s’est arrêté.", help_clip_h: "Presse-papiers", help_clip: "Le texte copié sur le PC distant arrive dans le presse-papiers de ce PC. Dans le programme AnyPC, ce que vous copiez ici part tout seul là-bas ; dans un navigateur, appuyez sur Ctrl+V dans la fenêtre de session ou utilisez « Envoyer le presse-papiers ».", help_keys_h: "Touches spéciales", help_keys: "Certaines combinaisons sont interceptées par ce PC et n’atteignent jamais le PC distant. Utilisez plutôt les boutons de la barre de session : « Win » ouvre le menu Démarrer, « Alt+Tab » change de fenêtre, « Ctrl+Shift+Esc » ouvre le Gestionnaire des tâches.", help_sec_h: "Sécurité", help_sec: "Pendant une session, le PC distant affiche toujours un bandeau indiquant qu’il est contrôlé. Son bouton « Déconnecter » met fin à la session aussitôt : la personne sur place peut vous arrêter à tout moment.", help_sec2: "Chaque PC a sa propre clé ; son empreinte s’affiche sous l’ID. AnyPC retient la clé de chaque PC auquel vous vous connectez. Si la clé change, un avertissement s’affiche : si AnyPC n’a pas été réinstallé sur ce PC, ne vous connectez pas, quelqu’un pourrait se faire passer pour lui.", e_otp_late: "le délai pour saisir le code est écoulé — reconnectez-vous", help_sec3: "Pour se connecter sans confirmation, le PC distant demande, en plus du mot de passe, un code à 6 chiffres d’une application d’authentification sur le téléphone (TOTP). Il se configure dans « Cet ordinateur » en décochant « Demander avant chaque connexion entrante ». « Mémoriser le mot de passe » garde le mot de passe sur ce PC ; c’est pourquoi la connexion sans confirmation est protégée par le second facteur.", otp_is_on: "Connexion sans confirmation : mot de passe + code de l’application d’authentification (TOTP)", otp_warn: "La connexion sans confirmation est désactivée tant qu’un second facteur (TOTP) n’est pas configuré : chaque connexion demande Autoriser / Refuser.", otp_setup: "Configurer", otp_h: "Second facteur (TOTP)", otp_scan: "Pour se connecter sans confirmation, un code d’une application d’authentification sera demandé après le mot de passe. Scannez le QR code avec l’application (Google Authenticator, Microsoft Authenticator, Aegis…) ou saisissez la clé à la main, puis le code à 6 chiffres qu’elle affiche.", otp_key: "Clé :", otp_code_p: "Code à 6 chiffres", otp_on: "Activer", otp_cancel: "Annuler", otp_bad: "Code incorrect. Vérifiez que l’heure du téléphone est juste et réessayez", remember_l: "Mémoriser le mot de passe", otp_ask: "Saisissez le code à 6 chiffres de l’application d’authentification pour ce PC", otp_send: "Se connecter", otp_check: "vérification du code…", ask_nootp: "le second facteur (TOTP) n’est pas configuré sur le PC distant, la personne qui s’y trouve doit donc autoriser la connexion", help_site: "Téléchargements, actualités et réponses : [www.anypc.org](https://www.anypc.org)", tour_next: "Suivant", tour_skip: "Passer", tour_done: "Terminé", tour_of: "{n} sur {m}", tour_id: "Voici l’ID de ce PC. Donnez-le, avec le code à usage unique (ou le mot de passe si l’on ne demande pas), à la personne qui va se connecter à vous.", tour_pw: "Le mot de passe fixe de ce PC : pour se connecter sans demande (un code TOTP est aussi nécessaire).", tour_go: "Pour vous connecter à un autre PC, saisissez son ID et son mot de passe, puis cliquez sur « Se connecter ».", tour_opts: "« Turbo » rend le texte plus net et économise du trafic. « Affichage seul » montre l’écran distant sans le contrôler.", tour_help: "Un oubli ? Le bouton « ? » ouvre l’aide.", tour_bye: "« Déconnecter » met fin à la session immédiatement.", tour_fs: "En plein écran, cette barre se cache. Amenez la souris en haut de l’écran pour la faire revenir.", tour_files: "Envoyez et récupérez des fichiers ici. Les fichiers reçus vont dans Téléchargements ; le bouton des transferts montre la progression.",
    node_l: "Serveur personnel", node_t: "Votre propre nœud AnyPC (install.sh sur votre VPS). Vide : serveurs AnyPC. Connexion ponctuelle via un autre nœud : ID@nœud dans le champ ID.", node_p: "my.example.com — vide : serveurs AnyPC", node_save: "Enregistrer", nodepub_l: "rester aussi sur le réseau AnyPC", node_chk: "Vérification du nœud…", node_ok: "Enregistré — ce PC est maintenant inscrit sur : ", node_bad: "Non enregistré : ", id_node: "Adresse de nœud invalide après @", upd: "Version %s disponible — mettre à jour", ff_dl: "Téléchargement du composant FFmpeg (une seule fois) :", ff_err: "Impossible de télécharger FFmpeg — vérifiez la connexion Internet ; nouvel essai toutes les 30 s", turn_l: "Serveur relais", turn_t: "Utilisé seulement si la connexion directe est impossible. Ping : depuis ce PC + depuis le PC distant (connu après la connexion).", auto: "Auto", ms: "ms",

 "Disattiva TOTP", u_del: "Elimina", u_del_q: "Eliminare l’utente «%s»?", help_sec4: "In «Utenti» sul PC remoto ognuno può avere il proprio nome, password e permessi (controllo completo o solo visualizzazione); alla connessione scrive il nome in «Nome» e il PC remoto lo mostra sull’avviso di sessione. Senza nome si usa la password del PC stesso.", help_b: "Guida", help_h: "Come funziona AnyPC", help_x: "Chiudi", help_tour: "Mostra di nuovo i suggerimenti", help_about_h: "Che cos’è AnyPC", help_about: "AnyPC mostra lo schermo di un altro computer e ti permette di usarlo con il tuo mouse e la tua tastiera, come se ci fossi davanti. La connessione è cifrata. L’immagine viaggia direttamente tra i due PC quando è possibile, altrimenti tramite un server relay.", help_conn_h: "Connettersi a un altro PC", help_conn: "Chiedi a chi sta al PC remoto il suo ID (9 cifre) e la password. Inseriscili in «Computer remoto» e premi «Connetti».", help_conn2: "Se il PC remoto chiede una conferma, aspetta che qualcuno risponda dall’altra parte. Gli ID già usati compaiono in «Recenti»: un clic inserisce l’ID.", help_host_h: "Permettere le connessioni a questo PC", help_host: "Senza password nessuno può connettersi a questo PC. Impostane una di almeno 8 caratteri in «Questo computer» e dalla, insieme al tuo ID, solo a persone di fiducia.", help_host2: "Con «Chiedi prima di ogni connessione in arrivo» attivo, ogni tentativo apre una finestra con tre risposte. «Consenti» dà il controllo, «Solo visualizzazione» mostra lo schermo senza controllo, «Rifiuta» respinge. Senza risposta entro 30 secondi la connessione viene rifiutata.", help_turbo_h: "Turbo (VP9)", help_turbo: "Turbo invia il video in VP9 invece che in H.264: il testo è più nitido e si consuma meno traffico. Se il PC remoto non supporta VP9, AnyPC usa semplicemente H.264.", help_view_h: "Solo visualizzazione", help_view: "Vedi lo schermo remoto, ma mouse, tastiera, appunti e file non vengono inviati. Comodo quando basta guardare. Anche chi sta al PC remoto può scegliere questa modalità nella finestra «Consenti». Il PC remoto può anche attivare «Mostra solo lo schermo» in «Questo computer»: allora ogni connessione in arrivo è solo visualizzazione.", viewonly_l: "Mostra solo lo schermo", viewonly_t: "Ogni connessione in arrivo è solo visualizzazione: mouse, tastiera, appunti e file dall’altra parte non vengono accettati. Anche «Consenti» dà solo visualizzazione", help_audio_h: "Audio (microfoni)", help_audio: "Ognuno attiva e disattiva il proprio microfono con il pulsante 🎤: chi controlla, nella barra della sessione; chi sta al PC remoto, nella finestra di AnyPC su quel PC. Entrambi sono disattivati per impostazione predefinita; la prima volta il browser chiede l’accesso al microfono. Finché il microfono del PC remoto è attivo, il suo avviso mostra 🎤. Per l’audio sul PC remoto deve essere aperta la finestra di AnyPC; se non senti nulla, fai clic su «🔈 Fai clic per sentire il PC remoto». Le cuffie evitano l’eco. «Solo visualizzazione» non disattiva l’audio.", help_files_h: "File", help_files: "«Invia file» copia un file da questo PC a quello remoto; puoi anche trascinarlo sullo schermo remoto. «Ricevi file» apre una finestra di scelta file sul PC remoto per prelevare un file da lì.", help_files2: "I file vengono salvati nella cartella Download del PC che li riceve. Il pulsante dei trasferimenti sulla barra della sessione mostra l’avanzamento e l’elenco dei file. Se un trasferimento si interrompe, invia di nuovo il file: riprenderà da dove si era fermato.", help_clip_h: "Appunti", help_clip: "Il testo copiato sul PC remoto arriva negli appunti di questo PC. Nel programma AnyPC ciò che copi qui passa di là da solo; nel browser premi Ctrl+V nella finestra della sessione o usa «Invia appunti».", help_keys_h: "Tasti speciali", help_keys: "Alcune combinazioni vengono intercettate da questo PC e non arrivano mai a quello remoto. Per queste ci sono i pulsanti sulla barra della sessione: «Win» apre il menu Start, «Alt+Tab» cambia finestra, «Ctrl+Shift+Esc» apre Gestione attività.", help_sec_h: "Sicurezza", help_sec: "Durante una sessione il PC remoto mostra sempre un avviso che è controllato a distanza. Il suo pulsante «Disconnetti» chiude subito la sessione: chi è lì può fermarti in qualsiasi momento.", help_sec2: "Ogni PC ha una propria chiave; la sua impronta è sotto l’ID. AnyPC ricorda la chiave di ogni PC a cui ti connetti. Se la chiave cambia, compare un avviso: se AnyPC non è stato reinstallato su quel PC, non connetterti, qualcuno potrebbe spacciarsi per lui.", e_otp_late: "il tempo per inserire il codice è scaduto: riconnettiti", help_sec3: "Per connettersi senza conferma, il PC remoto chiede, oltre alla password, un codice a 6 cifre di un’app di autenticazione sul telefono (TOTP). Si configura in «Questo computer» togliendo «Chiedi prima di ogni connessione in arrivo». «Ricorda password» conserva la password su questo PC: per questo la connessione senza conferma è protetta dal secondo fattore.", otp_is_on: "Connessione senza conferma: password + codice dell’app di autenticazione (TOTP)", otp_warn: "La connessione senza conferma è disattivata finché non si configura un secondo fattore (TOTP): ogni connessione chiede Consenti / Rifiuta.", otp_setup: "Configura", otp_h: "Secondo fattore (TOTP)", otp_scan: "Per connettersi senza conferma servirà, dopo la password, un codice di un’app di autenticazione. Scansiona il codice QR con l’app (Google Authenticator, Microsoft Authenticator, Aegis…) o inserisci la chiave a mano, poi digita il codice a 6 cifre che mostra.", otp_key: "Chiave:", otp_code_p: "Codice a 6 cifre", otp_on: "Attiva", otp_cancel: "Annulla", otp_bad: "Codice errato. Controlla che l’ora del telefono sia giusta e riprova", remember_l: "Ricorda password", otp_ask: "Inserisci il codice a 6 cifre dell’app di autenticazione per questo PC", otp_send: "Accedi", otp_check: "verifica del codice…", ask_nootp: "sul PC remoto non è configurato il secondo fatto   $('myff').textContent = !s.ffmpeg ? '' : s.ffmpeg === 'err' ? t('ff_err') : t('ff_dl') + ' ' + s.ffmpeg + ' %'; // Windows: первый запуск
  $('mystate').style.color = s.online ? 'var(--ok)' : 'var(--acc)';

  $('incoming').classList.toggle('hidden', !s.session);
  $('incid').textContent = s.session || '';

  $('codebox').classList.toggle('hidden', !asks); $('mycode').textContent = (s.code || '').replace(/(\d{3})(?=\d)/, '$1 ');
  $('pwrow').classList.toggle('hidden', asks); $('pwstate').classList.toggle('hidden', asks);
  $('confirm').checked = asks;

  // записи по имени — рядом с паролем и TOTP, только при входе без подтверждения (раскладка окна по галочке, владелец)
  $('users').classList.toggle('hidden', asks || !s.hasPass); renderUsers(s.users);

};

        ch.send(JSON.stringify({ t: 'done', sha256: sum })); ui.finish('✓ ' + t('f_done_down'));
      } catch (err) { ch.send(JSON.stringify({ t: 'err', msg: String(err) })); ui.finish('✗ ' + t('f_err')); }
      setTimeout(() => ch.close(), 1000);
    }
  };
  ch.onclose = async () => {
    if (finished) return;
    ui?.finish('✗ ' + t(cancelled ? 'f_cancel' : 'f_broken'));
    if (APP && h !== null) { // обрыв: дописать принятое и оставить часть для докачки; отмена — удалить
      const hh = h; h = null;
      await flush().catch(() => {});
      fileAbort(hh, !cancelled);
    }
  };
}
$('fsend').onclick = () => $('fpick').click();

// ---------- Картинка: «качество» (чёткость; на слабом канале меньше к/с) / «скорость» (к/с; на канале < 2 Мбит/с — 720p).
// По проводу — p: "text" | "video" (имена первой редакции, хосты v0.1.13 их уже понимают) ----------

  const r = v.getBoundingClientRect(), vw = v.videoWidth, vh = v.videoHeight, s = Math.min(r.width / vw, r.height / vh);
  if (!vw || m.c === 'none') return $('cur').classList.add('hidden');

// ---------- Полный экран ----------
let full = false; // имена fs/process/path/crypto не занимать ни переменными, ни id: их берёт wasm_exec.js
async function setFs(on) {

// ---------- Ввод (ТЗ §7, канал input) ----------
function pos(e) { // координаты внутри картинки (object-fit: contain) → 0..65535
  const r = v.getBoundingClientRect(), vw = v.videoWidth, vh = v.videoHeight;
  if (!vw) return null;
  const s = Math.min(r.width / vw, r.height / vh);
  const x = (e.clientX - r.left - (r.width - vw * s) / 2) / (vw * s), y = (e.clientY - r.top - (r.height - vh * s) / 2) / (vh * s);
  return x < 0 || x > 1 || y < 0 || y > 1 ? null : { x: Math.round(x * 65535), y: Math.round(y * 65535) };
}
v.onpointermove = e => { const p = pos(e); p && sendIn({ t: 'm', ...p }); };
v.onpointerdown = e => {
  const p = pos(e); if (!p || e.button > 2) return;

  sendIn({ t: 'm', ...p }); sendIn({ t: 'b', b: e.button, d: true });
};

v.addEventListener('wheel', e => {
  e.preventDefault();
  const k = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? 400 : 1.2; // строки/страницы/пиксели → единицы WHEEL_DELTA (120)
  if (e.deltaY) sendIn({ t: 'w', v: Math.round(-e.deltaY * k) });
  if (e.deltaX) sendIn({ t: 'h', v: Math.round(e.deltaX * k) });
}, { passive: false });

const capturing = () => dc && !$('sess').classList.contains('hidden') && document.activeElement?.tagName !== 'INPUT';
// syncMods — модификатор, зажатый на удалённом ПК, а здесь уже отпущенный, — отпустить и там. Отпускание Super/Alt
// забирает себе система (Super+Space — раскладка в GNOME): Win «залипал» на хосте, и Ctrl+V там становился Win+V.
const MODS = { MetaLeft: 'metaKey', MetaRight: 'metaKey', ControlLeft: 'ctrlKey', ControlRight: 'ctrlKey',
               AltLeft: 'altKey', AltRight: 'altKey', ShiftLeft: 'shiftKey', ShiftRight: 'shiftKey' };
function syncMods(e) {
  if (pasting) return;
  for (const c in MODS) if (held.has(c) && !e[MODS[c]] && e.code !== c) { held.delete(c); sendIn({ t: 'k', c, d: false }); }
}
document.addEventListener('keydown', e => {
  if (!capturing() || e.repeat && pasting) return;
  syncMods(e);
  if (e.ctrlKey && e.altKey && e.code === 'Enter') { e.preventDefault(); releaseAll(); setFs(!full); return; } // своё: полный экран — Esc уходит на удалённый ПК
  if (isPaste(e) && !pasting) { // без preventDefault: браузер вставит в pasteBox → событие paste
    held.add(e.code); pasteBox.value = ''; pasteBox.focus();
    pasting = { timer: setTimeout(() => pasteNow(''), 300), ups: [] }; // paste не пришло (нет текста) — V как есть
    return;
  }
  e.preventDefault(); held.add(e.code); sendIn({ t: 'k', c: e.code, d: true });
});
document.addEventListener('keyup', e => {
  if (!capturing()) return;
  syncMods(e);
  e.preventDefault(); held.delete(e.code);
  if (pasting) { pasting.ups.push(e.code); return; } // отпускания — после отложенного нажатия V
  sendIn({ t: 'k', c: e.code, d: false });
});
function releaseAll() { held.forEach(c => sendIn({ t: 'k', c, d: false })); held.clear(); }
window.addEventListener('blur', releaseAll); // переключились в другое окно — не оставить зажатый Alt на удалённом ПК
document.querySelectorAll('[data-keys]').forEach(b => b.onclick = () => {
  const k = b.dataset.keys.split(' ');
  k.forEach(c => sendIn({ t: 'k', c, d: true })); [...k].reverse().forEach(c => sendIn({ t: 'k', c, d: false }));
  v.focus();
});

// ---------- Статистика: 1 замер/с, копится до «Сброс» ----------
// ponytail: только в памяти окна — закрыл, потерял; выгружай CSV.
const KEYS = ['t', 'path', 'rtt', 'fps', 'kbps', 'lost', 'rx', 'jb', 'frz'];
const sum = a => a.reduce((x, y) => x + y, 0);
const pct = (a, p) => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(p / 100 * s.length))]; };
$('reset').onclick = () => { samples = []; $('sum').textContent = ''; };
$('csv').onclick = () => {
  const csv = [KEYS.join(','), ...samples.map(s => KEYS.map(k => s[k]).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `anypc-stats-${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.csv`;
  a.click();
};
function summary() {
  const c = k => samples.map(s => s[k]), n = samples.length;
  if (!n) return '';
  const lost = sum(c('lost')), rx = sum(c('rx'));
  const md = t('med'), ms = t('ms');
  return `${t('s_for').replace('{n}', n)}: RTT ${md} ${pct(c('rtt'), 50)} / P95 ${pct(c('rtt'), 95)} / ${t('max')} ${pct(c('rtt'), 100)} ${ms} · ` +
    `${t('fps')} ${md} ${pct(c('fps'), 50)} / P5 ${pct(c('fps'), 5)} · ${t('kbps')} ${md} ${pct(c('kbps'), 50)} · ` +
    `${t('loss')} ${(lost / Math.max(1, lost + rx) * 100).toFixed(2)} % · ${t('jb')} ${md} ${pct(c('jb'), 50)} / P95 ${pct(c('jb'), 95)} ${ms} · ` +
    `${t('frz')} ${sum(c('frz'))} · TURN ${Math.round(c('path').filter(p => p === 'TURN').length / n * 100)} %`;
}
async function stats() { // REQ-F-17
  if (!pc) return;
  const r = await pc.getStats();
  let pair, inb;
  r.forEach(s => {
    if (s.type === 'transport' && s.selectedCandidatePairId) pair = r.get(s.selectedCandidatePairId);
    if (s.type === 'inbound-rtp' && s.kind === 'video') inb = s;
  });
  if (!pair || !inb) return;
  const loc = r.get(pair.localCandidateId)?.candidateType, rem = r.get(pair.remoteCandidateId)?.candidateType;
  const path = loc === 'relay' || rem === 'relay' ? 'TURN' : 'P2P';
  const codec = (r.get(inb.codecId)?.mimeType || '').replace('video/', '').replace('H264', 'H.264'); // VP9 («Турбо») или H.264
  const rtt = Math.round((pair.currentRoundTripTime || 0) * 1000), fps = inb.framesPerSecond || 0;
  const now = { b: inb.bytesReceived, t: inb.timestamp, rx: inb.packetsReceived, lost: inb.packetsLost,
                jbd: inb.jitterBufferDelay || 0, jbn: inb.jitterBufferEmittedCount || 0, frz: inb.freezeCount || 0 };
  let kbps = 0;
  if (last) {
    kbps = Math.round((now.b - last.b) * 8 / (now.t - last.t));
    samples.push({ t: new Date().toISOString(), path, rtt, fps, kbps, lost: now.lost - last.lost, rx: now.rx - last.rx,
      jb: now.jbn > last.jbn ? Math.round((now.jbd - last.jbd) / (now.jbn - last.jbn) * 1000) : 0, frz: now.frz - last.frz });
    $('sum').textContent = summary();
  }
  last = now;
  $('st').textContent = `${host} · ${path} (${loc}/${rem}) · ${codec} · RTT ${rtt} ${t('ms')} · ${fps} ${t('fps')} · ${kbps} ${t('kbps')} · ${inb.frameWidth || 0}×${inb.frameHeight || 0}` + (document.body.classList.contains('view') ? ' · ' + t('view_s') : '');
}

// ---------- Справка (кнопка «?») ----------
const HELP = [['help_about_h', 'help_about'], ['help_conn_h', 'help_conn', 'help_conn2'], ['help_host_h', 'help_host', 'help_code', 'help_host2'],
  ['help_turbo_h', 'help_turbo'], ['help_view_h', 'help_view', 'help_view2'], ['help_audio_h', 'help_audio'], ['help_files_h', 'help_files', 'help_files2'], ['help_clip_h', 'help_clip'],
  ['help_keys_h', 'help_keys'], ['help_sec_h', 'help_sec', 'help_sec2', 'help_sec3', 'help_sec4']];
function rich(el, s) { // «[текст](https://…)» → ссылка; без innerHTML
  let i = 0;
  for (const m of s.matchAll(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g)) {
    const a = Object.assign(document.createElement('a'), { href: m[2], target: '_blank', rel: 'noopener', textContent: m[1] });
    a.onclick = e => { if (window.openSite) { e.preventDefault(); openSite(); } }; // Windows: главная сайта — в системном браузере (адрес фиксирован в программе)
    el.append(s.slice(i, m.index), a); i = m.index + m[0].length;
  }
  el.append(s.slice(i)); return el;
}
const mkEl = (tag, txt) => rich(document.createElement(tag), txt);
const helpOpen = () => !$('help').classList.contains('hidden');
let eatEsc = false; // keyup от Esc, закрывшего справку, не отправлять на удалённый ПК
function openHelp() {
  if (!$('helpbody').childElementCount) {
    const again = Object.assign(document.createElement('button'), { textContent: t('help_tour') });
    again.onclick = () => { for (const k of ['home', 'sess']) { toured[k] = 0; store.set('tour_' + k, 0); }
      closeHelp(); startTour($('sess').classList.contains('hidden') ? 'home' : 'sess', true); };
    const row = document.createElement('div'); row.className = 'row'; row.append(again);
    $('helpbody').append(...HELP.flatMap(([h, ...p]) => [mkEl('h3', t(h)), ...p.map(k => mkEl('p', t(k)))]), mkEl('p', t('help_site')), row);
    $('helpx').setAttribute('aria-label', t('help_x'));
  }
  tourEnd(); $('help').classList.remove('hidden'); $('helpbody').parentElement.scrollTop = 0; $('helpx').focus();
}
function closeHelp() { $('help').classList.add('hidden'); if (!$('sess').classList.contains('hidden')) v.focus(); }
$('helpbtn').onclick = $('help2').onclick = openHelp;
$('helpx').onclick = closeHelp;
$('help').onclick = e => { if (e.target === $('help')) closeHelp(); };
// Справка поверх сессии: клавиши не уходят на удалённый ПК (перехват раньше обработчика на document)
window.addEventListener('keydown', e => {
  if (helpOpen()) { e.stopImmediatePropagation(); if (e.key === 'Escape') { e.preventDefault(); eatEsc = true; closeHelp(); } return; }
  if (tour && e.key === 'Escape' && !capturing()) tourEnd();
}, true);
window.addEventListener('keyup', e => { if (helpOpen() || eatEsc && e.key === 'Escape') { e.stopImmediatePropagation(); eatEsc = false; } }, true);

// ---------- Тур для новичка: выноски у элементов, один раз (флаг tour_home / tour_sess в localStorage) ----------
// Выноска не перехватывает клики по странице (#tour — pointer-events: none, кроме самой выноски).
var tour = null; // var — show() может прийти раньше этой строки
const toured = {}; // показан в этой загрузке страницы — на случай недоступного localStorage
const TOURS = {
  home: [[['myid'], 'tour_id'], [['codebox'], 'tour_code'], [['newpw', 'setpw'], 'tour_pw'], [['id', 'pw', 'go'], 'tour_go'], [['turbo', 'view'], 'tour_opts'], [['helpbtn'], 'tour_talk'], [['helpbtn'], 'tour_help']],
  sess: [[['bye'], 'tour_bye'], [['fsbtn'], 'tour_fs'], [['mic'], 'tour_mic'], [['fsend', 'fget', 'dl'], 'tour_files']], // 🎤 скрыта — шаг пропускается (старый хост без звука)
};
const tbox = id => { const e = $(id); return e?.closest('label') || e; }; // галочка — вместе с подписью
const seen = e => !!e && e.getClientRects().length > 0;
const tEls = s => s[0].map(tbox).filter(seen);
const tRect = e => { // по содержимому: блок с ID и подпись галочки растянуты на всю ширину карточки
  if (/^(INPUT|BUTTON|SELECT)$/.test(e.tagName)) return e.getBoundingClientRect();
  const g = document.createRange(); g.selectNodeContents(e); return g.getBoundingClientRect();
};
function startTour(kind, force) {
  if (!force && (toured[kind] || store.get('tour_' + kind, 0))) return;
  const steps = TOURS[kind].filter(s => tEls(s).length);
  if (!steps.length || helpOpen()) return;
  toured[kind] = 1; store.set('tour_' + kind, 1);
  tour = { kind, steps, i: 0 }; tourStep();
}
function tourStep() {
  const { steps, i } = tour, els = tEls(steps[i]);
  if (!els.length) return tourGo();
  const last = i === steps.length - 1;
  $('tiptxt').textContent = t(steps[i][1]);
  $('tipn').textContent = t('tour_of').replace('{n}', i + 1).replace('{m}', steps.length);
  $('tipnext').textContent = t(last ? 'tour_done' : 'tour_next');
  $('tipskip').classList.toggle('hidden', last);
  els.at(-1).scrollIntoView({ block: 'nearest' }); els[0].scrollIntoView({ block: 'nearest' }); // вся группа в окне, начало — обязательно
  tour.els = els; $('tour').classList.remove('hidden'); tourPlace();
}
function tourGo() { if (++tour.i >= tour.steps.length) tourEnd(); else tourStep(); }
function tourEnd() { tour = null; $('tour').classList.add('hidden'); }
function tourPlace() {
  if (!tour) return;
  const els = tour.els.filter(seen);
  if (!els.length) return tourEnd();
  const rs = els.map(tRect), W = innerWidth, H = innerHeight, p = 4;
  const r = { l: Math.min(...rs.map(x => x.left)) - p, t: Math.min(...rs.map(x => x.top)) - p, r: Math.max(...rs.map(x => x.right)) + p, b: Math.max(...rs.map(x => x.bottom)) + p };
  Object.assign($('tring').style, { left: r.l + 'px', top: r.t + 'px', width: r.r - r.l + 'px', height: r.b - r.t + 'px' });
  const tip = $('tip'), w = Math.min(320, W - 16);
  tip.style.width = w + 'px';
  const h = tip.offsetHeight, below = r.b + 12 + h <= H - 8 || r.t - 12 - h < 8;
  const cx = (Math.max(r.l, 0) + Math.min(r.r, W)) / 2, left = Math.max(8, Math.min(cx - w / 2, W - w - 8));
  tip.dataset.side = below ? 'b' : 't';
  tip.style.left = left + 'px';
  tip.style.top = Math.max(8, Math.min(below ? r.b + 12 : r.t - 12 - h, H - h - 8)) + 'px';
  tip.style.setProperty('--ax', Math.max(18, Math.min(cx - left, w - 18)) + 'px');
}
$('tipnext').onclick = tourGo;
$('tipskip').onclick = tourEnd;
addEventListener('resize', tourPlace);
addEventListener('scroll', tourPlace, true);
function tourOnShow(sess) { // смена экрана: тур другого экрана закрыть; первая сессия — свой короткий тур
  if (tour && tour.kind !== (sess ? 'sess' : 'home')) tourEnd();
  if (sess) setTimeout(() => !$('sess').classList.contains('hidden') && startTour('sess'), 800);
}
setTimeout(() => !$('home').classList.contains('hidden') && startTour('home'), 1000); // в программе — после первого hostInfo (ID уже на месте)
