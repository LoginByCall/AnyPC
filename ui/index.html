<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnyPC</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'><style>.a{stroke:%2317181c}.b{fill:%23d2452d}@media(prefers-color-scheme:dark){.a{stroke:%23eceae4}.b{fill:%23ef6a52}}</style><rect class='a' x='1.5' y='3' width='15' height='11' rx='2' fill='none' stroke-width='2.6'/><rect class='b' x='10' y='12' width='15' height='11' rx='2'/></svg>">
<style>
  :root { --bg: #f6f6f4; --card: #fff; --fg: #1a1a1a; --mut: #6b6b6b; --line: #ddd; --acc: #c0392b; --ok: #2e7d32; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161616; --card: #202020; --fg: #eee; --mut: #9a9a9a; --line: #333; --acc: #e57368; --ok: #81c784; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  button, input { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); }
  button { cursor: pointer; } button.main { background: var(--acc); color: #fff; border-color: var(--acc); }
  .hidden { display: none !important; }
  body.view [data-keys], body.view #fsend, body.view #fget, body.view #clipbtn { display: none !important; } /* только просмотр: хост это всё равно отбросит */
  .mut { color: var(--mut); } .mono { font-family: ui-monospace, monospace; }
  #home { display: flex; gap: 16px; padding: 16px; flex-wrap: wrap; align-items: flex-start; overflow: auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; flex: 1 1 320px; display: flex; flex-direction: column; gap: 10px; }
  .card h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .big { font-size: 28px; letter-spacing: 2px; font-family: ui-monospace, monospace; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .banner { border: 1px solid var(--acc); border-radius: 8px; padding: 10px; }
  #recent button { font-family: ui-monospace, monospace; }
  #msg { color: var(--acc); min-height: 1.2em; }
  #sess { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #bar { display: flex; gap: 6px; padding: 6px 8px; flex-wrap: wrap; align-items: center; background: var(--card); border-bottom: 1px solid var(--line); }
  #bar button { padding: 4px 8px; }
  video { flex: 1; min-height: 0; width: 100%; background: #000; object-fit: contain; outline: none; }
  #cur { position: fixed; pointer-events: none; z-index: 5; }
  .seg { display: inline-flex; } .seg button { border-radius: 0; } .seg button:first-child { border-radius: 6px 0 0 6px; } .seg button:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
  .seg button[aria-pressed="true"] { background: var(--acc); color: #fff; border-color: var(--acc); }
  body.fs #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 2; transform: translateY(calc(-100% + 4px)); transition: transform .15s; opacity: .95; }
  body.fs #bar:hover { transform: none; }
</style>

<section id="home">
  <div class="card" id="me">
    <h2 data-t="me_h"></h2>
    <div><span class="mut" data-t="myid_l"></span><div class="big" id="myid">—</div>
      <div class="mut mono" style="font-size:12px"><span data-t="fp_l"></span> <span id="myfp"></span></div></div>
    <div id="mystate" class="mut">—</div>
    <div id="myff" class="mut"></div>
    <div id="myver" class="mut mono" style="font-size:12px"></div>
    <a id="upd" class="hidden" href="https://www.anypc.org/#get" target="_blank" rel="noopener"></a>
    <div class="row">
      <input id="newpw" type="password" data-tp="newpw_p" autocomplete="new-password">
      <button id="setpw" data-t="setpw"></button>
    </div>
    <div id="pwstate" class="mut"></div>
    <label class="mut"><input id="confirm" type="checkbox"> <span data-t="confirm_l"></span></label>
    <div class="row"><span class="mut" data-t="node_l" data-tt="node_t"></span> <input id="node" data-tp="node_p"> <button id="setnode" data-t="node_save"></button></div>
    <label class="mut"><input id="nodepub" type="checkbox"> <span data-t="nodepub_l"></span></label>
    <div id="nodestate" class="mut"></div>
    <div id="incoming" class="banner hidden">
      <span data-t="incoming"></span> <span class="mono" id="incid"></span>
      <button id="hostbye" class="main" data-t="disc"></button>
    </div>
    <div class="row"><button id="quit" class="hidden" data-t="quit"></button></div>
  </div>

  <div class="card">
    <h2 data-t="remote_h"></h2>
    <input id="id" data-tp="id_p" inputmode="numeric">
    <input id="pw" type="password" data-tp="pw_p">
    <label class="mut"><input id="relay" type="checkbox"> <span data-t="relay"></span></label>
    <label class="mut" data-tt="turbo_t"><input id="turbo" type="checkbox" checked> <span data-t="turbo_l"></span></label>
    <label class="mut" data-tt="view_t"><input id="view" type="checkbox"> <span data-t="view_l"></span></label>
    <label class="mut hidden" id="turnbox" data-tt="turn_t"><span data-t="turn_l"></span> <select id="turn"></select></label>
    <div class="row"><button id="go" class="main" data-t="go"></button></div>
    <div id="msg"></div>
    <div class="row"><button id="trust" class="hidden" data-t="trust"></button></div>
    <div id="recentbox" class="hidden"><span class="mut" data-t="recent"></span> <span id="recent" class="row"></span></div>
  </div>
</section>

<section id="sess" class="hidden">
  <div id="bar">
    <button id="bye" class="main" data-t="disc"></button>
    <button id="fsbtn" data-t="fs"></button>
    <button id="minbtn" data-t="min" class="hidden"></button>
    <select id="mon" class="hidden" data-tt="mon_t"></select>
    <span id="qsel" class="seg hidden" data-tt="q_t"><button data-q="0" data-t="q_quality"></button><button data-q="1" data-t="q_speed"></button></span>
    <select id="turn2" class="hidden" data-tt="turn_t"></select>
    <button id="clipbtn" class="hidden" data-t="clip_b" data-tt="clip_t"></button>
    <button data-keys="MetaLeft">Win</button>
    <button data-keys="AltLeft Tab">Alt+Tab</button>
    <button data-keys="ControlLeft ShiftLeft Escape">Ctrl+Shift+Esc</button>
    <button data-keys="MetaLeft Space" title="Win+Space" data-t="layout"></button>
    <button id="fsend" data-t="f_send" data-tt="f_send_t"></button>
    <button id="fget" data-t="f_get" data-tt="f_get_t"></button>
    <input id="fpick" type="file" multiple hidden>
    <button id="csv" data-tt="csv_t">CSV</button>
    <button id="reset" data-tt="reset_t" data-t="reset"></button>
    <span id="st" class="mut mono">—</span>
    <span id="xfers" class="row mono"></span>
    <div id="sum" class="mut mono" style="flex-basis:100%"></div>
  </div>
  <video id="v" autoplay playsinline muted tabindex="0"></video>
  <svg id="cur" class="hidden" width="16" height="24" viewBox="0 0 16 24"><path d="M1 1v19l5-5 3 7 3-1-3-7h7z" fill="#fff" stroke="#000" stroke-width="1.5"/></svg>
</section>

const APP = typeof window.hostInfo === 'function'; // открыто в AnyPC.exe

const lang = [...(navigator.languages || [navigator.language]), 'en'].map(c => (c || '').slice(0, 2).toLowerCase()).find(k => L[k]);
const t = k => L[lang][k] ?? L.en[k] ?? k;
document.documentElement.lang = lang;
document.querySelectorAll('[data-t]').forEach(e => e.textContent = t(e.dataset.t));
document.querySelectorAll('[data-tp]').forEach(e => e.placeholder = t(e.dataset.tp));
document.querySelectorAll('[data-tt]').forEach(e => e.title = t(e.dataset.tt));
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// ---------- Это рабочее место (только в AnyPC.exe) ----------
window.onHostState = s => {
  $('myid').textContent = s.id.replace(/(\d{3})(?=\d)/g, '$1 ');
  $('myfp').textContent = s.fp || '';
  $('mystate').textContent = t(s.online ? 'online' : 'offline');
  $('myver').textContent = s.version ? 'AnyPC ' + s.version : '';
  $('upd').textContent = s.update ? t('upd').replace('%s', s.update) : ''; $('upd').classList.toggle('hidden', !s.update);
  $('myff').textContent = !s.ffmpeg ? '' : s.ffmpeg === 'err' ? t('ff_err') : t('ff_dl') + ' ' + s.ffmpeg + ' %'; // Windows: первый запуск
  $('mystate').style.color = s.online ? 'var(--ok)' : 'var(--acc)';
  $('pwstate').textContent = t(s.hasPass ? 'pw_set' : 'pw_none');
  $('incoming').classList.toggle('hidden', !s.session);
  $('incid').textContent = s.session || '';
  $('confirm').checked = s.confirm !== false;
  if (!nodeShown) { nodeShown = true; $('node').value = s.node || ''; $('nodepub').checked = s.nodePub !== false; } // опрос раз в 1 с не затирает ввод
};
let nodeShown = false;
$('setnode').onclick = async () => {
  $('nodestate').textContent = t('node_chk');
  try {
    HUBS.splice(0, HUBS.length, ...(await setNode($('node').value, $('nodepub').checked)).split(','));
    nodeShown = false; onHostState(await hostInfo());
    $('nodestate').textContent = t('node_ok') + HUBS.map(u => u.replace(/^wss?:\/\//, '').replace(/\/ws$/, '')).join(', ');
  } catch (e) { $('nodestate').textContent = t('node_bad') + e; }
};
if (APP) { hostInfo().then(onHostState); setInterval(() => hostInfo().then(onHostState).catch(() => {}), 1000); } // опрос: прогресс FFmpeg, новая версия
else $('me').classList.add('hidden');
$('upd').onclick = e => { if (window.openUpdate) { e.preventDefault(); openUpdate(); } }; // Windows: в системный браузер; Linux — окно и так в браузере
$('setpw').onclick = async () => {
  if ([...$('newpw').value].length < 8) { $('pwstate').textContent = t('pw_short'); return; }
  try { await setPassword($('newpw').value); $('newpw').value = ''; onHostState(await hostInfo()); }
  catch (e) { $('pwstate').textContent = t('err') + e; }
};
$('hostbye').onclick = () => hostDisconnect();
$('confirm').onchange = e => setConfirm(e.target.checked).catch(err => { $('pwstate').textContent = t('err') + err; });
if (typeof window.quit === 'function') { $('quit').classList.remove('hidden'); $('quit').onclick = () => { quit(); document.body.textContent = t('bye_app'); }; }

// ---------- Недавние ----------
function renderRecent() {
  const r = store.get('recent', []);
  $('recentbox').classList.toggle('hidden', !r.length);
  $('recent').replaceChildren(...r.map(id => {
    const b = document.createElement('button'); b.textContent = id;
    b.onclick = () => { $('id').value = id; $('pw').focus(); }; return b;
  }));
}
renderRecent();

let ws, pc, dc, ctl, host, target, timer, last, samples = [], lastClip = '', socks = [], cur = null; // ws — хаб-победитель, socks — все попытки
const held = new Set();
const v = $('v');
const show = sess => { $('home').classList.toggle('hidden', sess); $('sess').classList.toggle('hidden', !sess); };
const sig = (type, data) => ws?.readyState === 1 && ws.send(JSON.stringify({ v: 1, type, to: host, data }));
const sendIn = o => dc?.readyState === 'open' && dc.send(JSON.stringify(o));

// ---------- Выбор TURN: пинг до каждого ретранслятора; «Авто» выбирает хост по сумме плеч «клиент + хост» ----------
let turns = [], rttMe = {}, rttHost = {}, turnCur = '', turnSel = store.get('turn', 'auto');
const region = (() => { try { return new Intl.DisplayNames([lang], { type: 'region' }); } catch { return null; } })();
const turnName = h => { const c = (h.match(/^(?:any-)?([a-z]{2})\./) || [])[1]; return (c && region?.of(c.toUpperCase())?.replace(/\s*\(.*\)$/, '')) || h; }; // страна из имени: hk.anypc.org (и прежние any-hk.…)
// Пинг из браузера — время до srflx-кандидата: один STUN Binding до сервера (ICMP браузеру недоступен).
const stunRtt = h => new Promise(ok => {
  const p = new RTCPeerConnection({ iceServers: [{ urls: 'stun:' + h + ':3478' }] });
  let t0 = 0;
  const done = r => { p.close(); ok(r); };
  setTimeout(() => done(null), 2000);
  p.onicecandidate = e => e.candidate?.type === 'srflx' && done(Math.round(performance.now() - t0));
  p.createDataChannel('x');
  t0 = performance.now();
  p.setLocalDescription().catch(() => done(null));
});
const measureTurns = () => Promise.all(turns.map(async h => {
  let best = null;
  for (let i = 0; i < 3; i++) { const r = await stunRtt(h); if (r != null && (best == null || r < best)) best = r; }
  rttMe[h] = best; renderTurn();
}));
function renderTurn() {
  const ms = v => v == null ? '—' : v + ' ' + t('ms');
  const opt = h => `${turnName(h)} · ${h in rttMe ? ms(rttMe[h]) : '…'}${h in rttHost ? ' + ' + ms(rttHost[h]) : ''}`;
  for (const s of [$('turn'), $('turn2')]) {
    s.replaceChildren(new Option(t('auto') + (turnCur && turnSel === 'auto' ? ' — ' + turnName(turnCur) : ''), 'auto'), ...turns.map(h => new Option(opt(h), h)));
    s.value = turns.includes(turnSel) ? turnSel : 'auto';
  }
  $('turnbox').classList.toggle('hidden', turns.length < 2);
  $('turn2').classList.toggle('hidden', turns.length < 2);
}
for (const s of [$('turn'), $('turn2')]) s.onchange = () => {
  turnSel = s.value; store.set('turn', turnSel); renderTurn();
  if (pc && again) redial(); // в сессии — переподключиться через выбранный сервер (пароль ещё в памяти)
};
(async () => { // список TURN — с первого ответившего хаба
  for (const u of HUBS) try { turns = await (await fetch(httpOf(u) + '/turns')).json(); break; } catch {}
  if (turns.length) { renderTurn(); measureTurns(); setInterval(measureTurns, 120000); }
})();

function end(reason, keep) {
  if (!keep) again = null;
  expect = ''; authed = false; // Д-1: подтверждение входа — только от CPace этой попытки
  if (!socks.length && !pc) return;
  releaseAll();
  clearInterval(timer);
  rttHost = {}; turnCur = ''; if (turns.length) renderTurn();
  if (pc) sig('bye', 'client'); // хост освобождается сразу — повторное «Подключиться» не получит «занят»
  pc?.close(); for (const w of socks) w.close();
  socks = []; cur = null;
  pc = ws = dc = ctl = null;
  $('mon').classList.add('hidden'); $('qsel').classList.add('hidden'); $('cur').classList.add('hidden'); v.style.cursor = '';
  setFs(false);
  v.srcObject = null;
  show(false);
  $('msg').textContent = reason || '';
}

$('go').onclick = async () => {
  end('', !!again);
  // «ID@узел» — подключение через указанный узел, настройки не меняются; хабы — только этот (У10)
  const [hid, nd = ''] = $('id').value.trim().split('@');
  host = hid.replace(/\D/g, '');
  const node = nd.trim().toLowerCase();
  target = node ? host + '@' + node : host;
  const hubs = node ? [HUBS[0].slice(0, HUBS[0].indexOf('//') + 2) + node + '/ws'] : HUBS; // схема — как у своих хабов (wss; ws — только отладка)
  $('trust').classList.add('hidden');
  if (trustNext && trustNext.host !== host) trustNext = null;
  if (again && again.host !== target) again = null;
  if (host.length !== 9) { $('msg').textContent = t('id9'); return; }
  if (node && !/^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+(:\d{1,5})?$/.test(node)) { $('msg').textContent = t('id_node'); return; }
  $('msg').textContent = t('connecting');
  if (!APP && !(await loadPake())) { $('msg').textContent = t('need_app'); return; }
  last = null;
  // Резервная сигнализация: WS ко всем хабам сразу, сессия — через тот, чей offer пришёл первым.
  // Обработчики привязаны к своей попытке (att): закрытие старых ws/pc не должно рвать новую (регрессия «повтор не подключается»).
  const att = cur = {}, errs = [];
  const weak = [t('no_server'), t('err') + (L[lang].e_not_found || 'not_found')]; // «этот хаб не знает хост» — не главная причина
  const lose = msg => { // хаб отказал до offer; конец — только когда отказали все
    errs.push(msg);
    if (!ws && cur === att && errs.length === hubs.length) end(errs.find(e => !weak.includes(e)) || errs[0]);
  };
  for (const u of hubs) {
    const w = new WebSocket(u);
    socks.push(w);
    let ice = [], out = false;
    const fail = msg => { if (!out) { out = true; lose(msg); } };
    w.onmessage = async e => {
      if (cur !== att || (ws && ws !== w)) return;
      const m = JSON.parse(e.data);
      if (m.type === 'hello' && !m.from) { // Д-4: hello — только от самого хаба
        ice = m.data.ice || [];
        w.send(JSON.stringify({ v: 1, type: 'connect', to: host, data: { turn: turnSel, rtt: Object.fromEntries(Object.entries(rttMe).filter(([, v]) => v != null)), cpub: ckeys()[host]?.pub, vp9: $('turbo').checked, view: $('view').checked } }));
        $('msg').textContent = t('waiting');
      }
      else if (m.type === 'error') { const msg = t('err') + (L[lang]['e_' + m.data] || m.data); ws === w ? end(msg) : fail(msg); }
      else if (m.type === 'bye') { if (ws === w) end(t('host_bye')); }
      else if (m.type === 'offer') {
        if (ws) return;
        ws = w; // победитель; остальные хабы больше не нужны
        for (const o of socks) if (o !== w) o.close();
        if (m.data.turn) { turnCur = m.data.turn; ice = ice.filter(s => [].concat(s.urls).every(u => u.split(':')[1] === turnCur)); }
        rttHost = m.data.rtt || {}; renderTurn();
      const mine = pc = new RTCPeerConnection({ iceServers: ice, iceTransportPolicy: $('relay').checked ? 'relay' : 'all' });
      pc.ontrack = ev => {
        v.srcObject = ev.streams[0] || new MediaStream([ev.track]);
        try { ev.receiver.jitterBufferTarget = 0; } catch {}
      };
      pc.ondatachannel = ev => {
        if (ev.channel.label === 'input') dc = ev.channel;
        if (ev.channel.label === 'ctl') { ctl = ev.channel; ctl.onmessage = onCtl; }
        if (ev.channel.label === 'auth') ev.channel.onmessage = e => onAuth(ev.channel, e, mine);
        if (ev.channel.label === 'file') authed ? recvFile(ev.channel) : ev.channel.close(); // Д-2: файлы — только после входа
      };
      pc.onicecandidate = ev => ev.candidate && sig('ice', ev.candidate.toJSON());
      let was = false; // «потеряна» — только если соединение было; иначе путь не нашёлся вовсе
      pc.onconnectionstatechange = () => { if (mine !== pc) return; const st = mine.connectionState;
        if (st === 'connected') was = true;
        else if (st === 'failed') { if (again?.host === host && again.n++ < 3) redial(); else end(t(was ? 'lost' : 'nopath')); } };
      await pc.setRemoteDescription({ type: m.data.type, sdp: m.data.sdp });
      await pc.setLocalDescription();
      sig('answer', pc.localDescription);
        timer = setInterval(stats, 1000);
      } else if (m.type === 'ice') { if (ws === w) pc?.addIceCandidate(m.data); }
    };
    w.onclose = () => {
      if (cur !== att) return;
      if (ws === w) { if (pc?.connectionState !== 'connected') end(t('no_server')); }
      else if (!ws) fail(t('no_server'));
    };
  }
};
$('pw').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('bye').onclick = () => end(t('ended'));
if (typeof window.minimize === 'function') { $('minbtn').classList.remove('hidden'); $('minbtn').onclick = () => minimize(); }

// В браузере CPace — из pake.wasm (тот же Go-код, что в программе); грузится при первом подключении.
// go.run запускает Go асинхронно: pakeRespond появляется не сразу — ждём до 5 с. Неудача не запоминается.
let pakeReady;
async function loadPake() {
  if (typeof window.pakeRespond === 'function') return true;
  pakeReady ??= (async () => {
    if (typeof Go !== 'function') await new Promise((ok, no) => {
      const s = document.createElement('script');
      s.src = 'wasm_exec.js'; s.onload = ok; s.onerror = no;
      document.head.append(s);
    });
    const go = new Go();
    const r = await WebAssembly.instantiateStreaming(fetch('pake.wasm'), go.importObject);
    go.run(r.instance);
    for (let i = 0; i < 100 && typeof window.pakeRespond !== 'function'; i++) await new Promise(r => setTimeout(r, 50));
  })();
  try { await pakeReady; } catch {}
  pakeReady = null;
  return typeof window.pakeRespond === 'function';
}

// ---------- Известные хосты: ID → отпечаток ключа (в программе — в настройках, в браузере — localStorage) ----------
let trustNext = null;
const known = {
  get: async id => APP ? await knownGet(id) : (store.get('known', {})[id] || ''),
  set: async (id, fp) => { if (APP) return knownSet(id, fp); const k = store.get('known', {}); k[id] = fp; store.set('known', k); },
};
$('trust').onclick = () => { $('trust').classList.add('hidden'); $('go').click(); };

// ---------- Вход по CPace (REQ-S-02): пароль не покидает этот ПК, сервер его не видит ----------
let expect = '', authed = false; // authed — хост доказал CPace и ключ (Д-1, Д-2)
// Автопереподключение после обрыва (через relay рвётся на плохих линиях): до 3 попыток подряд.
// Пароль — только в памяти этой вкладки и только до конца сессии.
let again = null;
function redial() {
  const p = again;
  end('', true);
  $('id').value = p.host; $('pw').value = p.pw;
  setTimeout(async () => { await $('go').onclick(); if ($('msg').textContent === t('connecting')) $('msg').textContent = t('redial'); }, 1500);
}
function ckeys() { try { return JSON.parse(localStorage.getItem('ckeys')) || {}; } catch { return {}; } }
async function onAuth(ch, e, mine) {
  const m = JSON.parse(e.data);
  if (m.t === 'a') {
    // один обмен CPace на соединение: иначе поддельный хост (хаб) шлёт «a» с новой догадкой пароля раз за разом
    // и по ответу проверяет каждую — перебор мимо блокировки на хосте (REQ-S-04)
    if (mine !== pc) return; // сообщение старой попытки
    if (mine.cpace) return end(t('err') + t('e_hostauth'));
    mine.cpace = true;
    try {
      const r = await pakeRespond($('pw').value, m.salt, m.msg, host, pc.localDescription.sdp, pc.remoteDescription.sdp);
      expect = r.expect;
      // У3: свой ключ на этот хост — после входа по паролю хост его закрепит, и блокировка перебора владельца не запрёт
      const ks = ckeys(), k = typeof clientSign === 'function' && clientSign(ks[host]?.seed || '', host, pc.localDescription.sdp, pc.remoteDescription.sdp);
      if (k) { ks[host] = { seed: k.seed, pub: k.pub }; try { localStorage.setItem('ckeys', JSON.stringify(ks)); } catch {} }
      ch.send(JSON.stringify({ t: 'b', msg: r.msg, conf: r.conf, cpub: k?.pub, csig: k?.sig }));
    } catch (err) { end(t('err') + err); }
  } else if (m.t === 'ok') {
    if (!expect || m.conf !== expect) return end(t('err') + t('e_hostauth')); // Д-1: «ok» без обмена CPace — подмена // ответил не тот хост или соединение подменено
    // REQ-S-05: подпись хоста над DTLS-отпечатками; отпечаток его ключа запоминается при первом входе (TOFU)
    let fp;
    try { fp = await hostVerify(m.pub, m.sig, host, pc.localDescription.sdp, pc.remoteDescription.sdp); }
    catch { return end(t('err') + t('e_hostauth')); }
    const was = await known.get(host);
    if (was && was !== fp && !(trustNext?.host === host && trustNext.fp === fp)) {
      trustNext = { host, fp };
      end(t('err') + t('e_keychanged'));
      $('trust').classList.remove('hidden');
      return;
    }
    trustNext = null; expect = ''; authed = true;
    document.body.classList.toggle('view', !!m.view); // REQ-F-20: режим сессии решает хост (мог сузить сам)
    if (was !== fp) await known.set(host, fp);
    again = { host: target, pw: $('pw').value || again?.pw, n: 0 };
    show(true); v.focus(); $('pw').value = '';
    store.set('recent', [target, ...store.get('recent', []).filter(x => x !== target)].slice(0, 8)); renderRecent();
  } else if (m.t === 'ask') $('msg').textContent = t('asking');
  else if (m.t === 'denied') end(t('err') + t('e_denied'));
  else if (m.t === 'fail') end(t('err') + t('e_auth'));
  else if (m.t === 'busy') end(t('err') + t('e_busy')); // пароль верный, но другой вход успел раньше
  else if (m.t === 'locked') end(t('err') + t('e_locked'));
}

// ---------- Буфер обмена (REQ-F-11): текст, в обе стороны, без эха ----------
const CLIP_MAX = 60 * 1024; // как agent.ClipMax (в байтах UTF-8)
const clipOK = x => x && new TextEncoder().encode(x).length <= CLIP_MAX;
function onCtl(e) {
  const m = JSON.parse(e.data);
  if (m.t === 'monitors') return showMonitors(m); // хост шлёт список при открытии канала, до входа
  if (m.t === 'cur') return authed && showCursor(m);
  if (!authed || m.t !== 'clip' || !clipOK(m.text)) return; // Д-2
  lastClip = m.text;
  (APP ? setClip(m.text) : navigator.clipboard?.writeText(m.text))?.catch?.(() => {});
}
async function pushClip() {
  if (!authed || ctl?.readyState !== 'open') return; // Д-2: буфер — только проверенному хосту
  let x = '';
  try { x = APP ? await getClip() : document.hasFocus() ? await navigator.clipboard.readText() : ''; } catch {}
  if (clipOK(x) && x !== lastClip) { lastClip = x; ctl.send(JSON.stringify({ t: 'clip', text: x })); }
}
// Опрос раз в секунду: в программе — своя привязка; в браузере — только с постоянным разрешением clipboard-read (Chrome после
// «Разрешить»): по событию focus терялось скопированное в соседней вкладке. Firefox разрешения не даёт и на каждое чтение
// показывает у курсора кнопку «Вставить» — там только при возврате фокуса.
// Firefox такого разрешения не знает (query отвергается): там буфер уходит только по Ctrl+V в окне или кнопкой «Передать буфер».
let clipGranted = false, clipPerm = false;
const clipBtn = () => $('clipbtn').classList.toggle('hidden', APP || clipGranted);
navigator.permissions?.query({ name: 'clipboard-read' }).then(p => { clipPerm = true; const f = () => { clipGranted = p.state === 'granted'; clipBtn(); }; f(); p.onchange = f; }).catch(clipBtn);
clipBtn();
setInterval(() => (APP || clipGranted) && pushClip(), 1000); if (!APP) window.addEventListener('focus', () => clipPerm && pushClip());
$('clipbtn').onclick = () => { lastClip = ''; pushClip(); v.focus(); }; // нажатие — действие человека: Firefox покажет «Вставить» один раз, по просьбе

// Ctrl/Cmd+V в окне сеанса: сначала буфер этого ПК — на удалённый, потом само V (иначе там вставится старый буфер).
// Текст — из события paste в скрытое поле: так Firefox не показывает свою кнопку «Вставить».
// ponytail: буфер (канал ctl) и нажатие (канал input) не упорядочены между собой — V уходит через 150 мс после буфера;
// на relay с потерями может не хватить — тогда передавать нажатие через ctl вместе с буфером.
const pasteBox = Object.assign(document.createElement('textarea'), { tabIndex: -1 });
pasteBox.setAttribute('aria-hidden', 'true');
pasteBox.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0';
document.body.append(pasteBox);
let pasting = null; // { timer, ups } — V отложено до paste; отпускания (и Ctrl) — после него, иначе там «v» без Ctrl
const isPaste = e => !APP && authed && (e.ctrlKey || e.metaKey) && !e.altKey && e.code === 'KeyV';
function pasteNow(x) {
  if (!pasting || pasting.done) return;
  clearTimeout(pasting.timer); pasting.done = true; v.focus();
  const sent = clipOK(x) && x !== lastClip && ctl?.readyState === 'open';
  if (sent) { lastClip = x; ctl.send(JSON.stringify({ t: 'clip', text: x })); }
  setTimeout(() => { const ups = pasting.ups; pasting = null; sendIn({ t: 'k', c: 'KeyV', d: true }); ups.forEach(c => sendIn({ t: 'k', c, d: false })); }, sent ? 150 : 0);
}
pasteBox.addEventListener('paste', e => { e.preventDefault(); pasteNow(e.clipboardData?.getData('text/plain') || ''); });

// ---------- Файлы (REQ-F-12): свой канал "file" на каждый файл, протокол — agent/file.go ----------
const CHUNK = 16 * 1024, HIGH = 4 << 20;
function xfer(dir, name, size, cancel) {
  const el = document.createElement('span'), txt = document.createElement('span'), x = document.createElement('button');
  x.textContent = '×'; x.title = t('f_cancel'); x.onclick = cancel;
  el.append(txt, x); $('xfers').append(el);
  const set = s => txt.textContent = `${dir} ${name} ${s} `;
  set('0%');
  return { progress: n => set(Math.floor(n * 100 / Math.max(size, 1)) + '%'),
           finish: msg => { set(msg); x.remove(); setTimeout(() => el.remove(), 10000); } };
}
// id для докачки: тот же файл (имя, размер, время изменения) → тот же id.
async function fileId(f) {
  try {
    const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(`${f.name}|${f.size}|${f.lastModified}`));
    return [...new Uint8Array(d)].slice(0, 16).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch { return ''; } // без id — без докачки
}
function cancelCh(ch) { if (ch.readyState === 'open') ch.send(JSON.stringify({ t: 'cancel' })); ch.close(); }

async function sendFile(file) { // на удалённый ПК, в его «Загрузки»; повторная отправка докачивает
  if (!pc || !ctl) return;
  const id = await fileId(file);
  const ch = pc.createDataChannel('file');
  ch.binaryType = 'arraybuffer'; ch.bufferedAmountLowThreshold = HIGH / 4;
  let finished = false, cancelled = false, resumeAt;
  const resumed = new Promise(r => resumeAt = r);
  const ui = xfer('↑', file.name, file.size, () => { cancelled = true; cancelCh(ch); });
  ch.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === 'resume') return resumeAt(m.offset || 0);
    finished = true; ui.finish(m.t === 'done' ? '✓ ' + t('f_done_up') : '✗ ' + (m.msg || t('f_err'))); ch.close();
  };
  ch.onclose = () => { resumeAt(-1); if (!finished) ui.finish('✗ ' + t(cancelled ? 'f_cancel' : 'f_broken')); };
  ch.onopen = async () => {
    ch.send(JSON.stringify({ t: 'meta', name: file.name, size: file.size, id }));
    let off = await resumed;
    if (off < 0) return;
    ui.progress(off);
    while (off < file.size) {
      const buf = await file.slice(off, off + (1 << 20)).arrayBuffer();
      for (let i = 0; i < buf.byteLength; i += CHUNK) {
        if (ch.readyState !== 'open') return;
        if (ch.bufferedAmount > HIGH) await new Promise(r => ch.onbufferedamountlow = r);
        ch.send(buf.slice(i, i + CHUNK));
      }
      off += buf.byteLength; ui.progress(off);
    }
    ch.send(JSON.stringify({ t: 'end' }));
  };
}

function concat(list, n) { const out = new Uint8Array(n); let o = 0; for (const b of list) { out.set(new Uint8Array(b), o); o += b.byteLength; } return out; }
function b64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }

function recvFile(ch) { // с удалённого ПК (хост открыл канал после выбора файла)
  // В программе — сразу на диск через Go (fileOpen/fileWrite, с докачкой); в браузере — в памяти, без докачки.
  ch.binaryType = 'arraybuffer';
  let meta, ui, finished = false, cancelled = false, got = 0;
  let h = null, q = Promise.resolve(), buf = [], bufN = 0, parts = [];
  const flush = () => { if (!bufN) return q; const c = concat(buf, bufN); buf = []; bufN = 0; return q = q.then(() => fileWrite(h, b64(c))); };
  ch.onmessage = async e => {
    if (typeof e.data !== 'string') {
      got += e.data.byteLength; ui?.progress(got);
      if (APP) { buf.push(e.data); bufN += e.data.byteLength; if (bufN >= 1 << 20) flush(); } else parts.push(e.data);
      return;
    }
    const m = JSON.parse(e.data);
    if (m.t === 'meta') {
      meta = m;
      ui = xfer('↓', m.name, m.size, () => { cancelled = true; cancelCh(ch); });
      let off = 0;
      if (APP) {
        try { const r = await fileOpen(m.name, m.size, m.id || ''); h = r.handle; off = r.offset; }
        catch (err) { ui.finish('✗ ' + err); return ch.close(); }
      }
      got = off; ui.progress(off);
      ch.send(JSON.stringify({ t: 'resume', offset: off }));
    } else if (m.t === 'end') {
      finished = true;
      try {
        let sum = '';
        if (APP) { await flush(); const r = await fileFinish(h); h = null; sum = r.sha256; }
        else {
          if (got !== meta.size) throw 'size';
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob(parts)); a.download = meta.name; a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 60000);
          parts = [];
        }
        ch.send(JSON.stringify({ t: 'done', sha256: sum })); ui.finish('✓ ' + t('f_done_down'));
      } catch (err) { ch.send(JSON.stringify({ t: 'err', msg: String(err) })); ui.finish('✗ ' + t('f_err')); }
      setTimeout(() => ch.close(), 1000);
    }
  };
  ch.onclose = async () => {
    if (finished) return;
    ui?.finish('✗ ' + t(cancelled ? 'f_cancel' : 'f_broken'));
    if (APP && h !== null) { // обрыв: дописать принятое и оставить часть для докачки; отмена — удалить
      const hh = h; h = null;
      await flush().catch(() => {});
      fileAbort(hh, !cancelled);
    }
  };
}
$('fsend').onclick = () => $('fpick').click();
$('fpick').onchange = () => { [...$('fpick').files].forEach(sendFile); $('fpick').value = ''; v.focus(); };
$('fget').onclick = () => { ctl?.readyState === 'open' && ctl.send(JSON.stringify({ t: 'pick' })); v.focus(); };
v.addEventListener('dragover', e => e.preventDefault());
v.addEventListener('drop', e => { e.preventDefault(); [...e.dataTransfer.files].forEach(sendFile); });

// ---------- Мониторы (REQ-F-09): список от хоста, выбор — перезапуск захвата на нём ----------
function showMonitors(m) {
  const sel = $('mon'), list = m.list || [];
  sel.replaceChildren(...list.map((x, i) => {
    const o = document.createElement('option');
    o.value = i; o.title = x.name; o.textContent = `${i + 1}${x.primary ? ' ★' : ''} · ${x.w}×${x.h}`;
    return o;
  }));
  sel.value = m.cur;
  sel.classList.toggle('hidden', list.length < 2);
  speedMode = false; markQuality(); $('qsel').classList.remove('hidden'); // новая сессия — хост в «качестве»
}

// ---------- Картинка: «качество» (чёткость; на слабом канале меньше к/с) / «скорость» (к/с; на канале < 2 Мбит/с — 720p).
// По проводу — p: "text" | "video" (имена первой редакции, хосты v0.1.13 их уже понимают) ----------
let speedMode = false;
const markQuality = () => document.querySelectorAll('#qsel button').forEach(b => b.setAttribute('aria-pressed', (b.dataset.q === '1') === speedMode));
function setQuality(speed) {
  speedMode = speed; markQuality();
  ctl?.readyState === 'open' && ctl.send(JSON.stringify({ t: 'quality', p: speed ? 'video' : 'text' }));
  for (const r of pc?.getReceivers() || []) if (r.track?.kind === 'video') r.playoutDelayHint = speed ? 0.15 : 0; // скорость: джиттер-буфер побольше ради плавности (Chrome)
}
document.querySelectorAll('#qsel button').forEach(b => b.onclick = () => { setQuality(b.dataset.q === '1'); v.focus(); });

// ---------- Курсор хоста отдельно от видео ({"t":"cur"}): с мышью — форма курсора над картинкой, на сенсорном экране — стрелка в точке ----------
const FINE = matchMedia('(pointer:fine)').matches;
function showCursor(m) {
  if (FINE) { v.style.cursor = m.c && m.c !== 'none' ? m.c : 'default'; return; }
  const r = v.getBoundingClientRect(), vw = v.videoWidth, vh = v.videoHeight, s = Math.min(r.width / vw, r.height / vh);
  if (!vw || m.c === 'none') return $('cur').classList.add('hidden');
  $('cur').style.left = r.left + (r.width - vw * s) / 2 + (m.x || 0) / 65535 * vw * s + 'px';
  $('cur').style.top = r.top + (r.height - vh * s) / 2 + (m.y || 0) / 65535 * vh * s + 'px';
  $('cur').classList.remove('hidden');
}
try { $('turbo').checked = localStorage.getItem('turbo') !== '0'; } catch {} // по умолчанию включено; ponytail: выбор помним только в этом браузере
$('turbo').onchange = e => { try { localStorage.setItem('turbo', e.target.checked ? '1' : '0'); } catch {} };
$('mon').onchange = () => { ctl?.readyState === 'open' && ctl.send(JSON.stringify({ t: 'monitor', i: +$('mon').value })); v.focus(); };

// ---------- Полный экран ----------
let full = false; // имена fs/process/path/crypto не занимать ни переменными, ни id: их берёт wasm_exec.js
async function setFs(on) {
  if (full === on) return;
  full = on;
  document.body.classList.toggle('fs', on);
  $('fsbtn').textContent = t(on ? 'fs_exit' : 'fs');
  if (APP) return window.fullscreen(on);
  try {
    if (on) { await document.documentElement.requestFullscreen(); await navigator.keyboard?.lock(); }
    else if (document.fullscreenElement) await document.exitFullscreen();
  } catch {}
}
$('fsbtn').onclick = () => { setFs(!full); v.focus(); };
document.addEventListener('fullscreenchange', () => { if (!APP && !document.fullscreenElement) setFs(false); });

// ---------- Ввод (ТЗ §7, канал input) ----------
function pos(e) { // координаты внутри картинки (object-fit: contain) → 0..65535
  const r = v.getBoundingClientRect(), vw = v.videoWidth, vh = v.videoHeight;
  if (!vw) return null;
  const s = Math.min(r.width / vw, r.height / vh);
  const x = (e.clientX - r.left - (r.width - vw * s) / 2) / (vw * s), y = (e.clientY - r.top - (r.height - vh * s) / 2) / (vh * s);
  return x < 0 || x > 1 || y < 0 || y > 1 ? null : { x: Math.round(x * 65535), y: Math.round(y * 65535) };
}
v.onpointermove = e => { const p = pos(e); p && sendIn({ t: 'm', ...p }); };
v.onpointerdown = e => {
  const p = pos(e); if (!p || e.button > 2) return;
  v.focus(); v.setPointerCapture(e.pointerId); e.preventDefault();
  sendIn({ t: 'm', ...p }); sendIn({ t: 'b', b: e.button, d: true });
};
v.onpointerup = e => e.button <= 2 && sendIn({ t: 'b', b: e.button, d: false });
v.oncontextmenu = e => e.preventDefault();
v.addEventListener('wheel', e => {
  e.preventDefault();
  const k = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? 400 : 1.2; // строки/страницы/пиксели → единицы WHEEL_DELTA (120)
  if (e.deltaY) sendIn({ t: 'w', v: Math.round(-e.deltaY * k) });
  if (e.deltaX) sendIn({ t: 'h', v: Math.round(e.deltaX * k) });
}, { passive: false });

const capturing = () => dc && !$('sess').classList.contains('hidden') && document.activeElement?.tagName !== 'INPUT';
document.addEventListener('keydown', e => {
  if (!capturing() || e.repeat && pasting) return;
  if (isPaste(e) && !pasting) { // без preventDefault: браузер вставит в pasteBox → событие paste
    held.add(e.code); pasteBox.value = ''; pasteBox.focus();
    pasting = { timer: setTimeout(() => pasteNow(''), 300), ups: [] }; // paste не пришло (нет текста) — V как есть
    return;
  }
  e.preventDefault(); held.add(e.code); sendIn({ t: 'k', c: e.code, d: true });
});
document.addEventListener('keyup', e => {
  if (!capturing()) return;
  e.preventDefault(); held.delete(e.code);
  if (pasting) { pasting.ups.push(e.code); return; } // отпускания — после отложенного нажатия V
  sendIn({ t: 'k', c: e.code, d: false });
});
function releaseAll() { held.forEach(c => sendIn({ t: 'k', c, d: false })); held.clear(); }
window.addEventListener('blur', releaseAll); // переключились в другое окно — не оставить зажатый Alt на удалённом ПК
document.querySelectorAll('[data-keys]').forEach(b => b.onclick = () => {
  const k = b.dataset.keys.split(' ');
  k.forEach(c => sendIn({ t: 'k', c, d: true })); [...k].reverse().forEach(c => sendIn({ t: 'k', c, d: false }));
  v.focus();
});

// ---------- Статистика: 1 замер/с, копится до «Сброс» ----------
// ponytail: только в памяти окна — закрыл, потерял; выгружай CSV.
const KEYS = ['t', 'path', 'rtt', 'fps', 'kbps', 'lost', 'rx', 'jb', 'frz'];
const sum = a => a.reduce((x, y) => x + y, 0);
const pct = (a, p) => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(p / 100 * s.length))]; };
$('reset').onclick = () => { samples = []; $('sum').textContent = ''; };
$('csv').onclick = () => {
  const csv = [KEYS.join(','), ...samples.map(s => KEYS.map(k => s[k]).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `anypc-stats-${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.csv`;
  a.click();
};
function summary() {
  const c = k => samples.map(s => s[k]), n = samples.length;
  if (!n) return '';
  const lost = sum(c('lost')), rx = sum(c('rx'));
  const md = t('med'), ms = t('ms');
  return `${t('s_for').replace('{n}', n)}: RTT ${md} ${pct(c('rtt'), 50)} / P95 ${pct(c('rtt'), 95)} / ${t('max')} ${pct(c('rtt'), 100)} ${ms} · ` +
    `${t('fps')} ${md} ${pct(c('fps'), 50)} / P5 ${pct(c('fps'), 5)} · ${t('kbps')} ${md} ${pct(c('kbps'), 50)} · ` +
    `${t('loss')} ${(lost / Math.max(1, lost + rx) * 100).toFixed(2)} % · ${t('jb')} ${md} ${pct(c('jb'), 50)} / P95 ${pct(c('jb'), 95)} ${ms} · ` +
    `${t('frz')} ${sum(c('frz'))} · TURN ${Math.round(c('path').filter(p => p === 'TURN').length / n * 100)} %`;
}
async function stats() { // REQ-F-17
  if (!pc) return;
  const r = await pc.getStats();
  let pair, inb;
  r.forEach(s => {
    if (s.type === 'transport' && s.selectedCandidatePairId) pair = r.get(s.selectedCandidatePairId);
    if (s.type === 'inbound-rtp' && s.kind === 'video') inb = s;
  });
  if (!pair || !inb) return;
  const loc = r.get(pair.localCandidateId)?.candidateType, rem = r.get(pair.remoteCandidateId)?.candidateType;
  const path = loc === 'relay' || rem === 'relay' ? 'TURN' : 'P2P';
  const codec = (r.get(inb.codecId)?.mimeType || '').replace('video/', '').replace('H264', 'H.264'); // VP9 («Турбо») или H.264
  const rtt = Math.round((pair.currentRoundTripTime || 0) * 1000), fps = inb.framesPerSecond || 0;
  const now = { b: inb.bytesReceived, t: inb.timestamp, rx: inb.packetsReceived, lost: inb.packetsLost,
                jbd: inb.jitterBufferDelay || 0, jbn: inb.jitterBufferEmittedCount || 0, frz: inb.freezeCount || 0 };
  let kbps = 0;
  if (last) {
    kbps = Math.round((now.b - last.b) * 8 / (now.t - last.t));
    samples.push({ t: new Date().toISOString(), path, rtt, fps, kbps, lost: now.lost - last.lost, rx: now.rx - last.rx,
      jb: now.jbn > last.jbn ? Math.round((now.jbd - last.jbd) / (now.jbn - last.jbn) * 1000) : 0, frz: now.frz - last.frz });
    $('sum').textContent = summary();
  }
  last = now;
  $('st').textContent = `${host} · ${path} (${loc}/${rem}) · ${codec} · RTT ${rtt} ${t('ms')} · ${fps} ${t('fps')} · ${kbps} ${t('kbps')} · ${inb.frameWidth || 0}×${inb.frameHeight || 0}` + (document.body.classList.contains('view') ? ' · ' + t('view_s') : '');
}
